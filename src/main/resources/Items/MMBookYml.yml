ShenZuChangLaoDeWeiTuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>神族長老的委託</blue>"
  Display: "<blue>神族長老的委託</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "恩，東西拿著，到<dark_green><italic>下界</italic></dark_green><black>去一趟吧。</black><dark_green><italic>聖山</italic></dark_green><black>最近有些不太對勁。<newline>你不知道</black><dark_green><italic>聖山</italic></dark_green><black>是什麼？</black><dark_green><italic>聖山</italic></dark_green><black>是我們的起源，</black><dark_red><underlined>盤古神</underlined></dark_red><black>的殞落地。現在由</black><dark_red><underlined>四聖獸</underlined></dark_red><black>鎮守著，而這股力量維持著宇宙的平衡和運轉。<newline>最近我感覺到</black><dark_green><italic>聖山</italic></dark_green><black>的能量有些紊亂，你就去查查看到底發生什麼事情吧。<newline>到</black><dark_green><italic>下界</italic></dark_green><black>之後，直接去找</black><black><underlined>人族</underlined></black><black>城市的</black><dark_red><underlined>皇</underlined></dark_red><black>，他會接待你的。</black>"
RenHuangDeGuLu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>人皇的顧慮</blue>"
  Display: "<blue>人皇的顧慮</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "神上，您終於來了。<dark_red><underlined>朕</underlined></dark_red><black>等的好辛苦啊……<newline>最近這幾日，城周圍的野獸異常的狂暴阿……<newline>啊？您不是來解決這件事情的？<newline>好吧……那朕再找其他人幫忙……如果是</black><dark_green><italic>聖山</italic></dark_green><black>的事情，可能要請您去詢問</black><dark_red><underlined>護國法師-法海</underlined></dark_red><black>了。<newline>喔對了，這是城中的</black><blue>簡易地圖</blue><black>，您可以直接到</black><dark_green><italic>皇宮東側</italic></dark_green><black>找到<newline></black><dark_red><underlined>法海大師</underlined></dark_red><black>。<newline>注：請用</black><blue>神族證明</blue><black>向</black><dark_red><underlined>人皇</underlined></dark_red><black>換取</black><blue>地圖</blue><black></black>"
RenJieDeDongDang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>人界的動盪</blue>"
  Display: "<blue>人界的動盪</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "我相信道友你剛飛升上來應該也知道，最近<dark_green><italic>下界</italic></dark_green><black>的情況有些蹊蹺，</black><black><underlined>人族</underlined></black><black></black><dark_green><italic>皇城</italic></dark_green><black>的周圍動物變得越來越狂暴，我認為或許跟一些非下界的事物影響有關…例如</black><black><underlined>妖族</underlined></black><black>或是</black><black><underlined>神族</underlined></black><black>……總之，你先到</black><dark_green><italic>皇城</italic></dark_green><black>去找</black><dark_red><underlined>御前帶刀侍<newline></underlined></dark_red><dark_red><underlined>衛長-羽羅</underlined></dark_red><black>，他會告訴你更詳細的訊息，到時候隨機應變，務必協助</black><black><underlined>人族</underlined></black><black>調查出這件事情背後的原因……我想，太平的日子不會持續太久了……</black>"
YuLuoDeBaoGao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>羽羅的報告</blue>"
  Display: "<blue>羽羅的報告</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "恭迎上仙駕臨，在下是<dark_red><underlined>御前帶<newline></underlined></dark_red><dark_red><underlined>刀侍衛長-羽羅</underlined></dark_red><black>。已經提前得知上仙要來的消息，特地在此等待的。<newline>如上仙所知的，近日來各地的動物變得相當狂暴，雖然已經派了</black><black><underlined>人族</underlined></black><black>的</black><dark_red><underlined>特遣隊員</underlined></dark_red><black>前往調查，但是</black><dark_red><underlined>皇上</underlined></dark_red><black>還是不太放心，希望上仙可以協助進行調查。<newline>請上仙前往</black><dark_green><italic>皇城東方的龍鱗<newline></italic></dark_green><dark_green><italic>之森</italic></dark_green><black>，並與其中的</black><dark_green><italic>龍鬚鎮</italic></dark_green><black></black><dark_red><underlined>祭司</underlined></dark_red><black>接洽吧，她應該對森林內的事物瞭若指掌。<newline></black>"
    - "另外，這是<dark_green><italic>皇城</italic></dark_green><black>的</black><blue>簡易地圖</blue><black>，上仙就先拿著吧，比較容易了解各個區域的位置。<newline><newline>注：請用</black><blue>仙族證明</blue><black>向</black><dark_red><underlined>羽羅</underlined></dark_red><black>換取</black><blue>地圖</blue><black></black>"
ShuaiTuiDeLongZhiLi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>衰退的龍之力</blue>"
  Display: "<blue>衰退的龍之力</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "你……是<black><underlined>仙人</underlined></black><black>？我可以感覺到你身上的修真之力。<newline>我？我只是</black><dark_red><underlined>青龍大人</underlined></dark_red><black>的一縷分魂罷了。<newline>我知道你是為什麼前來，我得告訴你，你的問題我沒有辦法解決。<newline></black><dark_green><italic>神廟</italic></dark_green><black>所支撐的結界確實在減弱，如果</black><dark_red><underlined>青龍大人</underlined></dark_red><black>和其他的</black><dark_red><underlined>聖<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>們再不回歸</black><dark_green><italic>神廟</italic></dark_green><black>駐守的話，結界終將消失，而世界秩序也將會重新建立。當然，在建立的過程中一定會死傷無數……<newline></black>"
    - "依我的能力，也沒有辦法探知<newline><dark_red><underlined>聖獸</underlined></dark_red><black>們的所在位置，更別說將他們請回</black><dark_green><italic>神廟</italic></dark_green><black>來駐守了。<newline>但如果是你的話，或許會有辦法也不一定。<newline></black><dark_red><underlined>青龍大人</underlined></dark_red><black>在離開</black><dark_green><italic>神廟</italic></dark_green><black>之前，利用聖力開闢了一處空間，用來試煉對自己的知識有信心的人們，若你能通過</black><dark_red><underlined>青龍大人</underlined></dark_red><black>的考驗，就會獲得他的祝福。或許這樣就能夠獲悉</black><dark_red><underlined>聖獸</underlined></dark_red><black>們的位置。如果還是探查不到的話，將</black><dark_red><underlined>四聖獸</underlined></dark_red><black>的祝福蒐集齊全</black>"
    - "或許會有辦法的。<newline>只要前往<dark_green><italic>神廟的二樓</italic></dark_green><black>位置就可以進行試練了，祝你好運。<newline><newline>注：獲得青龍祝福之後回到<newline></black><dark_green><italic>皇城</italic></dark_green><black>向</black><dark_red><underlined>羽羅</underlined></dark_red><black>回報狀況</black>"
WeiZhiDeShengShouXingZong:
  Id: "WRITTEN_BOOK"
  Title: "<blue>未知的聖獸行蹤</blue>"
  Display: "<blue>未知的聖獸行蹤</blue>"
  Author: "<blue>[必讀]仙族主線</blue>"
  Pages:
    - "原來如此，即使獲得了<dark_red><underlined>青龍</underlined></dark_red><black>的祝福，依舊無法感知</black><dark_red><underlined>聖獸</underlined></dark_red><black>的位置嗎？<newline>那或許就跟</black><dark_red><underlined>分魂大人</underlined></dark_red><black>說的一樣，要將</black><dark_red><underlined>四聖獸</underlined></dark_red><black>的祝福蒐集齊全了。<newline><newline>其他三座</black><dark_green><italic>祭壇</italic></dark_green><black>分別是南方的<newline></black><dark_green><italic>朱雀祭壇</italic></dark_green><black>，西方的</black><dark_green><italic>白虎祭壇</italic></dark_green><black>，北方的</black><dark_green><italic>玄武祭壇</italic></dark_green><black>。<newline>如果試煉的途中失敗了重生的話，可以到</black><dark_green><italic>皇宮東側</italic></dark_green><black>的</black><dark_red><underlined>護國<newline></underlined></dark_red><dark_red><underlined>法師</underlined></dark_red><black>那裏去借用法寶，古時候某位仙人放置在這裡的</black>"
    - "<dark_green><italic>重華鏡</italic></dark_green><black>。利用那面鏡子，就可以前往曾經去過的</black><dark_green><italic>祭壇</italic></dark_green><black>。可以節省不少路途時間。<newline><newline>若是集齊了</black><dark_red><underlined>四大聖獸</underlined></dark_red><black>的祝福，就回來</black><dark_green><italic>皇城</italic></dark_green><black>吧，我想到時候</black><dark_red><underlined>護<newline></underlined></dark_red><dark_red><underlined>國法師大人</underlined></dark_red><black>會有辦法協助你的。<newline></black>"
    - "他就住在<dark_green><italic>皇宮的東側</italic></dark_green><black>，和</black><dark_green><italic>重華<newline></italic></dark_green><dark_green><italic>鏡</italic></dark_green><black>在同一個地方，得到祝福之力之後，就去找他吧。<newline><newline></black><dark_red>注：請務必將四聖獸的祝福<newline></dark_red><dark_red>之力蒐集完全之後再進行下<newline></dark_red><dark_red>一階段的任務，否則你將無法<newline></dark_red><dark_red>前往下一個任務的指定地點<newline></dark_red><dark_red>。</dark_red><black></black>"
ShengShouDeQuXiang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>聖獸的去向</blue>"
  Display: "<blue>聖獸的去向</blue>"
  Author: "<blue>人族主線</blue>"
  Pages:
    - "年輕人，我在你身上感覺到了<newline><dark_red><underlined>四聖獸</underlined></dark_red><black>的氣息……<newline>原來如此，是</black><dark_red><underlined>李莫年</underlined></dark_red><black>叫你去辦的事，這老傢伙倒是挺有心的。<newline>這麼多年了，我總算有機會知道</black><dark_red><underlined>聖獸</underlined></dark_red><black>的去向了。<newline>〔</black><dark_red><underlined>法海</underlined></dark_red><black>身上漸漸聚集著金色的光芒〕<newline>居然……居然這麼近嗎……不過也難怪我沒發現，被結界保護起來了……<newline></black><dark_red><underlined>四聖獸</underlined></dark_red><black>沉睡的地方，就在北方的</black><dark_green><italic>聖山</italic></dark_green><black>當中。<newline></black>"
    - "前往那裏務必小心，那座山由一群神秘的人保護著，他們住的島嶼叫做<dark_green><italic>蓬萊</italic></dark_green><black>。<newline>你可以在北方的</black><dark_green><italic>港口</italic></dark_green><black>搭到前往</black><dark_green><italic>蓬萊</italic></dark_green><black>的船隻。<newline>記住，準備好了再出發，誰也不知道</black><dark_red><underlined>聖獸</underlined></dark_red><black>沉睡之處有什麼危險潛伏在其中。<newline>我有幸認識其中一位住在</black><dark_green><italic>蓬<newline></italic></dark_green><dark_green><italic>萊</italic></dark_green><black>的仙人，他叫做</black><dark_red><underlined>凱歌</underlined></dark_red><black>，你如果能夠登上</black><dark_green><italic>蓬萊島</italic></dark_green><black>的話，去問問看他吧，就說是我派你去的，他應該看在我的面子上，能夠給你一些幫助。</black>"
ZhuFuZhiDi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>祝福之地</blue>"
  Display: "<blue>祝福之地</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "道友你好，我是<dark_red><underlined>護國法師</underlined></dark_red><black>，請直呼我的法號-</black><dark_red><underlined>法海</underlined></dark_red><black>即可。<newline>我知道你是因為</black><dark_red><underlined>羽羅</underlined></dark_red><black>的吩咐前來，所以你已經得到了祝福的力量嗎？<newline>那麼，就讓我來幫助你吧……</black><dark_red><underlined>聖<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>到底在何處……<newline>〔光線匯聚到你的身上，然後射向了北方〕<newline>原來如此，就在北方的</black><dark_red><underlined>深山</underlined></dark_red><black>之中嗎……<newline>北邊有一個以守護他們</black><dark_green><italic>聖山</italic></dark_green><black>為生存目標的民族-</black><black><underlined>蓬萊</underlined></black><black>。<newline></black>"
    - "<black><underlined>蓬萊</underlined></black><black>的族人很排外，不過我想對於擁有</black><dark_red><underlined>聖獸</underlined></dark_red><black>祝福的你來說應該不是問題。<newline>你就到</black><dark_green><italic>蓬萊島</italic></dark_green><black>去吧，北方有前往</black><dark_green><italic>蓬萊</italic></dark_green><black>的船隻，到了當地去找一位叫做</black><dark_red><underlined>凱歌</underlined></dark_red><black>的道友，他是我以前有幸結識的</black><black><underlined>蓬萊</underlined></black><black>族人，他會給予你幫助的。</black>"
ShengShanDeYiChangZhuangKuang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>聖山的異常狀況</blue>"
  Display: "<blue>聖山的異常狀況</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "神上駕到，有失遠迎，請神上恕罪。請問神上這次來是……？<newline>原來如此，是和<dark_green><italic>聖山</italic></dark_green><black>有關的事情嗎……<newline>基本上，我對於</black><dark_green><italic>聖山</italic></dark_green><black>的了解可能還不如</black><black><underlined>神族</underlined></black><black>的各位神上來的清楚，不過我會盡我所能的告訴您。<newline>據我所知，</black><dark_green><italic>聖山</italic></dark_green><black>是</black><dark_red><underlined>盤古大神</underlined></dark_red><black>開天闢地之後，力盡殞落之地。此處靈氣充沛，並且由</black><dark_green><italic>蓬萊仙<newline></italic></dark_green><dark_green><italic>島</italic></dark_green><black>的</black><black><underlined>蓬萊族</underlined></black><black>守護著。<newline></black>"
    - "最近的確有感覺到來自<dark_green><italic>聖山</italic></dark_green><black>方向的異常氣息，但是因為距離遙遠，無法得知詳細的情況。<newline>這樣吧，這裡有一面</black><dark_green><italic>重華鏡</italic></dark_green><black>，雖說是仙人留在這裡的法寶，但這其實是上古神器，據說讓神來使用的話，可以化千里於一沙隙，瞬間到達各地。<newline>就請神上利用</black><dark_green><italic>重華鏡</italic></dark_green><black>前往</black><dark_green><italic>聖<newline></italic></dark_green><dark_green><italic>山</italic></dark_green><black>一探究竟吧。<newline><newline>注：使用</black><dark_green><italic>重華鏡</italic></dark_green><black>後，找</black><dark_red><underlined>法海</underlined></dark_red><black>回報</black>"
FengBiDeShengShan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>封閉的聖山？</blue>"
  Display: "<blue>封閉的聖山？</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "原來如此……想必這是<dark_green><italic>聖山</italic></dark_green><black>的自我防衛系統，不過這究竟和</black><dark_red><underlined>聖<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>的祝福有什麼關係呢？<newline>我想，您可能還是要詢問一下神上族內的</black><dark_red><underlined>長老大人</underlined></dark_red><black>，他對於<newline></black><dark_green><italic>聖山</italic></dark_green><black>的事情以及</black><dark_red><underlined>聖獸</underlined></dark_red><black>的事情會比較了解。或許他能告訴您造成現況可能的原因。</black>"
LianDanRuMen:
  Id: "WRITTEN_BOOK"
  Title: "<gold>煉丹入門</gold>"
  Display: "<gold>煉丹入門</gold>"
  Author: "<blue>丹藥舖掌櫃</blue>"
  Pages:
    - "煉丹師是辛苦但是強大的職業，這本書將會教導你如何煉製<blue>丹藥</blue><black>。<newline><newline>一、備材<newline>首先，</black><blue>丹藥</blue><black>的煉製需要</black><blue>「藥引<newline></blue><blue>」</blue><black>以及</black><blue>「元素」</blue><black>。</black><blue>藥引</blue><black>分為初級、中級和高級三種。有了材料之後就可以到大城鎮的</black><dark_green><italic>煉丹房</italic></dark_green><black>進行煉製。<newline></black>"
    - "二、配材<newline>煉丹最重要的除了配方以外，還有「材料的順序」。進入<newline><dark_green><italic>煉丹房</italic></dark_green><black>後，開啟</black><dark_green><italic>煉丹爐</italic></dark_green><black>，總共有五格可以放置藥材的空間。其中，最左側的格子一定要放置</black><blue>「藥引」</blue><black>，而右側的格子則依序放入所需要的藥材。</black><blue>元<newline></blue><blue>素</blue><black>的順序必須依照「金木水火土」的順序放置，不能顛倒或空一格。<newline></black>"
    - "三、丹藥的煉製<newline>將<blue>丹藥</blue><black>的材料按照配方需求放置好之後，就可以按下</black><dark_green><italic>煉丹<newline></italic></dark_green><dark_green><italic>爐</italic></dark_green><black>前方的按鈕進行煉製。<newline>如果配方有錯誤的話，煉製將不會進行，也不會消耗材料，請放心的煉製。<newline></black>"
    - "四、丹藥的種類<newline><blue>丹藥</blue><black>分為</black><blue>「藥丹」</blue><black>、</black><blue>「法丹<newline></blue><blue>」</blue><black>和</black><blue>「術丹」</blue><black>三種。</black><blue>藥丹</blue><black>是單人服用的份量，而</black><blue>法丹</blue><black>或</black><blue>術<newline></blue><blue>丹</blue><black>則是一次性可以讓多人使用的丹藥。而對使用對象有好處的歸類於</black><blue>法丹</blue><black>，相反地有壞處或傷害效果的則歸類於<newline></black><blue>術丹</blue><black>。<newline>此外，同一種丹藥也有初中高三等級之分，</black><blue>元素</blue><black>的配方相同，差別只在於</black><blue>藥引</blue><black>的等級。<newline></black><blue>丹藥</blue><black>的配方、分類和效果在<newline></black><blue>丹藥集注</blue><black>均有詳細說明。<newline></black>"
    - "五、雙倍丹藥<newline>相對於<blue>元素</blue><black>而言，</black><blue>藥引</blue><black>要難取得的多。因此煉丹師們發明了一種節省</black><blue>藥引</blue><black>的方法，便是在煉製時，使用一份</black><blue>藥引</blue><black>，但是加入雙份的</black><blue>元素</blue><black>進行煉製，如此一來，便可以獲得雙倍的</black><blue>丹<newline></blue><blue>藥</blue><black>。<newline>但是請注意，不是所有的</black><blue>丹藥</blue><black>都可以這麼做，此外，三倍以上也是不可能成功的。<newline>可以進行雙倍煉製的</black><blue>丹藥</blue><black>，在<newline></black><blue>丹藥集注</blue><black>中會標明[雙]的記號。</black>"
DanYaoJiZhu:
  Id: "WRITTEN_BOOK"
  Title: "<gold>丹藥集注</gold>"
  Display: "<gold>丹藥集注</gold>"
  Author: "<blue>丹藥舖掌櫃</blue>"
  Pages:
    - "----藥丹篇----<newline><newline><dark_blue><bold>混元一氣丹</bold></dark_blue><black><newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>石膽珀</blue><black>十五份<newline><newline>藥效：<newline>增加使用者的防禦力、抗火能力<newline><newline></black>"
    - "<dark_blue><bold>洛神丹</bold></dark_blue><black><newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>金煞爪</blue><black>二十份<newline><newline>藥效：<newline>增加使用者五感與體能<newline>提昇移動力、跳躍力、夜間視力以及閉氣肺活量<newline>此丹藥藥效沒有高低之分，用<newline></black><blue>初級藥引</blue><black>煉製即可<newline></black>"
    - "<dark_blue><bold>萬靈丹</bold></dark_blue><black><newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>玄水鱗</blue><black>二十份<newline><newline>藥效：<newline>解除各種負面效果<newline>包括移動緩慢、中毒、虛弱等等<newline>此丹藥藥效沒有高低之分，用<newline></black><blue>初級藥引</blue><black>煉製即可<newline></black>"
    - "----法丹篇----<newline><newline><dark_blue><bold>逢木回春泉</bold></dark_blue><black>    [雙]<newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>木靈心</blue><black>十份<newline><newline>藥效：<newline>回復使用者的體力，治癒傷口<newline><newline></black>"
    - "<dark_blue><bold>天神護體</bold></dark_blue><black>    [雙]<newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>木靈心</blue><black>五份<newline></black><blue>炎蜥砂</blue><black>五份<newline></black><blue>石膽珀</blue><black>五份<newline><newline>藥效：<newline>給予使用者如石頭一般堅硬的皮膚<newline>高級的</black><dark_blue><bold>天神護體</bold></dark_blue><black>甚至可以增加使用者的近戰攻擊力，如天神降臨一般<newline></black>"
    - "<dark_blue><bold>九轉還魂香</bold></dark_blue><black><newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>木靈心</blue><black>五份<newline></black><blue>玄水鱗</blue><black>五份<newline></black><blue>炎蜥砂</blue><black>五份<newline></black><blue>石膽珀</blue><black>五份<newline><newline>藥效：<newline>一開始會造成激烈的噁心，但是會增加使用者的體力上限，以及緩慢回復體力值<newline><newline></black>"
    - "----術丹篇----<newline><dark_blue><bold>封喉</bold></dark_blue><black>  [雙]<newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>炎蜥砂</blue><black>十份<newline><newline>藥效：<newline>藥如其名，見血封喉，可以對使用目標造成大量傷害。<newline>但是要注意，對某些怪物沒有效果。<newline><newline></black>"
    - "<dark_blue><bold>奪魂</bold></dark_blue><black>  [雙]<newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>玄水鱗</blue><black>十五份<newline><newline>藥效：<newline>讓使用目標移動速度以及攻擊力大幅下降。<newline>中高等級的奪魂效果較好。<newline><newline></black>"
    - "<dark_blue><bold>泣血</bold></dark_blue><black>  [雙]<newline><newline>藥方：<newline></black><blue>藥引</blue><black>一份<newline></black><blue>木靈心</blue><black>五份<newline></black><blue>玄水鱗</blue><black>五份<newline><newline>藥效：<newline>讓使用目標身中劇毒，體力持續下降一段時間。</black>"
DanYaoYuYaoZuNeiDanDeBiRanXing:
  Id: "WRITTEN_BOOK"
  Title: "<blue>丹藥與妖族內丹的必然性？</blue>"
  Display: "<blue>丹藥與妖族內丹的必然性？</blue>"
  Author: "<blue>妖族丹藥舖掌櫃</blue>"
  Pages:
    - "朋友啊，你是否要出谷到外面去？那你可以幫我個忙嗎？<newline>是這樣的，你應該也知道，我們<newline><black><underlined>妖族</underlined></black><black>有自己的煉丹方法，完全不需要使用</black><blue>內丹</blue><black>。<newline>但是</black><black><underlined>人仙二族</underlined></black><black>不知道是哪裡弄到的方子，每一味藥都需要用</black><black><underlined>我族</underlined></black><black>族人的</black><blue>內丹</blue><black>才能煉製。<newline>這根本是變相的屠殺啊......<newline>更何況他們煉製的</black><blue>丹藥</blue><black>還沒有我們用</black><blue>天然材料</blue><black>的方法來的有效。<newline></black>"
    - "你這次到<black><underlined>人族</underlined></black><black>的城裡去，幫我問問他們</black><dark_green><italic>煉丹寮</italic></dark_green><black>裡的人，究竟是誰發明這種損人不利己的煉丹法。<newline>要是讓我知道是誰，看我不衝過去把他碎屍萬段......哼。</black>"
HuoShanDeZhenXiang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>火山的真相</blue>"
  Display: "<blue>火山的真相</blue>"
  Author: "<blue>蓮心</blue>"
  Pages:
    - "啊啊......果然是這樣，岩漿下面有著<dark_red><underlined>朱雀</underlined></dark_red><black>的</black><dark_green><italic>祭壇</italic></dark_green><black>呢......<newline>這個</black><dark_green><italic>祭壇</italic></dark_green><black>原本是作為吸收火山力量傳輸到其他地方的設備。<newline>不過似乎因為</black><dark_red><underlined>朱雀</underlined></dark_red><black>不在了，祭壇不再抽取能量，才會導致火山活動越來越頻繁。<newline>總之，謝謝你的協助，我會和鎮民們溝通這件事情。<newline>相信以我的能力，找到另一個消耗火山能量的方法並不困難。<newline></black>"
    - "到那時，我們就不會受到火山噴發的威脅了。<newline>至於<dark_red><underlined>紅鸞</underlined></dark_red><black>......我想，她大概會受到制裁吧，畢竟那些被當作祭品而死去的人們不能夠復活......<newline>不管怎麼說，真的很感謝你。<newline>等我一下，我寫些東西......好了。<newline><newline>我還會在這裡呆一會，就麻煩你將這封</black><blue>信</blue><black>交給鎮長吧......<newline>系統提示：請記得向</black><dark_red><underlined>蓮心</underlined></dark_red><black>換取</black><blue>給鎮長的信件</blue><black></black>"
ShiRiDeWeiTuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>蝕日的委託</blue>"
  Display: "<blue>蝕日的委託</blue>"
  Author: "<blue>蝕日</blue>"
  Pages:
    - "這......這<blue>髮釵</blue><black>，怎麼會在你這兒？<newline><newline>唉......竟然有這樣的事......<newline>你猜的沒錯，</black><dark_red><underlined>紹椰</underlined></dark_red><black>的</black><dark_red><underlined>母親</underlined></dark_red><black>就是我的</black><dark_red><underlined>姊姊</underlined></dark_red><black>。<newline>也就是說，其實</black><dark_red><underlined>紹椰</underlined></dark_red><black>是我們</black><black><underlined>戰<newline></underlined></black><black><underlined>神族</underlined></black><black>與</black><black><underlined>人族</underlined></black><black>的混血兒。<newline>我的姊姊，十年前奉命來到</black><dark_green><italic>皇<newline></italic></dark_green><dark_green><italic>城</italic></dark_green><black>執行任務，卻在過程中陰錯陽差之下，與當時公孫世家的大少爺，也就是現在的</black><dark_red><underlined>公孫老<newline></underlined></dark_red><dark_red><underlined>爺</underlined></dark_red><black>墜入愛河。<newline></black>"
    - "但是，身為<black><underlined>戰神族</underlined></black><black>的一份子，你也了解，身上背負的責任是不能拋棄的。<newline>她最後......不幸在危險的任務中喪生。<newline>在最後一次出任務前，她有特別來找過我......<newline>她說，希望她的孩子可以有一個正常而快樂的人生。以一個</black><black><underlined>人族</underlined></black><black>的身分，而且是一個世家少爺的身分，所能過的生活，絕對會比回到族中，從小接受嚴苛的訓練，成人後各個必須負起沉重的責任來得輕鬆許</black>"
    - "多吧...<newline>這也就是為甚麼我沒有去找過<dark_red><underlined>紹椰</underlined></dark_red><black>。我們......都希望這孩子可以快樂沒有負擔的活著。<newline>但是，如果這孩子竟然在家裡過得這麼痛苦，我們或許一開始就應該把他帶回族中吧！<newline>這樣吧，這不是來自上級的命令，我......以私人的身分、以一個舅舅的身分請託你，可不可以幫我到</black><dark_green><italic>公孫家</italic></dark_green><black>探查，看看是否真的如</black><dark_red><underlined>紹椰</underlined></dark_red><black>所說得這麼糟。<newline></black>"
    - "如果連那<dark_red><underlined>姓公孫的傢伙</underlined></dark_red><black>真的這樣對待</black><dark_red><underlined>紹椰</underlined></dark_red><black>的話，不管他說什麼，我都會把</black><dark_red><underlined>紹椰</underlined></dark_red><black>帶回族裡的！</black>"
ZuChangDeZhuTuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>族長的囑託</blue>"
  Display: "<blue>族長的囑託</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "你應該知道，我們<black><underlined>戰神一族</underlined></black><black>為什麼會流落到這樣貧瘠的邊緣地區來吧？沒錯，就是因為那些自以為是的</black><black><underlined>神族</underlined></black><black>。他們擁有力量，但是卻拿來為非作歹，試圖控制整個世界。<newline>我們這族曾經是個為了反抗他們而組織起來的聯盟，但是後來在</black><dark_red><underlined>四獸</underlined></dark_red><black>的鎮壓下，聯盟的人大多都陣亡了，剩下的成員躲到了這個</black><black><underlined>神族</underlined></black><black>力量到達不了的世界邊緣，在這裡苟延殘喘的生活著。</black>"
    - "這就是我們<black><underlined>戰神族</underlined></black><black>的由來。因此我們和</black><dark_red><underlined>四獸</underlined></dark_red><black>有不共戴天之仇。<newline>雖然中世紀的時候，</black><black><underlined>我族</underlined></black><black>犧牲了數名</black><dark_red><underlined>菁英殺手</underlined></dark_red><black>，卻也只讓</black><dark_red><underlined>四<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>受傷離開</black><dark_green><italic>祭壇</italic></dark_green><black>，暫時躲了起來。<newline>受制於</black><dark_red><underlined>四獸</underlined></dark_red><black>的結界力量，</black><black><underlined>我族</underlined></black><black>一直不敢有什麼太大的動作。不過，最近</black><dark_red><underlined>四獸</underlined></dark_red><black>的力量似乎有減弱的趨勢，你就到世界中央的</black><dark_green><italic>四獸祭壇</italic></dark_green><black>去查探結界強度吧，順便看看能不能找到他們的下落。<newline></black>"
    - "<black><underlined>我族</underlined></black><black>在</black><black><underlined>人類</underlined></black><black>的</black><dark_green><italic>皇城</italic></dark_green><black>裡有接應，你到</black><dark_green><italic>皇宮後院</italic></dark_green><black>東邊的</black><dark_green><italic>月老小<newline></italic></dark_green><dark_green><italic>廟</italic></dark_green><black>，在那裏會有人告訴你更多資訊的。</black>"
ShiRiDeBaoGao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>蝕日的報告</blue>"
  Display: "<blue>蝕日的報告</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "你好，我是<dark_green><italic>皇城</italic></dark_green><black>中的接應人，我叫做</black><dark_red><underlined>蝕日</underlined></dark_red><black>。<newline>這幾天，</black><dark_green><italic>皇城</italic></dark_green><black>中發生了幾件事情。第一是</black><dark_red><underlined>人皇</underlined></dark_red><black>接待了</black><black><underlined>神族</underlined></black><black>的一位</black><dark_red><underlined>特使</underlined></dark_red><black>，以及</black><dark_red><underlined>大內總管</underlined></dark_red><black>和<newline></black><dark_red><underlined>御前帶刀侍衛長</underlined></dark_red><black>分別接待了一批冒險者和仙人。這樣的大動作是以前所沒有的。<newline>根據探子回報，似乎和</black><dark_red><underlined>四獸</underlined></dark_red><black>的</black><dark_green><italic>神廟</italic></dark_green><black>有關係，至少冒險者和仙人都已經前往了東部</black><dark_green><italic>龍鱗森<newline></italic></dark_green><dark_green><italic>林</italic></dark_green><black>的內部勘查。<newline>雖然結界是否真的減弱還要再觀察，但是可以確定的是</black><dark_green><italic>皇</italic></dark_green>"
    - "<dark_green><italic>城</italic></dark_green><black>正在進行某些和</black><dark_red><underlined>四獸</underlined></dark_red><black>有關的事情。<newline>我們族在東邊</black><dark_green><italic>森林</italic></dark_green><black>中的</black><dark_green><italic>龍鬚<newline></italic></dark_green><dark_green><italic>鎮</italic></dark_green><black>也有探子，你可以到那裏和他接頭。他叫做</black><dark_red><underlined>左焰</underlined></dark_red><black>，他會告訴你更多詳細資訊的。<newline>喔對了這個拿去，這是</black><dark_green><italic>皇城</italic></dark_green><black>的<newline></black><blue>簡易地圖</blue><black>，紀錄了主要的</black><dark_green><italic>商店</italic></dark_green><black>地點。<newline><newline>注：請記得用</black><blue>戰神族證明</blue><black>換取</black><blue>皇城地圖</blue><black>。</black>"
SiShouYiJiuBuZhiSuoZong:
  Id: "WRITTEN_BOOK"
  Title: "<blue>四獸依舊不知所蹤</blue>"
  Display: "<blue>四獸依舊不知所蹤</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "結果即使獲得了<dark_red><underlined>青龍</underlined></dark_red><black>的祝福，也沒辦法得知</black><dark_red><underlined>四獸</underlined></dark_red><black>現在的位置嗎……<newline>不過，至少感應的到，確定結界的效力正在減弱。如果</black><dark_red><underlined>四獸</underlined></dark_red><black>不及時回到</black><dark_green><italic>神廟</italic></dark_green><black>，結界很有可能就會崩解。<newline>事不宜遲，這件事情，請你務必準確地轉達給</black><dark_red><underlined>蝕日大人</underlined></dark_red><black>吧。<newline><newline>注：到</black><dark_green><italic>皇宮後院月老小廟</italic></dark_green><black>找<newline></black><dark_red><underlined>蝕日</underlined></dark_red><black>答覆</black>"
QianWangPengLai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>前往蓬萊</blue>"
  Display: "<blue>前往蓬萊</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "太好了，你蒐集完祝福之力了。<newline>前幾天接到消息，<black><underlined>人族</underlined></black><black>和</black><black><underlined>仙族</underlined></black><black>似乎找到了</black><dark_red><underlined>四獸</underlined></dark_red><black>沉睡的地方，他們都趕往了北方的</black><dark_green><italic>蓬萊島</italic></dark_green><black>，你趕快搭乘北邊的船趕往</black><dark_green><italic>蓬<newline></italic></dark_green><dark_green><italic>萊</italic></dark_green><black>吧，我已經讓</black><dark_red><underlined>左焰</underlined></dark_red><black>先去那裏打聽消息了。</black>"
FuZiZhongFeng:
  Id: "WRITTEN_BOOK"
  Title: "<blue>父子重逢</blue>"
  Display: "<blue>父子重逢</blue>"
  Author: "<blue>公孫老爺</blue>"
  Pages:
    - "這是......等等！全部退下！讓我單獨跟這位客人談談。<newline><newline>......你......是<black><underlined>戰神族</underlined></black><black>人吧？別緊張，我沒有惡意。因為.....你所用的招式，跟她很像......<newline>你知道</black><dark_red><underlined>紹椰</underlined></dark_red><black>的下落，對吧？<newline>我為守衛失禮的舉動道歉。因為</black><dark_red><underlined>紹椰</underlined></dark_red><black>失蹤了好幾天，到處也找不到他。正懷疑有人綁票呢，閣下剛好又上門來，他們大概是被我弄的有些神經緊張，才會不分青紅皂白的出手了。<newline></black>"
    - "那......<dark_red><underlined>紹椰</underlined></dark_red><black>他在哪裡？可以告訴我嗎？<newline><newline>......原來是這樣啊。<newline>唉！都怪我太忙碌，疏於注意家裡的狀況了，我原本以為有相近年齡的兄弟姊妹們相陪，他應該不會過於寂寞才是。<newline>卻沒想到讓他受苦了......<newline>都是我的錯，我發誓我以後會更加關心孩子們的狀況，照料好他。不會辜負他娘親的一番苦心。<newline></black>"
    - "為了感謝你的協助，這裡是一點小小心意，不成敬意，請務必收下。"
ZhanYiZhanYaoChuMoFangShouFangZhiNan:
  Id: "WRITTEN_BOOK"
  Title: "<gold>戰役-斬妖除魔-防守方指南</gold>"
  Display: "<gold>戰役-斬妖除魔-防守方指南</gold>"
  Author: "<blue>斥候-夜梟</blue>"
  Pages:
    - "<bold>戰役介紹：<black><newline><newline>探子來報，說<underlined>人族</underlined></black><bold><black>打算大舉進攻<underlined>我族</underlined></black><bold><bold><black>的其中一個小部落，為的是拓展村莊範圍。<newline>請各位善良的大俠們一定要幫幫我們，<underlined>人族</underlined></black><bold><bold><bold><bold><black>貪得無厭的行徑真的令人無法忍受。<newline>將我們的同伴抓去殺了煉丹不說，現在連生存的地方都快要沒有了......</black></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "<bold>戰役說明：<black><newline><newline>惡人們覬覦我們這塊部落很久了，他們一定是想快速的砍倒我們所居住的樹屋。即便樹屋有自我修復的功能，但是如果短時間內整片森林都被剷平，連一株樹木都沒有留下的話，就連修復都沒有辦法了。</black></bold>"
    - "請各位協助防守的朋友們，一定要讓那些惡人<dark_red>遠離樹屋</dark_red><black>，別讓他們</black><dark_red>靠近樹木太久</dark_red><black>，有機會把我們的屋子砍斷！<newline>樹屋再生的時間是</black><dark_red>十五分鐘</dark_red><black>，只要撐過這段時間，就沒有問題了。</black>"
    - "<dark_red><bold>注意事項：<newline><newline></bold></dark_red><dark_red>1.進攻方發起戰役後，在戰役正<newline></dark_red><dark_red>式開始之前的這段準備時間，<newline></dark_red><dark_red>才可以在此處報名參加防守<newline></dark_red><dark_red>方。<newline></dark_red><dark_red>2.戰役時會統一給予裝備武器<newline></dark_red><dark_red>和道具，請進入戰場之前不要<newline></dark_red><dark_red>攜帶任何東西以免遺失。</dark_red>"
    - "<bold>功勳值與友好度：<black><newline><newline>參加戰役後，對各族的友好度都會有一些改變，也會獲得功勳值。而戰役的成敗均會影響到獲取的功勳值和友好度。<newline>功勳值可以在</black><bold><dark_green><italic>皇城南方的忠<newline></italic></dark_green><bold><bold><dark_green><italic>烈祠</italic></dark_green><bold><bold><bold><bold><black>換取頭部的</black><bold><bold><bold><bold><bold><bold><bold><bold><gold></gold></bold>造型時裝<black>，時裝還可以附有特殊能力，對於戰鬥力的提昇很有幫助。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "而友好度的部份，在斬妖除魔的戰役，參與<underlined>妖族<black>防守的話，將會提昇</black></underlined>妖族<black>友好度，但是<underlined>人族</underlined></black><black>友好度將會下降。<newline>請注意，某一族的友好度下降到一定程度，就會無法進入該族的村落中。<newline><newline>注：</black><dark_green><italic>皇城</italic></dark_green><black>不在此限，任何人均可進入。</black>"
BangMangXiaoTuZiHuiJia:
  Id: "WRITTEN_BOOK"
  Title: "<blue>幫忙小兔子回家</blue>"
  Display: "<blue>幫忙小兔子回家</blue>"
  Author: "<blue>路邊的小妹妹</blue>"
  Pages:
    - "你就是傳說中的旅行者嗎？<newline>那你一定去過很多很多地方，知道很多很多事情囉？<newline>好羨慕你喔，媽媽都說外面的<dark_green><italic>森林</italic></dark_green><black>很危險，不可以出去玩......<newline>那可不可以拜託你幫忙這隻小兔子阿？<newline>我前天在路邊撿到牠的時候，牠好像迷路了，還受了點傷，我很想把牠送回家，可是又不能離開鎮裡......<newline><newline></black>"
    - "聽說<dark_green><italic>森林深處</italic></dark_green><black>有個</black><dark_green><italic>兔子仙境</italic></dark_green><black>，裡面有好多好多兔子快樂的生活在一起喔！<newline>而且裡面還有一隻</black><dark_red><underlined>兔子王</underlined></dark_red><black>，聽說牠掌管全天下的兔子呢！<newline>如果可以把小兔子帶去給<newline></black><dark_red><underlined>兔子王</underlined></dark_red><black>，一定就可以幫忙找到牠的家了！<newline>旅行者哥哥姊姊，可不可以拜託你幫幫牠阿？<newline>系統備註：請記得用</black><blue>人族證<newline></blue><blue>明</blue><black>與</black><dark_red><underlined>小妹妹</underlined></dark_red><black>兌換</black><blue>裝著</blue><blue>小兔子<newline></blue><blue>的籠子</blue><black></black>"
NiYeXiHuanDiaoYuMa:
  Id: "WRITTEN_BOOK"
  Title: "<gold>你也喜歡釣魚嗎？</gold>"
  Display: "<gold>你也喜歡釣魚嗎？</gold>"
  Author: "<blue>喜歡釣魚的老人</blue>"
  Pages:
    - "哈囉這位小友，有興趣學釣魚嗎？<newline>這真的一點都不難喔～我這裡還有賣些簡單的<blue>釣魚器具</blue><black>，一起來釣魚吧～<newline>只要拿著</black><blue>釣竿</blue><black>，對有水的地方右鍵拋出釣餌，然後等魚兒上鉤再按右鍵收竿，就可以釣起魚囉！<newline>另外，如果有釣到不錯的東西，也可以賣給我的</black><dark_red><underlined>朋友</underlined></dark_red><black>，他專門在蒐集一些特別的水產品。<newline></black>"
    - "如果你釣到了<blue>特殊的卷軸</blue><black>，也可以拿到</black><dark_green><italic>皇城</italic></dark_green><black>的</black><dark_red><underlined>護國法師</underlined></dark_red><black>那裡，他們有專人高價收購喔。</black>"
SenLinZhongDeYiBian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>森林中的異變</blue>"
  Display: "<blue>森林中的異變</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "喔~上仙大人您終於到了。這<newline><dark_green><italic>森林</italic></dark_green><black>已經快被野獸和怪物給鬧翻過來了……<newline>相信在來的路上您也遇到了，<newline></black><dark_green><italic>森林</italic></dark_green><black>裡面出現了很多奇怪的生物，他們會攻擊並且吃掉任何他們看到的生物，鎮上已經有好幾個鎮民失蹤了……<newline>我在想，這可能跟</black><dark_green><italic>森林深處的<newline></italic></dark_green><dark_green><italic>祭壇</italic></dark_green><black>結界效力減弱有關……<newline>我們巫女家族世世代代侍奉著</black><dark_red><underlined>森林的守護神-青龍</underlined></dark_red><black>。雖然<newline></black><dark_red><underlined>青龍神</underlined></dark_red><black>已經不在了，但是他仍</black>"
    - "然留下了他的力量維持著結界的運轉。但是最近我感覺到這股力量漸漸地減弱，很有可能就是因為這樣，原本潛伏在森林中的黑暗力量漸漸湧現出來。<newline>上仙大人，我希望您能夠代替我到<dark_green><italic>青龍祭壇</italic></dark_green><black>去看看究竟出了什麼事情。據說在發生危機的時候，代表神的</black><dark_red><underlined>分魂</underlined></dark_red><black>會給予人們指引，或許您可以在</black><dark_green><italic>青<newline></italic></dark_green><dark_green><italic>龍祭壇</italic></dark_green><black>找到解決危機的辦法。<newline></black>"
    - "我雖然也有些許的法力，但畢竟還只是個凡間的修士，一切只能仰仗大人您了。"
LongLinSenLinDeYiChang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>龍鱗森林的異常</blue>"
  Display: "<blue>龍鱗森林的異常</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "戰友你好，我就是<dark_red><underlined>左焰</underlined></dark_red><black>。<newline>我想</black><dark_red><underlined>蝕日隊長</underlined></dark_red><black>應該已經和你說了許多，時間緊迫，我只提些重點。<newline></black><black><underlined>仙族</underlined></black><black>和</black><black><underlined>人族</underlined></black><black>都已經前往</black><dark_green><italic>森林</italic></dark_green><black>內部探查</black><dark_green><italic>青龍祭壇</italic></dark_green><black>了，根據他們的談話，結界似乎真的有減弱的跡象，而減弱的原因就出自於</black><dark_green><italic>祭壇</italic></dark_green><black>和</black><dark_green><italic>神廟</italic></dark_green><black>的內部。<newline>只要找到</black><dark_green><italic>祭壇</italic></dark_green><black>，就能進入</black><dark_green><italic>神廟</italic></dark_green><black>當中，了解到底發生了什麼事情。<newline></black>"
    - "事不宜遲，我們這就出發吧。<newline>對。我會跟著你一起到<dark_green><italic>祭壇內部</italic></dark_green><black>去查明真相。進入</black><dark_green><italic>神廟</italic></dark_green><black>之後再找我對話即可。</black>"
QingLongShiLian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>青龍試煉</blue>"
  Display: "<blue>青龍試煉</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "根據<black><underlined>人仙二族</underlined></black><black>和</black><dark_red><underlined>青龍分魂</underlined></dark_red><black>的對話，分魂只是</black><dark_red><underlined>青龍</underlined></dark_red><black>的一縷意識，而</black><dark_red><underlined>青龍</underlined></dark_red><black>在</black><black><underlined>我族</underlined></black><black>發動攻擊而離開</black><dark_green><italic>神廟</italic></dark_green><black>之後，並沒有再回來。<newline>這是個機會，</black><dark_red><underlined>四獸</underlined></dark_red><black>目前應該還在沉睡修整當中，如果我們可以先發制人，就很有可能能夠一舉殲滅牠們。<newline>不過，似乎就連</black><dark_red><underlined>青龍分魂</underlined></dark_red><black>也不知道</black><dark_red><underlined>四獸</underlined></dark_red><black>的下落，因此才讓</black><black><underlined>人<newline></underlined></black><black><underlined>仙二族</underlined></black><black>的族人前往青龍試煉，獲取青龍祝福……<newline></black>"
    - "對了，試煉是向全部的人開放的，那我們也去取得青龍祝福吧，有了祝福，應該就能夠感知到<dark_red><underlined>四獸</underlined></dark_red><black>的所在地了。<newline>根據分魂的說法，</black><dark_green><italic>神廟的二樓</italic></dark_green><black>就是試煉的入口，我們去試試吧。<newline><newline>注：獲得青龍祝福之後，在</black><dark_green><italic>龍<newline></italic></dark_green><dark_green><italic>鬚鎮</italic></dark_green><black>找</black><dark_red><underlined>左焰</underlined></dark_red><black>回報</black>"
ZhenChangDeBuMan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>鎮長的不滿</blue>"
  Display: "<blue>鎮長的不滿</blue>"
  Author: "<blue>人族主線</blue>"
  Pages:
    - "喔\\u00262\\u0026o皇城\\u00260的勇士們，你們終於來了。<newline>相信你們也在來的途中遇到了各種野獸和怪物的阻撓，沒錯，\\u00262\\u0026o龍鱗森林\\u00260已經快被這些傢伙給鬧到翻過來了。<newline>鎮上的\\u00264\\u0026n祭司\\u00260只會整天念些沒作用的咒語和觀看星象，根本沒有實質的助益。<newline>你們趕快到\\u00262\\u0026o森林深處\\u00260去查看吧，我想一定又是\\u00264\\u0026n祭司\\u00260該好好照顧的\\u00262\\u0026o祭壇\\u00260出了問題。"
    - "哼哼，如果真的是這樣，我就想辦法把她給趕出去……在村莊裡只會浪費糧食的傢伙……"
ShenMuYaoJingDeYuanWang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>神木妖精的願望</blue>"
  Display: "<blue>神木妖精的願望</blue>"
  Author: "<blue>神木妖精</blue>"
  Pages:
    - "阿......好久沒有看到同族的人了。最近谷裡的大家還好嗎？<newline>因為沒辦法離開本體的關係，我只能待在這裡修養。<newline>還好<dark_green><italic>龍鬚鎮</italic></dark_green><black>的人都還算溫和，鎮裡的</black><dark_red><underlined>祭司</underlined></dark_red><black>對</black><black><underlined>妖族</underlined></black><black>也算友善，因此我在這裡還是挺安全的。<newline>不過我有個不情之請......希望你能幫助我。<newline>其實，我有一位失蹤的</black><black><underlined>人族</underlined></black><black>戀人。<newline>幾年前他每天都會來找我，那</black>"
    - "時真是我最快樂的日子。<newline>但是，從某一天開始，他就不再出現了。<newline>可是我又不能離開這裡去找他......<newline>這條<blue>紅色的緞帶</blue><black>，是他留下來唯一的東西。我把它綁在我的身體上，希望他能回來......<newline>但是你出現了。<newline>我希望你能帶著這條</black><blue>緞帶</blue><black>上路，如果遇到了他，就請幫我轉達，告訴他我真的很想念他......<newline>系統備註：請記得用</black><blue>妖族證<newline></blue><blue>明</blue><black>與</black><dark_red><underlined>神木妖精</underlined></dark_red><black>兌換</black><blue>紅色緞帶</blue><black></black>"
AnBuJianDiDeGuoQu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>暗不見底的過去</blue>"
  Display: "<blue>暗不見底的過去</blue>"
  Author: "<blue>默默凝視雕像的男子</blue>"
  Pages:
    - "......你問我為何要一直盯著這尊雕像看？哈哈，這<dark_red><underlined>柳風雲將<newline></underlined></dark_red><dark_red><underlined>軍</underlined></dark_red><black>啊，是個愚蠢到不行的人哪，小兄弟，我看你挺投緣的，我便向你說說，這位將軍的事情吧......<newline><newline></black><dark_red><underlined>柳風雲</underlined></dark_red><black>是位護國大將軍，他雖然驍勇善戰，但是從來不濫殺無辜。即便取下城池，駐軍進入也絕不燒殺擄掠，對他來說，永遠以取勝為優先，傷亡則越少越好，無論死傷的是敵方還是己方的人都一樣。</black>"
    - "但是，這樣一位將軍，卻遭遇了不幸。一天夜裡，他的府邸遭到了政敵的暗算。除了將軍當時在外帶兵逃過一劫，宅內餘下三十二口全部遭到刺客殺害，無人生還。<newline>發生了這麼大的事情，刑部派出的人手卻都沒有找到任何證據，而當時的<dark_red><underlined>人皇</underlined></dark_red><black>也隱晦的告訴</black><dark_red><underlined>柳風雲</underlined></dark_red><black>，不要再追究下去了。心灰意冷的他只求調派到一個邊陲地帶的小鎮，離開了令他失望的</black><dark_green><italic>皇城</italic></dark_green><black>。</black>"
    - "他一輩子都在與<underlined>妖族<black>戰爭，但是心愛之人卻是死於</black></underlined>同族<black>人的手中。他開始迷惘，什麼是正義，而他們又是為了什麼而戰，為了什麼而殺？<newline><newline>在一次<underlined>人</underlined></black><black>與<underlined>妖</underlined></black><black>爭鬥的戰場上，他看著同伴與敵軍一個個倒下，一片茫然之中，他終於找到了答案。<newline>再次睜眼，雙眸之中清明如雪，他仰天長嘯了三聲，然後化作一道光消失在戰場上。</black>"
    - "雙方人馬都覺得太過離奇，但是怎麼找就是找不到這位<dark_red><underlined>柳<newline></underlined></dark_red><dark_red><underlined>風雲將軍</underlined></dark_red><black>。<underlined>人族</underlined></black><black>最後只得將<newline></black><dark_red><underlined>柳將軍</underlined></dark_red><black>戰死的結果呈報給了<newline></black><dark_red><underlined>皇上</underlined></dark_red><black>。其後，</black><dark_red><underlined>人皇</underlined></dark_red><black>命人將</black><dark_red><underlined>柳風<newline></underlined></dark_red><dark_red><underlined>雲</underlined></dark_red><black>的牌位納入</black><dark_green><italic>忠烈祠</italic></dark_green><black>，以敬其功與仁德。<newline><newline>......你問我為什麼知道的那麼清楚？呵呵，因為我就是</black><dark_red><underlined>柳風<newline></underlined></dark_red><dark_red><underlined>雲</underlined></dark_red><black>，啊不對，現在應該叫做</black><dark_red><underlined>卯十<newline></underlined></dark_red><dark_red><underlined>八</underlined></dark_red><black>了，</black><dark_red><underlined>劍仙卯十八</underlined></dark_red><black>。</black>"
    - "你想問我最後在戰場上到底發生什麼事情？恩......你應該知道，<underlined>人族<black>可以修煉成仙吧？有些人藉由勤奮努力，加上一點天賦，就能夠飛昇成仙，仙體替換凡軀。不過也有另外一種，我稱之為「悟道」。就是藉由參悟天地大道，從而獲得仙緣，得以升格為</black></underlined>仙人<black>。我就是在戰場上，以「殺」證「道」的人。</black>"
    - "你想知道「道」是什麼？現在的你，就算我直接說了，大概也聽不懂吧......<newline><newline>這樣吧，你去蒐集天下的三種<blue>劍意</blue><black>吧，蒐集到了之後交給我。</black><blue>劍意</blue><black>就是使劍之人的意念，這些意念會依附在劍仙們建造的</black><dark_green><italic>劍碑</italic></dark_green><black>上。</black>"
    - "所謂<dark_green><italic>劍碑</italic></dark_green><black>，就是外型為一柄巨劍的石碑。其中一座就在</black><dark_green><italic>皇<newline></italic></dark_green><dark_green><italic>城</italic></dark_green><black>裡頭，另外兩座你得自己去尋找了。<newline><newline>三種</black><blue>劍意</blue><black>分別為天劍，地劍，人劍。蒐集到了之後，放到我前面的桶子裡吧，我來告訴你，什麼是「道」。</black>"
YiShaWuDao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>以殺悟道</blue>"
  Display: "<blue>以殺悟道</blue>"
  Author: "<blue>劍仙卯十八</blue>"
  Pages:
    - "既然你已經蒐集到了三種<blue>劍<newline></blue><blue>意</blue><black>，想必在過程中也有所領悟了吧。<newline><newline>你可曾想過，我們究竟為何而殺？究竟為何而戰鬥？究竟為了什麼在拼命呢？<newline><newline>勝利的人一定都是正義的一方嗎？</black>"
    - "我為了國家，殺了不下千名<underlined>妖<newline></underlined>族<black>族人，很多與我無冤無仇，卻因我而死。而<underlined>同族</underlined></black><black>的族人，卻僅僅只因為利益，就能夠滅我滿門......我和他手上都沾著鮮血，究竟誰有錯？<newline>答案是，沒有人有錯。<newline>這個世界就是這樣運轉的，有些人靠著利益而活，有些人靠著信念而活。有些人為了利益殺人，有些人為了信念殺人。而沒有人有權利說誰「錯」，因為人是平等的，不管哪一個種族都一樣。</black>"
    - "毫無同情心的殺手，和為了保護家人而殺人的人，依舊是一樣的。天道並不會因為誰做了什麼，就為誰打抱不平，而降下天罰。不過，儘管都是殺人，這兩種情況下，所累積的因果卻是不同的。<newline><newline>善有善報，惡有惡報。天道很仁慈，因為所有人的條件都是一樣的，平等的。但他同時也很殘酷，因為他對任何人都不會有絲毫寬待。"
    - "那天，我看著一個個倒下的同伴和敵人，我迷惘了。我不知道為何而戰，我不知道我該持有什麼樣的信念。我一直以來當作「殺」的信念：「保家衛國」已經不復存在了。<newline><newline>那麼，我究竟為何而「殺」？"
    - "我找到了答案，答案就是，問你的心。<newline><newline>你覺得什麼是對，什麼是錯呢？<newline>很多事情沒有正確的選擇。<newline><newline>有句話說的好：「豈能盡如人意，但求無愧於心。」<newline><newline>不要後悔自己的選擇，為自己做的每一個決定負責。"
    - "我們會痛苦，會憤怒，但是不要讓情緒蒙蔽你的理智，做出錯誤的事情來。<newline>我這輩子殺了不少無辜的人，但是這是我的選擇，這也是我日後會償還的，我從來沒有後悔過。<newline>對於家人被殺害的仇恨，不能說沒有，但是，我明白報仇並不能讓我的內心好過一些。天道會給予應有的結局，我們所需要做的，就是調節好自己的心罷了。"
JiNianZhanShiZhiSuoZhongLieCi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>紀念戰士之所-忠烈祠</blue>"
  Display: "<blue>紀念戰士之所-忠烈祠</blue>"
  Author: "<blue>忠烈祠住持-莫言</blue>"
  Pages:
    - "施主日安，貧僧是這<dark_green><italic>祠堂</italic></dark_green><black>的住持，請喚我莫言便可。<newline>施主是在詢問</black><dark_green><italic>祠堂</italic></dark_green><black>之事？那貧僧便介紹一番罷。<newline><newline>這座</black><dark_green><italic>祠堂</italic></dark_green><black>是由百年前的<underlined>人仙<newline></underlined>二族</black><black>高手們，在一位人族的帶領下所建，用以紀念那些驍勇善戰，為了守護信念奮鬥，但是卻命喪沙場的英雄們。</black>"
    - "只要為了自己的信念奮戰，並且成為公認的強大戰士，死後便有資格列入<dark_green><italic>忠烈祠</italic></dark_green><black>中，而且<newline></black><dark_green><italic>祠堂</italic></dark_green><black>中的先烈們沒有種族之分，只要是驍勇善戰、不濫殺無辜者，均可被收入</black><dark_green><italic>祠堂</italic></dark_green><black>中祭拜。所以</black><dark_green><italic>祠堂</italic></dark_green><black>中也不乏有<underlined>妖<newline></underlined>神二族</black><black>之中的英雄。<newline>而為了激勵後輩，各族的戰士每年都會捐獻給</black><dark_green><italic>祠堂</italic></dark_green><black>一些物資。只要在各種戰役中有不錯得表現，就會獲得功勳值，可以在此兌換等值的裝備或物品。</black>"
    - "嗯，大概就是這樣了......施主問最早進<dark_green><italic>忠烈祠</italic></dark_green><black>的人是誰？就是家喻戶曉，當年縱橫戰場的那位</black><dark_red><underlined>柳風雲將軍</underlined></dark_red><black>，也是他帶領了眾人建立這座</black><dark_green><italic>祠堂</italic></dark_green><black>的。當年</black><dark_green><italic>祠堂</italic></dark_green><black>尚未完工之時他就在戰場上中箭落馬，最後連屍首都沒找著，為了紀念他，便將他供奉在此，為忠烈第一人。</black>"
    - "<dark_green><italic>忠烈祠</italic></dark_green><black>中放在牆上的物品都是可以兌換的。其中比較特別的是</black><blue>頭部時裝</blue><black>，你可以購買他們然後裝在頭部位置，就能更改外貌。此外花費額外的功勳值，還可以讓時裝擁有不同的特殊能力。時裝的附靈祭台就在</black><dark_green><italic>忠烈祠</italic></dark_green><black>後方，那兒也有</black><dark_red><underlined>柳將軍</underlined></dark_red><black>的雕像，你可以順便瞻仰一下他當年的風采。</black>"
ChenShuiDeShengShouMen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>沉睡的聖獸們</blue>"
  Display: "<blue>沉睡的聖獸們</blue>"
  Author: "<blue>人族主線</blue>"
  Pages:
    - "你好，找我有什麼事嗎？<newline>啊…...<dark_red><underlined>法海</underlined></dark_red><black>派你來的阿，原來如此。不過他多慮了，既然</black><dark_red><underlined>聖獸</underlined></dark_red><black>所認定的人，我們便不會刁難你的。<newline>恩…...你想知道</black><dark_red><underlined>聖獸</underlined></dark_red><black>和</black><dark_green><italic>聖山</italic></dark_green><black>的事情嗎？這可能會花點時間，你就當作聽個故事吧。<newline>大家都知道，</black><dark_red><underlined>四聖獸</underlined></dark_red><black>是</black><black><underlined>神</underlined></black><black>所帶領的神獸，協助</black><black><underlined>神族</underlined></black><black>維持這個世界的秩序。而百年之前的大災難，</black><dark_red><underlined>四聖獸</underlined></dark_red><black>力量大減，於是他們離開了原本的崗位，來到</black>"
    - "了這裡進行修整，這一睡便是一百年。照理來說，<dark_red><underlined>聖獸</underlined></dark_red><black>們醒了過來，該是時候回到原本的位置，繼續維護結界的穩定。<newline>但是我們發現，</black><dark_red><underlined>四聖獸</underlined></dark_red><black>雖然有甦醒的跡象，但是沒有任何一位離開</black><dark_green><italic>聖山</italic></dark_green><black>。雖然疑惑，但是我們的職責只是守護與等待，何況我們也未持有</black><dark_red><underlined>聖獸</underlined></dark_red><black>們的祝福，無法前往</black><dark_green><italic>聖山</italic></dark_green><black>……<newline><newline>這個重責大任就交給你了，前往</black><dark_green><italic>聖山</italic></dark_green><black>吧，想辦法讓</black><dark_red><underlined>四聖獸</underlined></dark_red><black>回</black>"
    - "到原本的位置，使世界的秩序回到正軌上。"
ShengShanDeYiChang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>聖山的異常</blue>"
  Display: "<blue>聖山的異常</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "道友你好，請稱我為<dark_red><underlined>凱歌</underlined></dark_red><black>即可。<newline><newline>原來如此，是</black><dark_red><underlined>法海</underlined></dark_red><black>讓你來的啊。他還好嗎？很久沒有他的音訊了。<newline>嗯……你想知道</black><dark_red><underlined>聖獸</underlined></dark_red><black>和</black><dark_green><italic>聖山</italic></dark_green><black>的事情嗎？這可能會花點時間，你就當作聽個故事吧。<newline>大家都知道，</black><dark_red><underlined>四聖獸</underlined></dark_red><black>是神所帶領的神獸，協助</black><black><underlined>神族</underlined></black><black>維持這個世界的秩序。而百年之前的大災難，</black><dark_red><underlined>四聖獸</underlined></dark_red><black>力量大減，於是</black>"
    - "他們離開了原本的崗位，來到了這裡進行修整，這一睡便是一百年。照理來說，<dark_red><underlined>聖獸</underlined></dark_red><black>們醒了過來，該是時候回到原本的位置，繼續維護結界的穩定。<newline>但是我們發現，</black><dark_red><underlined>四聖獸</underlined></dark_red><black>雖然有甦醒的跡象，但是沒有任何一位離開</black><dark_green><italic>聖山</italic></dark_green><black>。雖然疑惑，但是我們的職責只是守護與等待，何況我們也未持有</black><dark_red><underlined>聖獸</underlined></dark_red><black>們的祝福，無法前往</black><dark_green><italic>聖山</italic></dark_green><black>……<newline>這個重責大任就交給你了，前往</black><dark_green><italic>聖山</italic></dark_green><black>吧，想辦法讓</black><dark_red><underlined>四聖獸</underlined></dark_red><black>回</black>"
    - "到原本的位置，使世界的秩序回到正軌上。"
ShengShanJieJie:
  Id: "WRITTEN_BOOK"
  Title: "<blue>聖山結界</blue>"
  Display: "<blue>聖山結界</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "你是來自外面的<black><underlined>妖族</underlined></black><black>！真的嗎？<newline>現在的情況究竟如何了？雖然那個時候我們這群同伴撤退的時候尋求</black><black><underlined>蓬萊一族</underlined></black><black>的庇護，但是代價卻是無法離開這裡……<newline>原來是這樣啊……所以</black><black><underlined>妖族</underlined></black><black>現在雖然還有據點，但是大多數的城鎮都遭到破壞嗎……不過至少讓我知道</black><dark_green><italic>蓬萊</italic></dark_green><black>之外的族人都平安無事。<newline></black>"
    - "你是來這裡尋找<dark_red><underlined>聖獸</underlined></dark_red><black>的嗎？他們似乎還沒有甦醒的樣子。<newline>早在百年以前，</black><dark_red><underlined>聖獸</underlined></dark_red><black>似乎遭遇到了什麼打擊，撤退到了</black><dark_green><italic>蓬萊<newline></italic></dark_green><dark_green><italic>旁的聖山</italic></dark_green><black>中，他們留下了部分的力量持續運轉著結界，並且等待從睡眠中甦醒過來之後，重新進行結界的維護。<newline>所以現在結界已經鬆動了，可是他們卻還沒有甦醒的樣子，抱歉畢竟我沒</black><black><underlined>蓬萊</underlined></black><black>的血統，所以感應不到</black><dark_red><underlined>聖獸</underlined></dark_red><black>的狀況。<newline></black>"
    - "你就到<dark_green><italic>聖山</italic></dark_green><black>去看看吧，從</black><dark_green><italic>北邊<newline></italic></dark_green><dark_green><italic>的小船</italic></dark_green><black>可以搭船前往。不知道</black><dark_green><italic>聖山</italic></dark_green><black>的狀況究竟是如何，所以你先把東西準備好再出發吧。</black>"
JinRuShengShan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>進入聖山</blue>"
  Display: "<blue>進入聖山</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "你來了阿……東西都準備好了吧？畢竟等等到<dark_green><italic>聖山</italic></dark_green><black>裡可能會有些奇怪的狀況，多準備點總是好的。<newline>嗯？你對</black><dark_green><italic>聖山</italic></dark_green><black>的由來和</black><dark_red><underlined>聖獸</underlined></dark_red><black>的關係有興趣？<newline>恩……也好，就告訴你一些事情也未嘗不可。<newline>事實上，</black><dark_red><underlined>聖獸</underlined></dark_red><black>是</black><black><underlined>仙族</underlined></black><black>贈送給我們的禮物。</black><black><underlined>仙族</underlined></black><black>是一個創造力強大的種族，這點和我們很不同，有可能是因為他們並沒有永恆的壽命。<newline></black>"
    - "總之，過去的某一天，當時<black><underlined>仙族</underlined></black><black>的</black><dark_red><underlined>盟主</underlined></dark_red><black>突然向我們進貢了四隻</black><dark_red><underlined>聖獸</underlined></dark_red><black>。</black><dark_red><underlined>聖獸</underlined></dark_red><black>的力量強大，很適合幫助我們管理這個世界。大家都以為</black><dark_red><underlined>聖獸</underlined></dark_red><black>是我們製造出來的，其實不是。<newline>所以，</black><dark_red><underlined>聖獸</underlined></dark_red><black>如果發生異常，很有可能要找</black><black><underlined>仙族</underlined></black><black>來修復。但是就在稍早之前，</black><black><underlined>仙族</underlined></black><dark_red><underlined>盟主</underlined></dark_red><black>以(那是上一代族人的事情，我們幫不上忙)拒絕了我的要求。<newline></black>"
    - "也就是說，現在<black><underlined>仙族</underlined></black><black>當中，沒有人可以解決這個問題……又或者是，因為某些原因，故意不解決這個問題……<newline>總之，到</black><dark_green><italic>聖山</italic></dark_green><black>一趟，我們就會明白的。<newline>走吧。</black>"
SiShouChenShuiZhiChu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>四獸沉睡之處</blue>"
  Display: "<blue>四獸沉睡之處</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "你終於來了，我找到<dark_red><underlined>四獸</underlined></dark_red><black>沉睡的地方了，就在</black><dark_green><italic>聖山</italic></dark_green><black>之中。<newline></black><dark_green><italic>聖山</italic></dark_green><black>是</black><dark_red><underlined>蓬萊族人</underlined></dark_red><black>世代守護的區域，傳說是</black><dark_red><underlined>盤古大神</underlined></dark_red><black>殞落之處。我想，</black><dark_red><underlined>四獸</underlined></dark_red><black>一定在其中修整，你擁有祝福之力，應該可以直接進入</black><dark_green><italic>聖山</italic></dark_green><black>的區域，快去看看情況吧，如果</black><dark_red><underlined>四獸</underlined></dark_red><black>真的在裡面，我們就可以直接對牠們發起攻擊了。<newline>記得東西都帶上，因為你不確定會遇到什麼事情。</black>"
NeiDanLianDanFaDeCuoWu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>內丹煉丹法的錯誤</blue>"
  Display: "<blue>內丹煉丹法的錯誤</blue>"
  Author: "<blue>太上老君</blue>"
  Pages:
    - "年輕人，來找本君究竟有何貴幹呢？<newline>什麼？你說我的煉丹技術太差？<newline>呃......<blue>基礎煉丹法</blue><black>啊......這本的確是寫得不太好......<newline>原來你是</black><black><underlined>妖族</underlined></black><black>的，怪不得你會如此生氣......<newline>也是我的責任啊...唉......<newline>這件事情，其實我一直很懊悔，但是木已成舟，無法更改了......<newline>如果你真的想知道，那麼就拿著這把</black><blue>鑰匙</blue><black>，到後面的</black><dark_green><italic>書房</italic></dark_green><black>來找我吧。</black>"
GuanWuTeShuYaoYinYuXiYouDanYao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>關於特殊藥引與稀有丹藥</blue>"
  Display: "<blue>關於特殊藥引與稀有丹藥</blue>"
  Author: "<blue>太上老君</blue>"
  Pages:
    - "......你好，請問來找我有什麼事情嗎？<newline>欸......？聽說我知道關於<blue>稀有<newline></blue><blue>丹藥</blue><black>的事情......？<newline>嗯......我是</black><black><underlined>神族</underlined></black><black>的</black><dark_red><underlined>太上老君</underlined></dark_red><black>，對於</black><blue>丹藥</blue><black>煉製頗有心得，有些人稱我為丹神。<newline>不過，</black><blue>特殊丹藥</blue><black>的威力太過強大，我不能隨便交給你......<newline>喔，謝謝你的</black><blue>鮭魚</blue><black>，你真是有誠意啊，那我就......咳嗯。<newline>我是說，看你儀表堂堂，相貌不凡，想必心地良善，那我就把</black><blue>稀<newline></blue><blue>有丹藥的藥方</blue><black>''贈''與你吧。</black>"
JiuJiDanYaoYaoFang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>究級丹藥藥方</blue>"
  Display: "<blue>究級丹藥藥方</blue>"
  Author: "<blue>太上老君</blue>"
  Pages:
    - "<black><newline><newline><newline><newline><newline>   ----</black><dark_aqua><bold>究級法丹秘卷</bold></dark_aqua><black>----</black>"
    - "<dark_blue><bold>範圍萬靈丹</bold></dark_blue><black><newline><newline>藥方：<newline>特殊藥引-</black><blue>人蔘</blue><black>一份<newline></black><blue>木靈心</blue><black>二十份<newline></black><blue>玄水鱗</blue><black>十份<newline></black><blue>石膽珀</blue><black>五份<newline><newline>藥效：<newline>同</black><dark_blue><bold>萬靈丹</bold></dark_blue><black>，但是可以施加於周遭全體。</black>"
    - "<dark_blue><bold>起死回生泉</bold></dark_blue><black><newline><newline>藥方：<newline>特殊藥引-</black><blue>人蔘</blue><black>四份<newline></black><blue>木靈心</blue><black>十份<newline></black><blue>石膽珀</blue><black>十份<newline><newline>藥效：<newline>堪稱療癒功效最神奇的丹藥，任何傷口都能迅速治癒。</black>"
    - "<black><newline><newline><newline><newline><newline>   ----</black><dark_red><bold>究級術丹秘卷</bold></dark_red><black>----</black>"
    - "<dark_blue><bold>定身</bold></dark_blue><black><newline><newline>藥方：<newline>特殊藥引-</black><blue>靈芝</blue><black>三份<newline></black><blue>玄水鱗</blue><black>四十份<newline><newline>藥效：<newline>瞬間麻痺腿部筋絡穴道，讓人動彈不得一小段時間</black>"
    - "<dark_blue><bold>見血封喉</bold></dark_blue><black><newline><newline>藥方：<newline>特殊藥引-</black><blue>靈芝</blue><black>五份<newline></black><blue>金煞爪</blue><black>三十份<newline></black><blue>炎蜥砂</blue><black>二十份<newline></black><blue>石膽珀</blue><black>十份<newline><newline>藥效：<newline>改進了</black><dark_blue><bold>封喉</bold></dark_blue><black>的毒性，可以造成非常巨大的傷害</black>"
YinFaRenYaoErZuDeZhanZheng:
  Id: "WRITTEN_BOOK"
  Title: "<blue>引發人妖二族的戰爭</blue>"
  Display: "<blue>引發人妖二族的戰爭</blue>"
  Author: "<blue>太上老君</blue>"
  Pages:
    - "唉......這件事情說來話長。<newline>一切要從<dark_red><underlined>女媧</underlined></dark_red><black>造了人之後開始說起。<newline>當初</black><black><underlined>人族</underlined></black><black>一出現，繁衍的速度雖快，但是死亡率也高。<newline></black><black><underlined>我族</underlined></black><black>的</black><dark_red><underlined>長老</underlined></dark_red><black>為了不要讓</black><dark_red><underlined>女媧</underlined></dark_red><black>的用心白費，就命我下凡傳下這本</black><blue>「基礎煉丹法」</blue><black>。<newline>都怪我當時沒有細看，只道是一些簡單的煉丹方法，用以彌補</black><black><underlined>人族</underlined></black><black>體弱多病的體質。沒想到，煉丹法裡頭的方子，竟然摻了一味根本不需要的藥材-<newline></black><blue>「妖族的內丹」</blue><black>。<newline></black>"
    - "等我發現時，已經太晚了。<black><underlined>人<newline></underlined></black><black><underlined>族</underlined></black><black>和</black><black><underlined>妖族</underlined></black><black>勢同水火，各地都傳出二族的爭鬥和傷亡。<newline>但是無論我如何費心的去解釋，</black><black><underlined>人族</underlined></black><black>的</black><dark_red><underlined>人皇</underlined></dark_red><black>依舊不肯將煉丹法中的內容更正。<newline>我這才理解到，人也是有私心的。<newline></black><dark_red><underlined>人皇</underlined></dark_red><black>想藉著煉丹的名義，向<newline></black><black><underlined>妖</underlined></black><black><underlined>族</underlined></black><black>發起進攻，奪取土地和資源，<newline>甚至還聯合了原本不願參戰的</black><black><underlined>仙族</underlined></black><black>，共同建造了用來關押<newline></black><black><underlined>妖族</underlined></black><black>的監獄-</black><dark_green><italic>「鎮妖塔」</italic></dark_green><black>。<newline></black>"
    - "只因我的疏忽，造成<black><underlined>妖族</underlined></black><black>生靈塗炭，這個罪孽我永遠也還不清啊......<newline>我不想知道為何當初</black><dark_red><underlined>長老</underlined></dark_red><black>給我的藥方裡面加了</black><blue>妖族內丹</blue><black>這味藥，也不想和</black><black><underlined>妖族</underlined></black><black>解釋什麼。<newline>我獨自躲到這裡來，離群索居，日日夜夜的懺悔我的過錯......<newline><newline></black><dark_gray><bold><italic>真相是悔恨的......不能無<newline></italic></bold></dark_gray><dark_gray><bold><italic>情，就請時時刻刻用心。</italic></bold></dark_gray>"
YongShengZhiFaDeMiMi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>永生之法的秘密</blue>"
  Display: "<blue>永生之法的秘密</blue>"
  Author: "<blue>梓決</blue>"
  Pages:
    - "你好，歡迎來到<dark_green><italic>蓬萊</italic></dark_green><black>，我是這裡的島主，請喚我</black><dark_red><underlined>梓決</underlined></dark_red><black>便可。<newline>嗯？你想詢問我</black><dark_green><italic>蓬萊</italic></dark_green><black>之事？<newline>你大概是注意到了吧，進到</black><dark_green><italic>蓬<newline></italic></dark_green><dark_green><italic>萊</italic></dark_green><black>的人，不被允許離開這裡。當然，你是例外......很多事情還得要麻煩你幫忙呢......<newline>嘛，別那麼拘謹，坐吧，讓我跟你說說</black><dark_green><italic>蓬萊</italic></dark_green><black>的由來......<newline><newline>你知道，</black><black><underlined>神族</underlined></black><black>是大陸上唯一永生的種族吧？<newline></black>"
    - "不過，你可曾想過，為何只有<black><underlined>神<newline></underlined></black><black><underlined>族</underlined></black><black>可以永生，其他人卻無論如何修煉，始終都難逃大限嗎？<newline>自古以來，各族都在研究這個秘密，而</black><black><underlined>仙族</underlined></black><black>為其中之最，他們繼承了</black><black><underlined>人族</underlined></black><black>的好奇和貪婪，而比</black><black><underlined>人族</underlined></black><black>長的壽命，更讓他們有機會創造更多強大的陣法和法寶。<newline>我......曾經是</black><black><underlined>仙族</underlined></black><black>的一員，這些往事暫且不提。總之，我花費了畢生的心血在研究這件事情，而最後我終於有了結論......<newline><newline></black>"
    - "<black><underlined>神族</underlined></black><black>，之所以能夠「永生」，是因為他們並不屬於這個「世界」。<newline>很弔詭的結論，不是嗎？當然，這或許只是我一廂情願的想法，因為它目前僅僅只是個理論罷了。<newline>先讓我跟你說說「天道」吧。什麼是天道呢？<newline><newline>萬物緣起緣滅，週而復始，這就是「道」。<newline>因果輪迴，善惡自有報，這也是「道」。<newline><newline></black>"
    - "所謂「天道」，即是天地運行的道理，是身為這個世界一部份的我們，所必須要遵守的。<newline>壽命盡了，就會歸於塵土，還於天地，而終有一天，生命會以另一種方式再現。<newline>這就是我們這個世界的「天道」。<newline><newline>因此，違反天道的存在，都會受到懲罰。例如壽命已盡，卻不肯安息的人，就會成為殭屍危害生靈。<newline>"
    - "而我在<black><underlined>神族</underlined></black><black>的身上，感受不到天道的氣息......所以我才會得到「</black><black><underlined>神族</underlined></black><black>不屬於這個世界」的結論。<newline>得到了這個結論以後，我轉而研究天道法則和世界的本質，最終，我發明了一個陣法。<newline>此陣名為「偷天轉日」，他能夠借山川靈脈之力，將使用者暫時隔離於天道之外。<newline>沒有規則，也就沒有壽命的限制......<newline></black>"
    - "唯一的缺憾，就是使用者不能離開陣法，也無法影響陣法之外的空間。<newline>......你猜得不錯，<dark_green><italic>蓬萊</italic></dark_green><black>這裡就是一座這樣的陣法。<newline>為了保密，我施了一道禁制，將誤入的人困在這裡......<newline><newline>你問我幾歲了？呵呵，其實我也不清楚，早就活了不知道多久了。但是活了越久，越是瞭解到生命的意義並不在於活了多久......<newline></black>"
    - "如今支撐著我的，就只剩下對一個人的愧疚了......我利用了他，用了當時還不甚成熟的陣法，將他困在了一處廟宇中......<newline>你是否可以幫我一個忙？幫我把這封信送去給他。<newline>這位仙人名叫<dark_red><underlined>雨竹</underlined></dark_red><black>，他在</black><dark_green><italic>虎爪<newline></italic></dark_green><dark_green><italic>山</italic></dark_green><black>山腰上的一處廟裡。<newline>告訴他，這一切很快就會結束了......<newline><newline>系統備註：請用</black><blue>NPC對話泡泡</blue><black>和</black><dark_red><underlined>梓決</underlined></dark_red><black>換取</black><blue>「致雨竹的信」</blue><black></black>"
XiaLuoBuMingDeAiRen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>下落不明的愛人</blue>"
  Display: "<blue>下落不明的愛人</blue>"
  Author: "<blue>芊無</blue>"
  Pages:
    - "同族的朋友你好，請問你是......？<newline>這樣啊，原來如此，你是為了調查<dark_green><italic>下界</italic></dark_green><black>異變所以才來到</black><dark_green><italic>蓬萊</italic></dark_green><black>的嗎？真是辛苦你了。<newline>我叫做</black><dark_red><underlined>芊無</underlined></dark_red><black>。<newline>可以問一下，</black><dark_green><italic>崑崙</italic></dark_green><black>上的狀況目前如何了嗎？抱歉，我真的是太久沒有回去了......<newline>......你問我為何不回去？唉......這說來話長......<newline>不過，告訴你也無妨。畢竟這裡是</black><dark_green><italic>蓬萊</italic></dark_green><black>，是個連</black><dark_red><underlined>長老</underlined></dark_red><black>都無法輕視的地方。<newline></black>"
    - "我......可以說是<black><underlined>神族</underlined></black><black>的叛徒，至少，從</black><dark_red><underlined>長老</underlined></dark_red><black>的立場來說是這樣的。<newline>那是在很久以前......我也忘記了確切的時間點......<newline>你曾聽說過「戰神聯盟」嗎？<newline>各種族原本是不用向</black><black><underlined>我族</underlined></black><black>繳納供品的，但是自從</black><black><underlined>仙族</underlined></black><black>開了先例，將</black><dark_red><underlined>四聖獸</underlined></dark_red><black>送給</black><black><underlined>我族</underlined></black><black>之後，有些族人就起了自滿與傲慢的心。<newline></black>"
    - "而<dark_red><underlined>長老</underlined></dark_red><black>是其中之最。他制定了規則，命令各族必須按時繳納供品，否則該族就會被施以天罰......<newline>有些人試圖反抗，於是他們集結了起來，組成了一個叫做「戰神聯盟」的團體，試圖和</black><black><underlined>神<newline></underlined></black><black><underlined>族</underlined></black><black>溝通，阻止不公平的壓榨和剝削。<newline>我曾經是戰神聯盟的一員，即便我身為一個</black><black><underlined>神</underlined></black><black>，我也不認為我們比其他生靈還來得高尚......<newline></black>"
    - "而我的愛人-<dark_red><underlined>塵囂天君</underlined></dark_red><black>，雖然不支持我加入戰神聯盟，但是他也認為</black><dark_red><underlined>長老</underlined></dark_red><black>的作法不妥，因此他並沒有阻止我和戰神聯盟聯繫。<newline>但是，同族的</black><dark_red><underlined>貪狼星君</underlined></dark_red><black>卻率領<newline></black><dark_red><underlined>四聖獸</underlined></dark_red><black>突襲了我們的營地，聯盟的夥伴死傷慘重，我被迫往北方撤退，來到了這裡，而我和<newline></black><dark_red><underlined>塵囂</underlined></dark_red><black>也沒有了任何聯繫......<newline></black><dark_green><italic>蓬萊</italic></dark_green><black>有</black><dark_green><italic>蓬萊</italic></dark_green><black>的規矩，我進來了就無法再離開了。<newline></black>"
    - "可以的話，請你幫我回族裡找到<dark_red><underlined>塵囂</underlined></dark_red><black>，不過，發生了那樣的事情，他想必不會回族裡了吧......<newline>如果他還活著的話......請把這個交給他，然後告訴他我在這裡等他來......<newline><newline>系統備註：請用</black><blue>神族證明</blue><black>和<newline></black><dark_red><underlined>芊無</underlined></dark_red><black>換取</black><blue>「半枚玉珮」</blue><black></black>"
ZuChangDeGuanXin:
  Id: "WRITTEN_BOOK"
  Title: "<blue>族長的關心</blue>"
  Display: "<blue>族長的關心</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "歡迎你的到來，族人。<newline>雖然這裡物資貧乏，不過給幾件蔽體的衣物還是可以的。<newline>帶著這些<blue>兌換卷</blue><black>去</black><dark_green><italic>戰備資源<newline></italic></dark_green><dark_green><italic>部</italic></dark_green><black>換幾件基礎的</black><blue>裝備</blue><black>和</black><blue>武器</blue><black>吧。記得</black><blue>武器</blue><black>要選擇自己職業的喔，別拿錯了。</black>"
DanYaoGuanLiYuan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>丹藥管理員</blue>"
  Display: "<blue>丹藥管理員</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "唉……現在資源短缺，<blue>丹藥</blue><black>很稀有阿，不過話雖如此，</black><blue>基礎丹藥</blue><black>還是可以領的，盡量小心，別受傷了。不過</black><black><underlined>我們這族</underlined></black><black>只要不主動出手敵人也不會發現我們就是了……好啦，拿完</black><blue>丹藥</blue><black>就去找</black><dark_red><underlined>族長</underlined></dark_red><black>吧，以後有需要還可以來領。</black>"
ShenZuSiShouDeKongBu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>神族四獸的恐怖</blue>"
  Display: "<blue>神族四獸的恐怖</blue>"
  Author: "<blue>戰神族族長</blue>"
  Pages:
    - "你知道，我們<black><underlined>戰神一族</underlined></black><black>的由來嗎？<newline>其實，</black><black><underlined>戰神</underlined></black><black>指的是「對抗」</black><black><underlined>神</underlined></black><black>。<newline>想當初上古時代，</black><black><underlined>神族</underlined></black><black>利用</black><dark_red><underlined>四<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>-</black><dark_red><underlined>青龍</underlined></dark_red><black>、</black><dark_red><underlined>白虎</underlined></dark_red><black>、</black><dark_red><underlined>朱雀</underlined></dark_red><black>、</black><dark_red><underlined>玄武</underlined></dark_red><black>的強大戰力，逼迫各族必須要繳納供品。<newline>於是有一群不服的反抗軍，組成了「戰神聯盟」誓言對抗獨斷的</black><black><underlined>神族</underlined></black><black>。<newline>戰神聯盟由各種族的人士組成，包括當時與</black><dark_red><underlined>長老</underlined></dark_red><black>意見不合的一些</black><black><underlined>神族</underlined></black><black>族人。<newline></black>"
    - "這些有志之士就在現在的<black><underlined>戰<newline></underlined></black><black><underlined>神族</underlined></black><black>領地附近聚集在一起。<newline>但是不知道是誰走漏了風聲，</black><black><underlined>神族</underlined></black><black>利用</black><dark_red><underlined>四獸</underlined></dark_red><black>攻擊了</black><dark_green><italic>戰神聯<newline></italic></dark_green><dark_green><italic>盟的據點</italic></dark_green><black>。<newline>當時祖先們死的死，逃的逃。剩下的聯盟成員只好躲起來，逃避</black><black><underlined>神族</underlined></black><black>的追殺。<newline>而這群剩下的</black><dark_red><underlined>戰神聯盟成員</underlined></dark_red><black>，就是我們</black><black><underlined>戰神一族</underlined></black><black>的祖先。<newline><newline>為了復仇，百年以前，我們</black><black><underlined>戰神一族</underlined></black><black>發起了攻擊行動，突襲了</black><dark_red><underlined>四獸</underlined></dark_red><black>的</black><dark_green><italic>祭壇據點</italic></dark_green><black>。<newline></black>"
    - "當時<dark_red><underlined>四獸</underlined></dark_red><black>雖然負傷，但由於當時依舊有餘力應敵，遂將前去的刺客全部殲滅，然後離開</black><dark_green><italic>祭<newline></italic></dark_green><dark_green><italic>壇</italic></dark_green><black>，不知所蹤。<newline></black><black><underlined>我族</underlined></black><black>一直在尋找</black><dark_red><underlined>四獸</underlined></dark_red><black>養傷的所在地，一日不除</black><dark_red><underlined>四獸</underlined></dark_red><black>，血海深仇難得伸張。<newline>但是，我們的敵人真的是</black><dark_red><underlined>四獸</underlined></dark_red><black>嗎？<newline></black><dark_red><underlined>四獸</underlined></dark_red><black>只是</black><black><underlined>神族</underlined></black><black>的工具，真正下令攻擊</black><dark_green><italic>戰神聯盟據點</italic></dark_green><black>的一定另有其人......<newline><newline></black>"
    - "這樣吧，給你一個秘密任務。<newline><black><underlined>我族</underlined></black><black>在</black><black><underlined>神族</underlined></black><black>中有一位</black><dark_red><underlined>間諜</underlined></dark_red><black>，平日為了怕被發現，與族內的聯繫並不多。<newline>這位情報員的名字叫做</black><dark_red><underlined>九幽</underlined></dark_red><black>。<newline>我希望你潛入</black><dark_green><italic>神族領地崑崙</italic></dark_green><black>，聯繫上這位族人，<newline>並向他詢問關於</black><dark_red><underlined>四獸</underlined></dark_red><black>當年攻擊</black><dark_green><italic>聯盟據點</italic></dark_green><black>的經過。</black>"
YaoZuJuDianXieLingGuGuZhu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>妖族據點-葉靈谷谷主</blue>"
  Display: "<blue>妖族據點-葉靈谷谷主</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "喔喔，終於有新生的<black><underlined>妖族</underlined></black><black>同伴了阿……看來老夫在有生之年說不定有機會看到</black><black><underlined>我族</underlined></black><black>的復興呢……<newline>來，這些</black><blue>兌換券</blue><black>就送給你了，去<newline></black><dark_green><italic>鐵匠鋪</italic></dark_green><black>換些簡單的衣服和武器吧，等你熟悉的這個村莊之後再來找我，我還有事情要告訴你。</black>"
TuShuGuanDaoLan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>圖書館導覽</blue>"
  Display: "<blue>圖書館導覽</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "啊…...你是剛出生的<black><underlined>妖族</underlined></black><black>吧，歡迎你的到來。謝謝你幫我送<newline></black><blue>包裹</blue><black>過來。這裡是世界上最大而且藏書最齊全的</black><dark_green><italic>圖書館</italic></dark_green><black>喔！幾乎什麼文獻資料都有，你可以自由閱覽，不過記得，請不要把書帶離開</black><dark_green><italic>圖書館</italic></dark_green><black>喔，這樣下一個人才能讀到寶貴的資料。那麼，我想時間也差不多了，沒什麼事的話，就回去找</black><dark_red><underlined>谷<newline></underlined></dark_red><dark_red><underlined>主</underlined></dark_red><black>吧，我想他會告訴你們該做什麼的。</black>"
XiaLuoBuMingDeDaChangLao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>下落不明的大長老</blue>"
  Display: "<blue>下落不明的大長老</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "其實，我們村莊裡的<dark_red><underlined>大長老</underlined></dark_red><black>已經失蹤了一個多月了，我們懷疑他可能被</black><black><underlined>人仙二族</underlined></black><black>抓去</black><dark_green><italic>鎮<newline></italic></dark_green><dark_green><italic>妖塔</italic></dark_green><black>了……一直找不到適合的人手去探探底子……你願意幫這個忙嗎？ 謝謝你啊！<newline>放心吧，剛出生的小妖妖氣還很薄弱，只要注意一點，混進</black><black><underlined>人<newline></underlined></black><black><underlined>族</underlined></black><black>的</black><dark_green><italic>皇城</italic></dark_green><black>也不是什麼難事。</black>"
    - "<dark_green><italic>鎮妖塔</italic></dark_green><black>就在</black><dark_green><italic>皇城</italic></dark_green><black>的西方，裡面有我們臥底的探子，化名叫做<newline></black><dark_red><underlined>華夭</underlined></dark_red><black>，是一位混血的花妖，想辦法跟她接頭，問問看她知不知道</black><dark_red><underlined>大長老</underlined></dark_red><black>的下落。路上千萬小心，若是暴露身分被</black><black><underlined>人仙</underlined></black><black>追捕，保命重要。</black>"
YuXianZuMengZhuHuiMian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>與仙族盟主會面</blue>"
  Display: "<blue>與仙族盟主會面</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "阿，道友，剛飛升的吧？歡迎來到<dark_green><italic>仙界</italic></dark_green><black>。我是</black><dark_green><italic>仙界</italic></dark_green><black>的</black><dark_red><underlined>盟主</underlined></dark_red><black>之一，這陣子</black><dark_green><italic>下界</italic></dark_green><black>頗不平靜，我們已經許久沒有新成員的加入了。就把這裡當成是你新的家吧。阿……瞧你似乎還穿著<newline></black><dark_green><italic>下界</italic></dark_green><black>的衣著，這些</black><blue>兌換券</blue><black>給你吧，你可以到我們</black><black><underlined>仙族</underlined></black><black>最有名的</black><dark_green><italic>仙器鋪</italic></dark_green><black>那裏去換些</black><blue>仙袍</blue><black>和<newline></black><blue>防身法器</blue><black>。等你熟悉了這邊的環境之後，再來找我吧。</black>"
LingDanDianLaoBanDeZhaoDai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>靈丹店老闆的招待</blue>"
  Display: "<blue>靈丹店老闆的招待</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "喔……原來是剛飛升的朋友，這邊<blue>基礎的回復丹藥</blue><black>你可以盡量領沒關係。我可不像</black><dark_green><italic>仙器<newline></italic></dark_green><dark_green><italic>鋪</italic></dark_green><black>那位吝嗇又卑鄙下流見錢眼開無節操無廉恥不知道飛升上來做什麼的整天只會想著如何偷人油水的沒肩膀沒擔當沒人性不是男……抱歉，情緒激動了點，道友你別在意阿，什麼……？你說我跟</black><dark_red><underlined>那傢伙</underlined></dark_red><black>有過節？才沒有呢，不過就是一開始飛升的時候被那傢伙給騙了用五張</black><blue>兌換券</blue><black>只換了一把</black>"
    - "<blue>爛匕首</blue><black>然後天天被怪殺於是一氣之下決定重新投胎改走煉丹師然後勤練獵妖手段和煉丹術變成仙界如今大名鼎鼎無人不知無人不曉前無古人後無來者的</black><dark_green><italic>第一靈丹鋪</italic></dark_green><black></black><dark_red><underlined>大<newline></underlined></dark_red><dark_red><underlined>老闆</underlined></dark_red><black>，我絕對不會說只要</black><dark_red><underlined>那傢<newline></underlined></dark_red><dark_red><underlined>伙</underlined></dark_red><black>店裡的人來買</black><blue>丹藥</blue><black>我全部加上百分之一千的手續費用以洩我心頭之恨什麼的……絕對沒有！<newline>啊……總之呢，我想你買些簡單的東西就可以回去找</black><dark_red><underlined>盟主</underlined></dark_red><black>了，</black>"
    - "他應該會分派給你一些工作做的。祝你日益精進囉。"
ShiZhongBuCengChuXianDeShen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>始終不曾出現的神</blue>"
  Display: "<blue>始終不曾出現的神</blue>"
  Author: "<blue>劉子驥</blue>"
  Pages:
    - "唉......其他族的<dark_red><underlined>守護神</underlined></dark_red><black>有時候都會降下神蹟，幫助他們的種族渡過難關。<newline>唯有</black><black><underlined>我族</underlined></black><black>的</black><dark_red><underlined>女媧</underlined></dark_red><black>，從來沒有出現過。<newline>雖然傳說都說</black><dark_red><underlined>女媧</underlined></dark_red><black>造了我們</black><black><underlined>人類</underlined></black><black>，但是究竟有沒有人真的看過呢？<newline>雖然</black><black><underlined>人族</underlined></black><black>的</black><dark_red><underlined>女媧</underlined></dark_red><black>祝福還是存在，但是我還是很納悶啊......</black><dark_red><underlined>女<newline></underlined></dark_red><dark_red><underlined>媧</underlined></dark_red><black>究竟到哪裡去了呢......<newline>這位朋友，請問你知道答案嗎？<newline></black>"
    - "......不知道阿......沒關係，如果未來你得到了任何關於<dark_red><underlined>女媧</underlined></dark_red><black>的消息，請一定要告訴我啊！<newline>至於要去哪裡獲得訊息......那只有去找</black><black><underlined>人族</underlined></black><black>最長壽的人吧！<newline>喔不對，應該是</black><black><underlined>仙族</underlined></black><black>最長壽的人。畢竟</black><black><underlined>人</underlined></black><black>會成仙，而</black><black><underlined>仙</underlined></black><black>的壽命更長。<newline>所以去找活的最久的仙人，或許就能知道</black><dark_red><underlined>女媧</underlined></dark_red><black>的去向了！<newline>麻煩你了，如果你有機會到</black><black><underlined>仙<newline></underlined></black><black><underlined>族</underlined></black><black></black><dark_green><italic>蜀山</italic></dark_green><black>的話一定要幫我問問看啊。</black>"
SiShengShouDeQiYuan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>四聖獸的起源</blue>"
  Display: "<blue>四聖獸的起源</blue>"
  Author: "<blue>墨仙</blue>"
  Pages:
    - "你好，我是管理<black><underlined>仙族</underlined></black><black>歷史的</black><dark_red><underlined>墨<newline></underlined></dark_red><dark_red><underlined>仙</underlined></dark_red><black>。<newline>請問需要查詢什麼？<newline>喔......關於</black><dark_red><underlined>四聖獸</underlined></dark_red><black>的歷史嗎？我找找看......有了，就在那一塊區域裡面。<newline></black><dark_red><underlined>四聖獸</underlined></dark_red><black>，是由</black><black><underlined>仙族</underlined></black><black>設計，</black><black><underlined>神仙二<newline></underlined></black><black><underlined>族</underlined></black><black>共同製作的強大法器。<newline>牠們擁有自己的意志，但是指揮權還是握在</black><black><underlined>仙族</underlined></black><black>手中。<newline>製作完成後，</black><black><underlined>仙族</underlined></black><black>將</black><dark_red><underlined>四聖獸</underlined></dark_red><black>的指揮權贈送給</black><black><underlined>神族</underlined></black><black>，作為二族友好的象徵。<newline></black>"
    - "而<black><underlined>神族</underlined></black><black>也善用了</black><dark_red><underlined>四聖獸</underlined></dark_red><black>的能力，將世界管理的井井有條。<newline>但是百年前</black><black><underlined>戰神一族</underlined></black><black>的攻擊，令</black><dark_red><underlined>四聖獸</underlined></dark_red><black>負傷失蹤，不知去向。<newline>嗯......大概就是這些。欸？你很意外</black><dark_red><underlined>四聖獸</underlined></dark_red><black>是</black><black><underlined>我族</underlined></black><black>送給</black><black><underlined>神<newline></underlined></black><black><underlined>族</underlined></black><black>的嗎？<newline>我看看喔......當初做決定的好像是那時的</black><black><underlined>仙族</underlined></black><black></black><dark_red><underlined>盟主</underlined></dark_red><black>。<newline>如果還是很疑惑的話，不妨去找</black><dark_red><underlined>現任的盟主</underlined></dark_red><black>問問看？<newline></black>"
    - "歷代盟主都會有傳承的文獻，或許那裡有你需要的資料。"
XiangMengZhuXunWenSiShengShou:
  Id: "WRITTEN_BOOK"
  Title: "<blue>向盟主詢問四聖獸</blue>"
  Display: "<blue>向盟主詢問四聖獸</blue>"
  Author: "<blue>仙族盟主</blue>"
  Pages:
    - "關於<dark_red><underlined>四聖獸</underlined></dark_red><black>的事情？<newline>原來如此。這件事情我也頗有興趣。<newline>要不是你提到，我還真的不知道</black><dark_red><underlined>四聖獸</underlined></dark_red><black>是我們送給</black><black><underlined>神族</underlined></black><black>的。<newline>我來找找看那一任盟主的日誌......<newline>咦？這卷卷宗是哪裡來的？之前整理的時候怎麼沒有看到？<newline></black>"
    - "-/-/-/-/-/-/-/-/-/-/-<newline>卷宗內容：<newline><dark_red><underlined>四聖獸</underlined></dark_red><black>，將是</black><black><underlined>我族</underlined></black><black>獲得永生的關鍵。<newline>這個計畫太過重要，我將它藏在一枚玉簡中。<newline>並將玉簡和某位</black><dark_red><underlined>值得託付的<newline></underlined></dark_red><dark_red><underlined>族人</underlined></dark_red><black>一起封印在</black><dark_green><italic>虎爪山上的<newline></italic></dark_green><dark_green><italic>某處</italic></dark_green><black>。<newline>只有想知道</black><dark_red><underlined>四聖獸</underlined></dark_red><black>計畫的</black><black><underlined>仙<newline></underlined></black><black><underlined>族</underlined></black><black>同胞才能發現這宗</black><blue>卷宗</blue><black>。<newline></black>"
    - "請帶著<blue>卷宗</blue><black>，前往</black><dark_green><italic>虎爪山的廟<newline></italic></dark_green><dark_green><italic>中</italic></dark_green><black>，尋找一位名叫</black><dark_red><underlined>「雨竹」</underlined></dark_red><black>的仙人。<newline>剩下的事情，他會告訴你的。<newline>-/-/-/-/-/-/-/-/-/-/-<newline>看來我們發現了一個驚天的大秘密啊......<newline>我不能離開，你快帶著</black><blue>卷宗</blue><black>，到上面所標示的</black><dark_green><italic>廟</italic></dark_green><black>中去找這位仙人。<newline></black>"
    - "如果真的能獲得永生之法......我們超越<black><underlined>神族</underlined></black><black>的未來就指日可待了。<newline><newline>系統備註：請記得向</black><dark_red><underlined>盟主</underlined></dark_red>換取<blue>四聖獸計畫的秘卷</blue>。"
LengMoDeShenZuChangLao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>冷漠的神族長老</blue>"
  Display: "<blue>冷漠的神族長老</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "這些拿去吧，到<dark_green><italic>資源中心</italic></dark_green><black>去換些衣服，別光溜溜的走來走去，丟</black><black><underlined>我族</underlined></black><black>的臉。領完東西就回來。</black>"
DanTaFuZeRenDeJieShuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>丹塔負責人的解說</blue>"
  Display: "<blue>丹塔負責人的解說</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "你好，我是<dark_green><italic>丹塔</italic></dark_green><black>的負責人。呃……蛋塔？那是什麼？……算了，總之，你可以在這裡領取一些基本的</black><blue>回復用丹藥</blue><black>。領完之後，就到</black><dark_red><underlined>長老</underlined></dark_red><black>那裏去。</black>"
WuFaKongZhiDeShengShouMen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>無法控制的聖獸們</blue>"
  Display: "<blue>無法控制的聖獸們</blue>"
  Author: "<blue>[必讀]神族主線</blue>"
  Pages:
    - "你是說，你無法進入<dark_green><italic>聖山</italic></dark_green><black>之中？<newline>恩……這就奇怪了，</black><dark_green><italic>聖山</italic></dark_green><black>應該一直以來都是處於我們的控制之下，如果身為</black><black><underlined>神族</underlined></black><black>的你無法進入的話，就代表</black><dark_green><italic>聖山</italic></dark_green><black>和</black><dark_red><underlined>聖獸</underlined></dark_red><black>可能脫離了我們的掌控。<newline>這樣吧，你就到各地去蒐集聖獸祝福，有了祝福之力，應該就可以進入</black><dark_green><italic>聖山</italic></dark_green><black>一探究竟了。<newline>祝福之力分別在東邊</black><dark_green><italic>森林</italic></dark_green><black>中的</black><dark_green><italic>青龍祭壇</italic></dark_green><black>，南邊</black><dark_green><italic>沙漠</italic></dark_green><black>的</black><dark_green><italic>朱雀<newline></italic></dark_green><dark_green><italic>祭壇</italic></dark_green><black>，西邊</black><dark_green><italic>山</italic></dark_green><black>中的</black><dark_green><italic>白虎祭壇</italic></dark_green><black>以及北邊</black><dark_green><italic>湖</italic></dark_green><black>中的</black><dark_green><italic>玄武祭壇</italic></dark_green><black>。<newline></black>"
    - "蒐集到四種祝福之後，就回來找我吧。我會告訴你接下來該做什麼的。<newline><dark_red>注：請務必將四聖獸的祝福之力蒐集完全之後再進行下一階段的任務，否則你將無法前往下一個任務的指定地點。</dark_red><black></black>"
ZhanBeiBuGei:
  Id: "WRITTEN_BOOK"
  Title: "<blue>戰備補給</blue>"
  Display: "<blue>戰備補給</blue>"
  Author: "<blue>戰神族主線</blue>"
  Pages:
    - "我是這裡的<dark_red><underlined>負責人</underlined></dark_red><black>，你可以用<newline></black><blue>兌換券</blue><black>跟旁邊的</black><dark_red><underlined>部員</underlined></dark_red><black>領裝備，記得領你的職業的</black><blue>武器</blue><black>喔別領錯了。<newline>領完之後到</black><dark_green><italic>煉丹室</italic></dark_green><black>去找那邊的</black><dark_red><underlined>負責人</underlined></dark_red><black>吧，他會給你一些</black><blue>基<newline></blue><blue>礎丹藥</blue><black>的。</black>"
TieJiangPuLaoBanDeZhaoDai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>鐵匠鋪老闆的招待</blue>"
  Display: "<blue>鐵匠鋪老闆的招待</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "年輕人，我這裡有最好的初階裝備，有需要的話就來這裡找我吧！什麼？你有<dark_red><underlined>谷主</underlined></dark_red><black>的</black><blue>兌換<newline></blue><blue>券</blue><black>阿？那你可以直接跟旁邊的</black><dark_red><underlined>銷售員</underlined></dark_red><black>換裝備跟武器喔！記得換自己的職業，別換錯了，否則武器會消失喔！之後可以到<newline></black><dark_red><underlined>丹藥店老闆</underlined></dark_red><black>那裏去，他一向很幫助新人的。</black>"
XianQiPuLaoBanDeZhaoDai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>仙器鋪老闆的招待</blue>"
  Display: "<blue>仙器鋪老闆的招待</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "喔喔新面孔，你好你好啊，這位道友，小店賣的法寶都是最經濟實惠的，你看看這紮實的<blue>飛<newline></blue><blue>劍</blue><black>，這華麗的</black><blue>長弓</blue><black>，放心，只收你一萬兩黃金就好...…欸欸你別走阿，好吧那打五折…...不然三折？......什麼嘛原來你有</black><blue>兌換<newline></blue><blue>券</blue><black>阿，早說嘛我就不用跟你廢話………啊不是，是介紹那麼多了。你跟旁邊的那位換點合用的裝備和屬於你職業的</black><blue>仙器</blue><black>吧。領完就可以走了，去</black><dark_green><italic>靈丹鋪</italic></dark_green><black>找那邊的</black><dark_red><underlined>老闆</underlined></dark_red><black>吧，</black>"
    - "他也會給你一些好東西的。領完就快走吧，別妨礙我做生意嘿。"
ZiYuanZhongXinFuZeRenDeJieShao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>資源中心負責人的介紹</blue>"
  Display: "<blue>資源中心負責人的介紹</blue>"
  Author: "<blue>神族主線</blue>"
  Pages:
    - "你好，我是這裡的<dark_red><underlined>負責人</underlined></dark_red><black>，請問有什麼可以為你服務的嗎？阿，原來是要領補給阿，你可以用</black><blue>兌換券</blue><black>和旁邊幾位</black><dark_red><underlined>店員</underlined></dark_red><black>領取基本的</black><blue>穿著</blue><black>，還有</black><blue>武器</blue><black>，不過記得要領和自己職業相符合的，別領錯了。<newline>領完了，就到</black><dark_green><italic>丹塔</italic></dark_green><black>去吧，那邊的<newline></black><dark_red><underlined>負責人</underlined></dark_red><black>會給你一些</black><blue>丹藥</blue><black>的。</black>"
DanYaoDianLaoBanDeZhaoDai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>丹藥店老闆的招待</blue>"
  Display: "<blue>丹藥店老闆的招待</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "可惡的<black><underlined>人族</underlined></black><black>和</black><black><underlined>仙族</underlined></black><black>都只會用我們</black><black><underlined>妖族</underlined></black><black>人的身體和魂魄來煉丹，殊不知真正強大的</black><blue>丹藥</blue><black>可以用純天然的藥材來製作，不過這是我族的秘密，不可以洩漏出去喔！<newline>你說你有興趣阿……不過這些配方也要是煉丹師才能夠學習的，如果你有興趣的話，可以到我們族的</black><dark_green><italic>圖書館</italic></dark_green><black>看看，除了配方之外還有很多好東西呢。<newline></black>"
    - "阿，我這裡剛好有要給<dark_red><underlined>管理員</underlined></dark_red><black>的東西，你幫我送去</black><dark_green><italic>圖書館</italic></dark_green><black>好了，順便去參觀一下那裏，要知道我族的</black><dark_green><italic>圖書館</italic></dark_green><black>可是記載歷史最為齊全的喔。<newline>另外，想要最基礎的</black><blue>治療丹藥</blue><black>的話，可以直接和</black><dark_red><underlined>店員</underlined></dark_red><black>拿喔。那就下次再見囉，快去</black><dark_green><italic>圖書館</italic></dark_green><black>看看吧，</black><dark_green><italic>圖書館</italic></dark_green><black>就在</black><dark_green><italic>智慧之樹的根部</italic></dark_green><black>，你不會錯過的！</black>"
LanTuDeJianDingJieGuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>藍圖的鑑定結果</blue>"
  Display: "<blue>藍圖的鑑定結果</blue>"
  Author: "<blue>戒忍上仙</blue>"
  Pages:
    - "找我什麼事呢？我這陣子已經製作了夠多法器了，不要再來找我訂購了喔。<newline>欸？不是法器的事？<newline>這......這是<dark_red><underlined>四聖獸</underlined></dark_red><black>的</black><blue>設計藍圖</blue><black>？<newline>不會錯的，就是</black><blue>四聖獸的設計<newline></blue><blue>手稿</blue><black>，詳細的程度實在讓人吃驚......<newline>等等，你是從哪裡拿到這份</black><blue>藍<newline></blue><blue>圖</blue><black>的？<newline></black><black><underlined>仙族</underlined></black><black>的</black><dark_green><italic>藏書閣</italic></dark_green><black>？怎麼可能？<newline></black>"
    - "如果我們可以製作出<dark_red><underlined>四聖獸</underlined></dark_red><black>，為何還要忍氣吞聲的侍奉</black><black><underlined>神<newline></underlined></black><black><underlined>族</underlined></black><black>。<newline>不，等等......這份</black><blue>藍圖</blue><black>可能真的出自</black><black><underlined>我族</underlined></black><black>之手。<newline>就我所知，</black><black><underlined>神族</underlined></black><black>雖然強大，但是一向缺乏創造能力，不可能設計出這麼複雜的東西來。<newline>可是，如果</black><dark_red><underlined>四聖獸</underlined></dark_red><black>真的是由我們</black><black><underlined>仙族</underlined></black><black>設計的，成品又為何會到了</black><black><underlined>神族</underlined></black><black>的手上？<newline>越想越不對勁......<newline></black>"
    - "這樣吧，你到<dark_green><italic>蜀山</italic></dark_green><black>中間那座大石碑去，找負責管理歷史的</black><dark_red><underlined>墨<newline></underlined></dark_red><dark_red><underlined>仙</underlined></dark_red><black>問問看，<newline>看看文獻中有沒有記載這方面的訊息。</black>"
YaoZuJiuJingCongHeErLai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>妖族究竟從何而來？</blue>"
  Display: "<blue>妖族究竟從何而來？</blue>"
  Author: "<blue>燃燈</blue>"
  Pages:
    - "<black><underlined>神族</underlined></black><black>自</black><dark_red><underlined>盤古</underlined></dark_red><black>開天闢地起，就繼承祂的血脈而存在著。<newline>而</black><black><underlined>人仙二族</underlined></black><black>，均出自</black><black><underlined>我族</underlined></black><black>的</black><dark_red><underlined>女<newline></underlined></dark_red><dark_red><underlined>媧</underlined></dark_red><black>之手。<newline>只有</black><black><underlined>妖族</underlined></black><black>，不知從何而來，為何而生。<newline>而當</black><black><underlined>我族</underlined></black><black>的族人想要探索</black><black><underlined>妖<newline></underlined></black><black><underlined>族</underlined></black><black>的秘密時，卻受到世界意志-也就是天道的阻撓。<newline>這就像是當年</black><dark_red><underlined>長老</underlined></dark_red><black>想要一舉殲滅反抗的</black><black><underlined>妖族</underlined></black><black>，卻因為天道的妨礙而作罷。<newline></black>"
    - "天道究竟為何要維護<black><underlined>妖族</underlined></black><black>？又為何要制約</black><black><underlined>我族</underlined></black><black>？<newline>這些問題一直縈繞在我的心頭揮之不去。<newline>朋友啊，有機會的話，可否請你潛入</black><black><underlined>妖族</underlined></black><black>村落中，到牠們號稱世界最齊全的</black><dark_green><italic>圖書館</italic></dark_green><black>去看看？<newline>或許會有所發現也不一定。</black>"
YaoZuDeQiYuan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>妖族的起源</blue>"
  Display: "<blue>妖族的起源</blue>"
  Author: "<blue>妖族圖書館管理員</blue>"
  Pages:
    - "你好，對<black><underlined>妖族</underlined></black><black>友善的</black><black><underlined>神族</underlined></black><black>朋友。<newline>有問題想要請教我嗎？當然沒問題，很樂意為你服務。<newline></black><black><underlined>我族</underlined></black><black>的起源......？這倒是個有趣的問題。<newline></black><black><underlined>我族</underlined></black><black>關於起源的資料相當稀少，就我所知，大部分的資料都是有關於</black><black><underlined>其他幾族</underlined></black><black>的起源。<newline>我看看喔......這卷卷宗裡似乎有記載。<newline></black>"
    - "嗯......裡面有提到<black><underlined>我族</underlined></black><black>出現的時間比</black><black><underlined>神族</underlined></black><black>稍晚，但是比</black><black><underlined>人仙二族</underlined></black><black>要早。<newline>不過並沒有提到為何而出現，又或者是怎麼出現的。<newline>畢竟對於自己的起源，除非像是</black><black><underlined>神族</underlined></black><black>一樣直接繼承部份</black><dark_red><underlined>盤<newline></underlined></dark_red><dark_red><underlined>古古神</underlined></dark_red><black>的記憶，不然應該都是不甚清楚的。<newline>人總不可能知道自己誕生的過程，你說是吧？<newline>不過儘管如此，也還是有辦法的。<newline></black>"
    - "在<dark_green><italic>大陸的南方沙漠</italic></dark_green><black>裡，有一座<newline></black><dark_green><italic>古石碑</italic></dark_green><black>。據說它自</black><dark_red><underlined>盤古</underlined></dark_red><black>開天就存在了，上面記載著一些沒有人看得懂的資訊。<newline>若有人可以翻譯它的話，或許可以幫你解答你的疑惑。</black>"
ZhiZuoSiShengShouDeKeNengXing:
  Id: "WRITTEN_BOOK"
  Title: "<blue>製作四聖獸的可能性？</blue>"
  Display: "<blue>製作四聖獸的可能性？</blue>"
  Author: "<blue>藏書閣管理員</blue>"
  Pages:
    - "嘿，這位道友，向你打聽一件事。<newline>你知道<dark_red><underlined>四聖獸</underlined></dark_red><black>嗎？<newline>對啊，就是協助</black><black><underlined>神族</underlined></black><black>管理世界，但是後來遭到攻擊而失蹤的<newline></black><dark_red><underlined>四聖獸</underlined></dark_red><black>。<newline>你知道我在</black><dark_green><italic>藏書閣的禁區</italic></dark_green><black>裡面發現什麼嗎？居然是</black><dark_red><underlined>四聖<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>的</black><blue>製作藍圖</blue><black>！<newline>雖然我看不懂裡面的內容，但是很明顯的這就是</black><blue>藍圖</blue><black>。<newline></black>"
    - "這個發現實在太令我興奮了。如果我們可以製作出<dark_red><underlined>四聖<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>來，那麼就可以和</black><black><underlined>神族</underlined></black><black>一較高下了啊！<newline>我現在沒辦法離開崗位，你幫我把這份</black><blue>藍圖</blue><black>拿去給這裡最厲害的</black><dark_red><underlined>工匠-戒忍上仙</underlined></dark_red><black>，請他看看這份製作圖究竟是真是假？</black>"
JieJueRiJianZengQiangDeYuanQi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>解決日漸增強的怨氣</blue>"
  Display: "<blue>解決日漸增強的怨氣</blue>"
  Author: "<blue>墓園的白骨精</blue>"
  Pages:
    - "你好，我是這座墓園的<dark_red><underlined>白骨精</underlined></dark_red><black>。<newline>喔你放心，我不會害人的。真正會害人的，只有人而已啦。<newline>我們</black><black><underlined>妖精一族</underlined></black><black>從來不需要藉由殺害人類來增強能力，很多都是杜撰出來的謠言。<newline>反倒是</black><black><underlined>人和仙二族</underlined></black><black>常常抓我們的族人去煉丹......<newline>啊跑題了，這些不重要啦，你是否有空能夠幫我一個忙呢？<newline>不知道從什麼時候開始，</black><dark_green><italic>墓園</italic></dark_green><black>的怨氣越來越重，這些怨氣通</black>"
    - "常都是被殺害的人的不甘和怨恨所形成的。<newline>雖然不知道為什麼<dark_green><italic>墓園</italic></dark_green><black>最近的無名屍一具具的增加，不過這些怨氣已經影響到我們妖精的健康了。<newline>我可以施法淨化怨氣，但是前提是怨氣要凝結成實體。<newline>所以如果你在附近的怪物身上找到</black><blue>怨氣的結晶</blue><black>，麻煩拿到我這裡來。<newline>我會回報你的。<newline>每次拿30顆過來就可以了，謝謝你喔。</black>"
    - "------任務情報------<newline>任務發布者：<newline><black><underlined>妖族</underlined></black><black> - </black><dark_red><underlined>墓園的白骨精</underlined></dark_red><black><newline>回報地點：</black><dark_green><italic>墓園</italic></dark_green><black><newline>任務需求：30個</black><blue>怨氣的結晶</blue><black><newline>任務獎勵：以下任選一<newline>1.</black><blue>高級回復丹藥</blue><black>若干<newline>2.</black><blue>中級藥引</blue><black>X2<newline>3.</black><blue>妖族友好的證明</blue><black>X1<newline>------------------</black>"
ShiZongDeShouMuRen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>失蹤的守墓人</blue>"
  Display: "<blue>失蹤的守墓人</blue>"
  Author: "<blue>墓園的白骨精</blue>"
  Pages:
    - "唉......其實阿，我們這個<dark_green><italic>墓園</italic></dark_green><black>原本有個很棒的</black><dark_red><underlined>守墓人</underlined></dark_red><black>，除了管理</black><dark_green><italic>墓園</italic></dark_green><black>外也常常會來找我聊聊天阿什麼的。<newline>雖然我必須鎮著這裡的怨氣而無法離開，但有他的陪伴日子倒也不太難過。<newline>不過前幾天，大概是年紀也大了吧，</black><black><underlined>人類</underlined></black><black>真是脆弱阿......不好意思離題了。<newline>他說他的腳舊傷發作了要去看醫生，後來就沒有回來了。<newline></black>"
    - "我如果離開<dark_green><italic>墓園</italic></dark_green><black>，怕這裡的怨氣會爆發出去，可是......我也很擔心他是不是出了什麼事。<newline>可不可以拜託你幫我看看他究竟怎麼了？</black>"
ShaMoZhongDeEBa:
  Id: "WRITTEN_BOOK"
  Title: "<blue>沙漠中的惡霸</blue>"
  Display: "<blue>沙漠中的惡霸</blue>"
  Author: "<blue>被搶劫的富商-王員外</blue>"
  Pages:
    - "喔......這些馬賊實在是太可怕了......<newline>我的<blue>貨物</blue><black>阿......我的錢阿......<newline>大俠，你一定要幫幫我。<newline>這群馬賊實在是無法無天！居然光天化日之下就搶劫我的<newline></black><blue>貨物</blue><black>。<newline>可否請大俠幫我拿回我的財產？<newline>事後一定重金酬謝！<newline></black>"
    - "聽說馬賊有一個<dark_green><italic>賊窩</italic></dark_green><black>，不過詳細位置我就不太清楚了。<newline>若找回了我的</black><blue>貨物</blue><black>，請一定要帶來給我！拜託了！<newline>一批</black><blue>貨物</blue><black>有64個，若找齊了一批</black><blue>貨物</blue><black>就請拿來給我吧。</black>"
    - "------任務情報------<newline>任務發布者：<newline><black><underlined>人族</underlined></black><black> - </black><dark_red><underlined>被搶劫的富商-王員外</underlined></dark_red><black><newline>任務需求：64個</black><blue>王員外被搶走<newline></blue><blue>的貨物</blue><black><newline>任務獎勵：以下任選一<newline>1.</black><blue>高級回復丹藥</blue><black><newline>2.金錢<newline>3.</black><blue>元素</blue><black>X30<newline>------------------</black>"
XinShouShangLu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>新手上路</blue>"
  Display: "<blue>新手上路</blue>"
  Author: "<blue>人族主線</blue>"
  Pages:
    - "啊……你也到了要出去看看世面的年紀了阿……<newline>不過沒什麼裝備可不能就這樣出去闖盪呢，這些<blue>兌換券</blue><black>給你吧，你可以到</black><dark_green><italic>鐵匠鋪</italic></dark_green><black>去換點東西，等你熟悉了村莊之後，再來找我，我有些事情要交代給你。</black>"
LiDaFuDeZhenDuan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>李大夫的診斷</blue>"
  Display: "<blue>李大夫的診斷</blue>"
  Author: "<blue>李大夫</blue>"
  Pages:
    - "您好，來看病的嗎？那麼請將手放上來。<newline>有沒有見過一個<dark_red><underlined>腳傷的老伯</underlined></dark_red><black>嗎？嗯......我遇過的病人那麼多，實在沒有什麼印象了。<newline>就我看來，你氣色灰暗，印堂發黑，應是血路不通、新血瘀阻，且脈象虛浮，恐怕是腰腎虧空。<newline>想必你最近常有頭暈腰酸之症狀吧！<newline></black>"
    - "這個狀況若持續下去是相當危險的，需要及時治療。現在天色已晚，不嫌棄的話就在此留宿一夜吧。<newline>我出門去採幾味用的上的草藥，明日再為你治療。<newline>另外如果口渴可喝甕裡的水，<newline><dark_green><italic>門外井裡</italic></dark_green><black>的水之前被惡意下過毒，切記不要去碰。</black>"
ShiBeiShangDeNeiRongJiuJingShi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>石碑上的內容究竟是</blue>"
  Display: "<blue>石碑上的內容究竟是</blue>"
  Author: "<blue>篆元真人</blue>"
  Pages:
    - "喔喔<black><underlined>神族</underlined></black><black>的朋友你好。你是來詢問石碑事情的嗎？<newline>可以是可以，不過這座石碑上的訊息量太過龐大，你自己「問」它吧。<newline>聽不懂我的意思？讓我告訴你吧，這座</black><dark_red><underlined>石碑</underlined></dark_red><black>可是不是死物，他可是自</black><dark_red><underlined>盤古</underlined></dark_red><black>開天闢地以前就存在的靈石。<newline>他會思考會說話，所以石碑上記載的都是他親眼所見親自紀錄的事。<newline>想知道什麼，問他最準確了。<newline></black>"
    - "把這個拿去吧，用<blue>這挫粉末</blue><black>喚醒他。<newline>把</black><blue>粉末</blue><black>丟到石碑前的地上就可以了。</black>"
ShangXianDeFanNao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>上仙的煩惱</blue>"
  Display: "<blue>上仙的煩惱</blue>"
  Author: "<blue>篆元真人</blue>"
  Pages:
    - "你好，你問我在這裡做什麼？<newline>我在看這個美麗的石碑阿！<newline>你看看這些紋理，這些文字......真是太美麗了。<newline>只是......前幾天周圍的怪物趁我不注意的時候，把我翻譯的<newline><blue>資料文獻</blue><black>偷走了！<newline>當然我想他們可能主要是想要偷我的仙丹啦......<newline></black>"
    - "不管怎麼說，沒有那些<blue>翻譯文<newline></blue><blue>獻</blue><black>，我的考古工作很難繼續進行。<newline>如果你在周圍有發現我</black><blue>被偷<newline></blue><blue>的文獻</blue><black>的話，麻煩30個一組拿過來我這裡。<newline>我會給你一些報酬的。</black>"
    - "------任務情報------<newline>任務發布者：<newline><black><underlined>仙族</underlined></black><black> - </black><dark_red><underlined>篆元真人</underlined></dark_red><black><newline>回報地點：<newline></black><dark_green><italic>沙漠的石碑</italic></dark_green><black><newline>任務需求：30個</black><blue>上仙被搶走的<newline></blue><blue>文獻</blue><black><newline>任務獎勵：以下任選一<newline>1.</black><blue>中級回復丹藥</blue><black>若干<newline>2.</black><blue>中級藥引</blue><black>X2<newline>3.</black><blue>仙族友好的證明</blue><black>X1<newline>------------------</black>"
YuLuoDeXieYi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>羽羅的謝意</blue>"
  Display: "<blue>羽羅的謝意</blue>"
  Author: "<blue>御前帶刀侍衛長-羽羅</blue>"
  Pages:
    - "您好，我是<dark_red><underlined>御前帶刀侍衛長-羽<newline></underlined></dark_red><dark_red><underlined>羅</underlined></dark_red><black>。<newline>非常感謝閣下的協助。<newline>這名</black><dark_red><underlined>殺人大夫</underlined></dark_red><black>手段殘忍，從</black><dark_green><italic>地<newline></italic></dark_green><dark_green><italic>下研究室</italic></dark_green><black>的痕跡來看，恐怕已有多人受害。<newline>然而他一直隱身於此罕有人跡之處，因此難以追查。<newline>不論如何，再次感謝閣下的援手，避免了更多人的受害。<newline>這些獎勵是</black><dark_green><italic>皇城</italic></dark_green><black>對閣下的感謝，請閣下收下吧。</black>"
YaoZuDanShengDeZhenXiang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>妖族誕生的真相</blue>"
  Display: "<blue>妖族誕生的真相</blue>"
  Author: "<blue>石碑的精魄</blue>"
  Pages:
    - "哈啾！哈......哈啾！<newline>我說，你們這些野蠻人就沒有文明一點的方式嗎？<newline>老是拿<blue>胡椒粉</blue><black>往我鼻子上撒......真是的......<newline>好啦，你這小傢伙，有什麼想問我的嗎？<newline>我可是上知天文下知地理，無所不知無所不曉的</black><dark_red><underlined>神石碑碑</underlined></dark_red><black>～哈啾<newline>喔......想知道</black><black><underlined>妖族</underlined></black><black>的起源？這倒是個有趣的問題。<newline></black>"
    - "不過，身為<black><underlined>神族</underlined></black><black>的你，真的有這樣的覺悟想要知道真相嗎？<newline>......好吧，既然你如此堅持，那我就告訴你歷史的事實吧。<newline><newline></black><black><underlined>妖族</underlined></black><black>，其實是比</black><black><underlined>神族</underlined></black><black>，甚至是比<newline></black><dark_red><underlined>盤古</underlined></dark_red><black>，更古老的存在。<newline>早在</black><dark_red><underlined>盤古</underlined></dark_red><black>還未開天闢地之時，</black><black><underlined>妖族</underlined></black><black>就已經存在了，而且</black><black><underlined>妖族</underlined></black><black>和這個世界是一體的。<newline></black><dark_red><underlined>盤古</underlined></dark_red><black>強行破開天地，將宇宙切開，這才逼迫</black><black><underlined>妖族</underlined></black><black>必須化形，用雙腿在地上行走。<newline></black>"
    - "<black><underlined>妖族</underlined></black><black>才是這個世界的原住民，<newline></black><black><underlined>神族</underlined></black><black>才是外來的種族。<newline>這也是為何世界的意志-天道如此的維護</black><black><underlined>妖族</underlined></black><black>。<newline>因為</black><black><underlined>妖族</underlined></black><black>的出現就是世界意志的展現！是世界為了抵抗</black><black><underlined>神<newline></underlined></black><black><underlined>族</underlined></black><black>的「殖民」所做出的「抵抗」！<newline><newline>......你問我為什麼會知道？因為我也是</black><black><underlined>妖族</underlined></black><black>的族人。<newline>我原本是混沌的宇宙中最早清醒的一團雲霧。<newline></black>"
    - "我親眼看著<dark_red><underlined>盤古</underlined></dark_red><black>切開宇宙，分開天地，然後力盡而亡。<newline>我親眼看著</black><black><underlined>神族</underlined></black><black>的誕生和</black><black><underlined>妖<newline></underlined></black><black><underlined>族</underlined></black><black>的化形......<newline>嘖嘖......你相信也好不相信也罷，滾回去吧。真是掃我的興。<newline>以後別來了，這就是你想要知道的真相。<newline><newline></black><dark_gray><bold><italic>真相是殘酷的......不能接<newline></italic></bold></dark_gray><dark_gray><bold><italic>受，就不要尋找。</italic></bold></dark_gray>"
FanHuaDeGuoWang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>繁華的過往</blue>"
  Display: "<blue>繁華的過往</blue>"
  Author: "<blue>曾經的水族族人靈魂</blue>"
  Pages:
    - "你好啊旅行者。<newline>啊......對的，我是幽靈，我已經去世很久了。<newline>你問我為何在這裡？大概是因為我對這個村莊還有執著吧......<newline>我原本是隱世一族<underlined>海族<black>的族人。<newline>我們一族因為觸怒</black><underlined><dark_red></dark_red></underlined>玄武神<black>，因此被懲罰，村莊慢慢的沒落......<newline>我也忘記我是怎麼死的了，但是我死後，不知為何就變成現在這個樣子了。<newline></black></underlined>"
    - "而我變成幽靈之後，反而可以聽到以前族人死前的怨念和不平。<newline>感慨人就是貪心又自私的存在啊......<newline>這股怨念已經化成負面的力量，將通往<dark_green><italic>玄武神廟</italic></dark_green><black>的通路封住了。<newline>......你說你必須要到</black><dark_green><italic>神廟</italic></dark_green><black>裡面去？<newline></black><dark_red><underlined>玄武神</underlined></dark_red><black>不在</black><dark_green><italic>神廟</italic></dark_green><black>裡，所以怨念無法消解。<newline>如果你想進</black><dark_green><italic>神廟</italic></dark_green><black>的話，就必須要化解通道入口處的怨氣。<newline></black>"
    - "嗯......這個<dark_green><italic>村莊</italic></dark_green><black>有一處供奉的</black><dark_green><italic>祭台</italic></dark_green><black>，試試看各放十個</black><blue>元素</blue><black>進去，然後站到中間祈禱試試。<newline>我想，對於誠心供奉和祈禱的人，</black><dark_red><underlined>怨靈</underlined></dark_red><black>不至於會太過為難的。<newline>祈禱完後，再到</black><dark_green><italic>玄武祭壇的入<newline></italic></dark_green><dark_green><italic>口</italic></dark_green><black>試試吧。<newline>-玄水湖區域主線到此結束-</black>"
ZhuZaiHuDiDeMinZu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>住在湖底的民族</blue>"
  Display: "<blue>住在湖底的民族</blue>"
  Author: "<blue>水淵</blue>"
  Pages:
    - "你好啊異鄉人，我是<black><underlined>水族</underlined></black><black>的</black><dark_red><underlined>族</underlined></dark_red><dark_red><underlined>長水淵</underlined></dark_red><black>。......沒聽過</black><black><underlined>水族</underlined></black><black>？那也不奇怪，你能夠到這裡是因為過幾天剛好是一年一度的慶典-洄游祭。我們族內的入口並不會一直開啟，每年只會開放幾天，而洄游祭剛好是其中之一。</black><black><underlined>水族</underlined></black><black>是一個人口稀少，與世無爭的種族。我們能在水中呼吸，以</black><dark_red><underlined>玄武神</underlined></dark_red><black>的名義在水下生活著。洄游祭典主要是慶祝鮭魚群的回歸，歡迎你來共襄盛舉。</black>"
    - "欸？你想要瞻仰<dark_red><underlined>玄武神</underlined></dark_red><black>的</black><dark_green><italic>神</italic></dark_green><dark_green><italic>廟</italic></dark_green><black>？嗯......這有點難辦，一般來說我們沒事是不會去</black><dark_green><italic>神廟</italic></dark_green><black>的。只有在祭典當天或是需要祭司占卜的時候才會進入</black><dark_green><italic>神</italic></dark_green><dark_green><italic>廟所在的秘境</italic></dark_green><black>，而且外鄉人祭典期間也不能進入參觀......這樣吧，你去找族裡的</black><dark_red><underlined>祭司洛</underlined></dark_red><dark_red><underlined>禾</underlined></dark_red><black>問問看，看看他有沒有通融的辦法。</black>"
ZhanShenYiZuYinJuDiNeiZhanShenDeShiLian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>戰神一族隱居地內戰神的試煉</blue>"
  Display: "<blue>戰神一族隱居地內戰神的試煉</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "大家都知道，<black><underlined>戰神族</underlined></black><black>的守護神是</black><dark_red><underlined>蚩尤</underlined></dark_red><black>。<newline></black><black><underlined>戰神</underlined></black><black></black><dark_red><underlined>蚩尤</underlined></dark_red><black>為了訓練後輩，在</black><black><underlined>戰<newline></underlined></black><black><underlined>神族</underlined></black><black>的領地設立了一個試煉。<newline>通過的人無論是哪一個種族，都可以獲得</black><dark_red><underlined>蚩尤</underlined></dark_red><black>的獎賞。<newline>不過前提當然是能夠進入</black><black><underlined>戰<newline></underlined></black><black><underlined>神族</underlined></black><black>村莊並且進入</black><dark_green><italic>試煉之地</italic></dark_green><black>當中才行。<newline>試煉雖然獎勵豐厚，但是種族守護神的能力將無法庇護進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的人。<newline></black>"
    - "也就是說，各個種族的人將會喪失他們的種族能力，也無法在死亡後使用<blue>重生石</blue><black>避開死亡懲罰。<newline>而且在試煉中死亡的人，將會在</black><dark_green><italic>試煉之地</italic></dark_green><black>直接重生，不會回到自己種族的</black><dark_green><italic>重生之地</italic></dark_green><black>。<newline>要離開</black><dark_green><italic>試煉之地</italic></dark_green><black>，只有通過試煉或是因為等級不足被踢出<newline></black><dark_green><italic>試煉之地</italic></dark_green><black>兩種選擇。<newline>雖然獎勵非常豐厚，但是難度相對的也相當高。<newline>請要進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的勇者們三思。</black>"
ZuiZhongYaoDeRen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>最重要的人</blue>"
  Display: "<blue>最重要的人</blue>"
  Author: "<blue>雜貨鋪老闆-荻野</blue>"
  Pages:
    - "感謝你......我看到<blue>緞帶</blue><black>總算想起來了。<newline>沒錯，</black><dark_red><underlined>翠情</underlined></dark_red><black>她還在等著我......<newline>當初想趕快賺錢娶她進門，所以獨自運送貨物到這座</black><dark_green><italic>沙漠</italic></dark_green><black>。<newline>結果路上遇到了馬賊，受傷之後忘記了所有的記憶。<newline>還好村莊裡的人把我救回來，但是也因此忘記了家在哪裡......<newline></black>"
    - "還好你來找我，不然我可能一輩子都無法想起<dark_red><underlined>翠情</underlined></dark_red><black>，一想到有這個可能性，我的心就像被剖開一樣難受......<newline>總之，真的感謝你。<newline>我這就動身回家了。這些是我的報酬，雖然不是什麼稀有的東西，但是希望你能收下。</black>"
HuiYouJiDeZhunBeiGongZuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>洄游季的準備工作</blue>"
  Display: "<blue>洄游季的準備工作</blue>"
  Author: "<blue>洛禾</blue>"
  Pages:
    - "你沒看到我現在很忙嗎，去去去，別礙著我工作。......<dark_red><underlined>族長</underlined></dark_red><black>叫你來找我的？啊？你要進</black><dark_green><italic>神廟</italic></dark_green><black>？這可不行，洄游季三天後舉行，我得準備好這些東西，除了祭典的幹部之外，誰都不允許在祭典之前進入</black><dark_green><italic>神廟</italic></dark_green><black>，而且祭典當天雖然開放外族人參觀，但是也只能在族裡參與慶祝晚會，祭典的祭神儀式是不允許你們這些外人參觀的。這是傳統，你求我也沒有用啊。</black>"
    - "呃......無論如何也必須要進去嗎......這樣吧，我想到了一個辦法，你來幫我準備祭典如何？祭神的時候不允許外人參加，可是事前準備的時候幹部可以進入<dark_green><italic>神廟</italic></dark_green><black>裡面。所以如果你來幫我準備</black><dark_green><italic>神廟</italic></dark_green><black>祭神所需要的東西，那麼你就可以在前一天先進去逛逛，如何？好，那就這麼說定了。</black>"
    - "先幫我準備個<black>10條</black><blue>鮭魚</blue><black>吧，這是祭神需要用到的供品，給我之後我再告訴你下一個步驟。如果需要</black><blue>釣竿</blue><black>的話，跟族裡的</black><dark_red><underlined>顧小漢</underlined></dark_red><black>購買吧，他是族裡唯一不敢下水直接抓魚的。不然族裡也沒人會需要用到</black><blue>釣竿</blue><black>。</black>"
XuanWuDeRenKe:
  Id: "WRITTEN_BOOK"
  Title: "<blue>玄武的認可</blue>"
  Display: "<blue>玄武的認可</blue>"
  Author: "<blue>洛禾</blue>"
  Pages:
    - "太感謝你了！接下來就再幫我一個忙吧，幫我到族裡的<dark_green><italic>元素祭台</italic></dark_green><black>，供奉上五種</black><blue>代表金木水火土徵象的素材</blue><black>各10個製作而成的祭祀物，這個我可以幫你製作。供奉之後就可以獲得</black><dark_red><underlined>玄武</underlined></dark_red><black>的認可，也就可以進入</black><dark_green><italic>玄武神廟</italic></dark_green><black>囉。雖然還想讓你多做些事，不過其他事情都是你幫不上忙的，所以做到這裡就可以囉。獲取認可之後，就可以從東側的出口</black>"
    - "<dark_green><italic>前往玄武祭壇</italic></dark_green><black>，然後進入</black><dark_green><italic>神廟</italic></dark_green><black>囉。</black>"
YongShengZhiFaZaoShenJiHua:
  Id: "WRITTEN_BOOK"
  Title: "<blue>永生之法-造神計畫</blue>"
  Display: "<blue>永生之法-造神計畫</blue>"
  Author: "<blue>雨竹</blue>"
  Pages:
    - "你終於來了......我在這裡已經不知道度過了多少個寒暑。<newline>但是在持有<blue>卷宗</blue><black>的人來找我之前，我不能夠離開。<newline>現在，你來了，我們終於可以知道，</black><dark_red><underlined>盟主</underlined></dark_red><black>當初計畫的事情到底<newline></black><black>是什麼了......<newline>(</black><dark_red><underlined>雨竹</underlined></dark_red><black>將自己手中的玉簡與你帶的那一份放在一起，兩個物體接合在一起，然後在空中浮現了一個仙人的影像)<newline></black>"
    - "-/-/-/-/-/-/-/-/-/-/-<newline>仙人：<newline>你們好，我是<black><underlined>仙族</underlined></black><black></black><dark_red><underlined>盟主-梓決</underlined></dark_red><black>。<newline>你們能夠看到這段影像，就代表有緣獲得</black><blue>密卷</blue><black>的人，和</black><dark_red><underlined>雨竹</underlined></dark_red><black>，你們兩個都在現場。<newline>我現在要講的，是攸關</black><black><underlined>仙族</underlined></black><black>的，重大的秘密。<newline>你們應該知道，</black><black><underlined>神族</underlined></black><black>繼承了</black><dark_red><underlined>盤<newline></underlined></dark_red><dark_red><underlined>古</underlined></dark_red><black>的血脈，他們與天地同壽，能力強大無比......<newline>相對於祂們，我們</black><black><underlined>仙人</underlined></black><black>的壽命，至多二千歲。<newline></black>"
    - "即使我們擁有的才華比<black><underlined>神</underlined></black><black>還要多，還要大，<newline>在歲月的侵襲下，終會歸於塵土。<newline><newline>因此，</black><black><underlined>我族</underlined></black><black>一直以來，就在尋找能夠永生的方法。<newline>而我，發現了一個可能性，那就是，重塑</black><dark_red><underlined>「盤古神」</underlined></dark_red><black>！<newline>是的，這個計畫就是為了讓</black><black><underlined>我族</underlined></black><black>獲得永生所設計的「造神計畫」。<newline></black>"
    - "只要控制了<dark_red><underlined>盤古神</underlined></dark_red><black>，我們一定能發掘永生的秘密。<newline><newline>為了重塑</black><dark_red><underlined>盤古</underlined></dark_red><black>，我和</black><black><underlined>仙族</underlined></black><black>幾位天賦異稟的工匠，設計了</black><dark_red><underlined>「四<newline></underlined></dark_red><dark_red><underlined>聖獸」</underlined></dark_red><black>。<newline>這四隻</black><dark_red><underlined>聖獸</underlined></dark_red><black>，其實就是提取日月精華，重塑「盤古肉身」的陣法根源。<newline>我們聯手製造了</black><dark_red><underlined>四聖獸</underlined></dark_red><black>，並將牠們送給了</black><black><underlined>神族</underlined></black><black>。<newline>利用五行和風水，一步一步的實現造神的偉大理想！<newline><newline></black>"
    - "這個陣法發動的時間不確定，但是總有一天，<dark_red><underlined>四聖獸</underlined></dark_red><black>將齊聚一堂，重塑</black><dark_red><underlined>盤古</underlined></dark_red><black>肉身。<newline><newline>期望後世的你們，可以將這件事情轉達給</black><black><underlined>仙族</underlined></black><black>的同胞。<newline>告訴他們，我們獲得永生的日子不遠了！<newline>-/-/-/-/-/-/-/-/-/-/-<newline><newline></black>"
    - "原來如此......這就是<dark_red><underlined>盟主</underlined></dark_red><black>想要達成的計畫嗎......<newline>我度過這麼多個年頭，早就知道了永生是一件多麼痛苦的事情......<newline><newline></black><dark_gray><bold><italic>真相是貪婪的......如果已<newline></italic></bold></dark_gray><dark_gray><bold><italic>經看破塵世，就請不要給予<newline></italic></bold></dark_gray><dark_gray><bold><italic>太多的期待......</italic></bold></dark_gray>"
JieFaZhenXiang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>揭發真相</blue>"
  Display: "<blue>揭發真相</blue>"
  Author: "<blue>綠洲小鎮的鎮長</blue>"
  Pages:
    - "這封<blue>信</blue><black>是......？<newline>......原來如此，火山下面的構造是這個樣子嗎......<newline>等等，這封</black><blue>信</blue><black>的背面......是祭壇設施的改建圖？<newline>有了這個，就可以利用火山的能量改善我們的生活環境了。<newline></black><dark_red><underlined>蓮心</underlined></dark_red><black>她真的是個天才......是我們辜負了她......<newline>她的</black><dark_red><underlined>弟弟</underlined></dark_red><black>是去年獻祭的祭品......她大概很想報仇吧。<newline></black>"
    - "我這就帶巡守隊去把<dark_red><underlined>紅鸞</underlined></dark_red><black>抓起來，有這些證據，她休想再煽動信徒胡作非為。<newline>等等......這裡面夾的</black><blue>信</blue><black>是給你的，拿去吧。</black>"
ChongChiZhuYouChouQiFenDeXiaoZhen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>充斥著憂愁氣氛的小鎮</blue>"
  Display: "<blue>充斥著憂愁氣氛的小鎮</blue>"
  Author: "<blue>綠洲小鎮的鎮長</blue>"
  Pages:
    - "你好啊旅行者，歡迎來到這裡，這兒是<dark_green><italic>焱砂大漠</italic></dark_green><black>中唯一的</black><dark_green><italic>綠洲</italic></dark_green><black>。<newline>啊......？覺得鎮上氣氛很奇怪？<newline>唉......這你就有所不知了，自從</black><dark_red><underlined>朱雀神上</underlined></dark_red><black>離開</black><dark_green><italic>南方沙漠</italic></dark_green><black>之後，這裡的氣候變得越來越不穩定，近幾年小鎮旁的</black><dark_green><italic>火山口</italic></dark_green><black>似乎又有了要噴發的跡象......<newline></black>"
    - "鎮上的<dark_red><underlined>巫者</underlined></dark_red><black>說這是因為</black><dark_red><underlined>火山之神</underlined></dark_red><black>發怒了，所以我們要準備一名祭品，獻給</black><dark_red><underlined>火山神</underlined></dark_red><black>。<newline>如果你想詢問關於</black><dark_red><underlined>聖獸朱雀</underlined></dark_red><black>或是</black><dark_green><italic>火山</italic></dark_green><black>的事情的話，可以去找鎮裡的</black><dark_red><underlined>巫者</underlined></dark_red><black>，她叫做</black><dark_red><underlined>紅鸞</underlined></dark_red><black>。</black>"
GeiWuYiHuiBaoDeMoShengRen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>給無以回報的陌生人</blue>"
  Display: "<blue>給無以回報的陌生人</blue>"
  Author: "<blue>蓮心</blue>"
  Pages:
    - "當你看到這封<blue>信</blue><black>的時候，我已經不在了。<newline>感謝你對我的幫助，而我甚至不知道你的名字......<newline>我其實有一個</black><dark_red><underlined>弟弟</underlined></dark_red><black>。早年父母雙亡，我和他相依為命。<newline>他是個好孩子，既懂事又聰明......<newline>但是，他在去年的獻祭中，被當作是祭品，活生生的丟入了</black><dark_green><italic>火山口</italic></dark_green><black>。<newline>而我，只能眼睜睜的看著他的死亡，卻無力阻止。<newline></black>"
    - "我真是個不合格的姊姊。<newline>我恨著鎮上的每一個人......<newline><newline>你知道嗎？我其實可以讓<dark_green><italic>火山</italic></dark_green><black>噴發，將整座城鎮掩埋的。<newline>但是你出現了，你讓我知道，並不是所有的人都只會冷眼旁觀，冷血無情。<newline>所以，我想，做到這裡就夠了。<newline></black><dark_red><underlined>紅鸞</underlined></dark_red><black>會受到她該有的懲罰......<newline></black>"
    - "而我，要去找我的<dark_red><underlined>弟弟</underlined></dark_red><black>了。<newline>他從小就依賴我，沒有我可不行呢。<newline><newline>真的很謝謝你，我相信無論你的目標是什麼，一定都能達成的。<newline>因為我在你的眼中，看到了溫暖和希望。<newline></black><dark_red><underlined>蓮心</underlined></dark_red><black>  絕筆<newline>-焱砂大漠區域主線到此結束</black>"
ZhuoNaShaRenMo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>捉拿殺人魔</blue>"
  Display: "<blue>捉拿殺人魔</blue>"
  Author: "<blue>御前帶刀侍衛長-羽羅</blue>"
  Pages:
    - "您好，我是<dark_red><underlined>御前帶刀侍衛長-羽<newline></underlined></dark_red><dark_red><underlined>羅</underlined></dark_red><black>。<newline>非常感謝閣下的協助，</black><dark_green><italic>皇城</italic></dark_green><black>附近冒險者失蹤的傳聞已久，前日我們經過一番追查卻還是不慎走漏風聲讓他順利逃脫。若非閣下即時援手，想必會有更多人受害。這些是那名</black><dark_red><underlined>殺人魔</underlined></dark_red><black>的通緝令懸賞金，以示</black><dark_green><italic>皇城</italic></dark_green><black>對您的感謝之意，請閣下務必收下。</black>"
HuoShanZhiShenDeDaiYanRen:
  Id: "WRITTEN_BOOK"
  Title: "<blue>火山之神的代言人</blue>"
  Display: "<blue>火山之神的代言人</blue>"
  Author: "<blue>巫者紅鸞</blue>"
  Pages:
    - "......你想知道有關於<dark_red><underlined>朱雀</underlined></dark_red><black>的事情？<newline></black><dark_red><underlined>朱雀</underlined></dark_red><black>不會回來了，這裡是</black><dark_red><underlined>火山之神</underlined></dark_red><black>管轄的範圍，任何事情都需要經過祂的指示。<newline>如果違背他的命令，</black><dark_green><italic>火山</italic></dark_green><black>便會噴發，將我們所有的人瞬間殺死......<newline></black><dark_red><underlined>火山之神</underlined></dark_red><black>這次需要一名少女當作祭品。<newline></black>"
    - "嗯......村莊裡好像沒剩幾位少女可以選了......<newline>啊，我想起來了。那位老是喜歡待在<dark_green><italic>舊村莊廢墟</italic></dark_green><black>裡的</black><dark_red><underlined>那丫頭</underlined></dark_red><black>。<newline>幫我一個忙吧，你沿著路繼續走，到</black><dark_green><italic>舊的廢棄村莊</italic></dark_green><black>去，找一位叫做</black><dark_red><underlined>蓮心</underlined></dark_red><black>的女孩，叫她過來見我。</black>"
XiaoShiDeGongPin:
  Id: "WRITTEN_BOOK"
  Title: "<blue>消失的供品</blue>"
  Display: "<blue>消失的供品</blue>"
  Author: "<blue>山神廟的廟公</blue>"
  Pages:
    - "您好，我是<dark_green><italic>山神廟</italic></dark_green><black>的</black><dark_red><underlined>廟公</underlined></dark_red><black>。<newline>最近</black><dark_green><italic>森林</italic></dark_green><black>裡的動物和怪物都越來越可怕了。<newline>雖然每次他們暴動的時候我都躲起來，但是原本要供奉給山神的</black><blue>供品</blue><black>卻全部都被他們搶走了。<newline>可不可以請你幫我把</black><blue>供品</blue><black>搶回來呢？<newline>我可以用這座森林裡的一些特產和你交換，只要每次30個<newline></black><blue>供品</blue><black>就可以了～</black>"
    - "------任務情報------<newline>任務發布者：<newline><black><underlined>人族</underlined></black><black> - </black><dark_red><underlined>山神廟的廟公</underlined></dark_red><black><newline>回報地點：<newline></black><dark_green><italic>叢林內的山神廟</italic></dark_green><black><newline>任務需求：30個</black><blue>被搶走的山神<newline></blue><blue>廟供品</blue><black><newline>任務獎勵：以下任選一<newline>1.</black><blue>經驗瓶</blue><black>X3  <newline>2.</black><blue>初級藥引</blue><black>X2  <newline>3.</black><blue>山神的祝福</blue><black>X1  <newline>4.</black><blue>人族友好的證明</blue><black>X1<newline>------------------</black>"
DeLeXiangSiBingDeZhiNu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>得了相思病的織女</blue>"
  Display: "<blue>得了相思病的織女</blue>"
  Author: "<blue>織女</blue>"
  Pages:
    - "道友請留步！看你行色匆匆，想必是要到<dark_green><italic>下界</italic></dark_green><black>去吧？<newline>是這樣的......本小姐之前在</black><dark_green><italic>下<newline></italic></dark_green><dark_green><italic>界</italic></dark_green><black>遊歷時，曾經遇見一名人類正在虐待</black><dark_red><underlined>水牛</underlined></dark_red><black>。<newline>身為</black><black><underlined>仙族</underlined></black><black>有名的女俠客，本小姐當然馬上出手解救了那隻<newline></black><dark_red><underlined>水牛</underlined></dark_red><black>。<newline>沒想到那隻</black><dark_red><underlined>水牛</underlined></dark_red><black>其實是隻</black><dark_red><underlined>水<newline></underlined></dark_red><dark_red><underlined>牛精</underlined></dark_red><black>，而且是一個超帥的翩翩美少年！<newline>當時本小姐善心大發，沒有把他抓去</black><dark_green><italic>鎮妖塔</italic></dark_green><black>，就放他離開了。<newline><newline></black>"
    - "可是......沒想到回到<dark_green><italic>仙界</italic></dark_green><black>以後，本小姐竟然開始......<newline>就是......那個......就就就茶不思飯不想天天想著那隻</black><dark_red><underlined>水牛精</underlined></dark_red><black>啦！<newline>他實在是太帥了簡直就是全天下......咳咳......不好意思，總之就是，這位道友就去幫本小姐把他抓.....不是，是帶回來吧。<newline>把本小姐的</black><blue>彩帶</blue><black>帶去，這樣他一定會想起來的！<newline>系統備註：請記得用</black><blue>仙族證<newline></blue><blue>明</blue><black>與</black><dark_red><underlined>織女</underlined></dark_red><black>兌換</black><blue>織女的彩帶</blue><black></black>"
ShiZongDeErZi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>失蹤的兒子</blue>"
  Display: "<blue>失蹤的兒子</blue>"
  Author: "<blue>傷心的老爺爺</blue>"
  Pages:
    - "你好啊旅行者，請問，你有在附近看到一個<dark_red><underlined>小孩子</underlined></dark_red><black>嗎？<newline>......沒有啊......那也沒關係，謝謝你啊。<newline>你問我在找誰？<newline>唉......我在等我的兒子</black><dark_red><underlined>「虎子<newline></underlined></dark_red><dark_red><underlined>」</underlined></dark_red><black>。<newline>我原本和我老伴兒住在</black><dark_green><italic>虎爪山裡的小村落</italic></dark_green><black>，我們村落的人口不多，主要是靠和來往的旅行者貿易維生。<newline>傳說</black><dark_green><italic>虎爪山中的迷宮洞穴</italic></dark_green><black>藏有寶藏，因此時常會有冒險者前來探尋，不過都無功而返。<newline></black>"
    - "即便是我們這些住在<dark_green><italic>洞穴</italic></dark_green><black>旁的人，進去都要花好一番功夫才能出來，更別說是尋寶了......<newline>這些往事就不提了......<newline>我們的兒子</black><dark_red><underlined>「虎子」</underlined></dark_red><black>，在八歲的時候失蹤了。<newline>村落裡的人都幫忙尋找，但是怎麼找就是找不到他......<newline>我們一直沒有放棄希望，持續等待和尋找著。<newline></black>"
    - "就在去年，我老伴兒過世了，而<dark_green><italic>迷宮</italic></dark_green><black>也不知道為什麼充滿了各種妖怪，我們大家只好被迫搬離原本的村落。<newline>我現在住在</black><dark_green><italic>皇城</italic></dark_green><black>，但是每天還是會走到這裡來，希望有一天能夠找到失蹤的</black><dark_red><underlined>虎子</underlined></dark_red><black>......<newline>如果你有看到他的話，麻煩告訴他，我們很想念他......</black>"
PingAnJiuHao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>平安就好</blue>"
  Display: "<blue>平安就好</blue>"
  Author: "<blue>傷心的老爺爺</blue>"
  Pages:
    - "這是！？<blue>虎子的肚兜</blue><black>，你是在哪裡發現的？<newline>......你是說，他沒事嗎？太好了......平安就好，平安就好。<newline>他不願見我也沒有關係，知道他平安我就很滿足了。<newline>我和老伴兒一直都知道，這孩子有些與眾不同。例如他二歲就能吟詩，三歲就能寫字。<newline></black>"
    - "在一起的那幾年，他也常常偷偷幫我們一些忙，例如在隔天要販賣的包子餡中加了些很難獲得的香料，或是趁我們不在的時候把破損的衣服和鍋碗修復的完好如初......<newline>我們一直都知道，他不可能永遠待在我們身邊的......<newline>如果你遇到他，請你幫我轉達，告訴他爹爹我安心了，也會好好照顧自己，請他也不用擔心我。<newline>照顧好他自己比什麼都來的重要。"
RuiZhiDeShaoNu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>睿智的少女</blue>"
  Display: "<blue>睿智的少女</blue>"
  Author: "<blue>蓮心</blue>"
  Pages:
    - "你好，請問你找我有什麼事情嗎？<newline>......<dark_red><underlined>紅鸞</underlined></dark_red><black>請你來找我的？<newline>嗯，我大概知道了，是祭品的事情吧？<newline>不是我能未卜先知，而是因為</black><dark_red><underlined>紅鸞</underlined></dark_red><black>她會假借</black><dark_red><underlined>火山神</underlined></dark_red><black>的旨意指定祭品，將不相信她的人處以死刑。<newline>我從來就沒有相信過她，所以她遲早得將我除掉的......<newline>我之所以知道她在說謊，是因為</black><dark_red><underlined>火山神</underlined></dark_red><black>根本就不存在。<newline></black>"
    - "我從很早以前就蒐集了許多關於這座<dark_green><italic>「噴火神山」</italic></dark_green><black>的資料。<newline>事實上，這座火山的不穩定是從</black><dark_red><underlined>聖獸朱雀</underlined></dark_red><black>在約百年前的離去有關。<newline>記載中的火山活動，近幾年來有越來越頻繁的趨勢，這也才因此讓</black><dark_red><underlined>巫者</underlined></dark_red><black>得以招搖撞騙。<newline>如果我的理論沒錯，火山下方應該有可以控制它的東西存在著......<newline></black>"
    - "我翻了很多的資料，準備調配一種可以<blue>讓人不畏懼岩漿的丹藥</blue><black>，要是能有多一點的時間就好了......<newline>你要幫我？那我就先謝過了。<newline>為了要調配</black><blue>丹藥</blue><black>，我需要十個</black><blue>炎蜥砂</blue><black>，以及三枚</black><blue>初級藥引</blue><black>，你將這些給我，我就能調配出這種</black><blue>丹藥</blue><black>來。<newline>幫你調配好之後，服下</black><blue>丹藥</blue><black>，直接跳進</black><dark_green><italic>岩漿口</italic></dark_green><black>吧。<newline></black>"
    - "如果我的理論沒有錯，火山洞內<dark_green><italic>靠近平台那一側</italic></dark_green><black>應該有個可以進入火山內部的</black><dark_green><italic>通道</italic></dark_green><black>。<newline>從</black><dark_green><italic>通道</italic></dark_green><black>進去應該就能夠瞭解火山的秘密了。<newline>另外，我調配的</black><blue>丹藥</blue><black>持續時間不長，所以請小心使用。<newline>謝謝你了，時間不多，快去快回吧，我在這裡等著。</black>"
BuGaoErBieDeKuZhong:
  Id: "WRITTEN_BOOK"
  Title: "<blue>不告而別的苦衷</blue>"
  Display: "<blue>不告而別的苦衷</blue>"
  Author: "<blue>孤伶伶的小男孩</blue>"
  Pages:
    - "你好，請問你是......？<newline>你，你怎麼知道我的名字的？<newline>好久沒有人這麼叫我了......<newline>什麼！？你是說，<dark_red><underlined>爹爹</underlined></dark_red><black>他直到現在還在找我嗎？<newline>那個笨老頭，為什麼要這麼固執呢......<newline>娘過世了！？孩兒不孝，沒能見上最後一面......<newline><newline>等等......我在你身上感覺到了熟悉的波動......<newline>你身上怎麼會有</black><dark_red><underlined>青龍大人</underlined></dark_red><black>的祝福？<newline></black>"
    - "......原來如此，正在蒐集祝福之力嗎......<newline>那我想我說實話應該也沒有關係了。<newline>我其實，是掌管<dark_green><italic>白虎祭壇</italic></dark_green><black>的</black><dark_red><underlined>白<newline></underlined></dark_red><dark_red><underlined>虎分魂</underlined></dark_red><black>。<newline>多年以前因為意外，力竭倒在</black><dark_green><italic>迷宮洞口</italic></dark_green><black>，被我的</black><dark_red><underlined>養父母</underlined></dark_red><black>所救。<newline>我因為受傷，暫時保持小孩子的型態，而他們待我就有如親生兒子一般......<newline></black>"
    - "直到約五年以前，我發現<dark_red><underlined>白虎<newline></underlined></dark_red><dark_red><underlined>大人</underlined></dark_red><black>留在</black><dark_green><italic>神廟和祭壇</italic></dark_green><black>的力量慢慢的減弱了。<newline>有時我甚至沒辦法保持實體，只能變回分魂的狀態。<newline>這時我才警覺到，我脫離崗位太久了。<newline>即便萬分不捨，我也只能選擇離開......<newline><newline></black>"
    - "如果<dark_red><underlined>白虎大人</underlined></dark_red><black>回來，我勢必會回歸本體，而分魂的意識和記憶將不復存在。<newline>若是</black><dark_red><underlined>白虎大人</underlined></dark_red><black>在能量耗盡之前無法回來，那等著我的，也就只有消失......<newline><newline>你可以幫我一個忙嗎？<newline>把這個</black><blue>肚兜</blue><black>交給</black><dark_red><underlined>我爹</underlined></dark_red><black>，告訴他我過得很好，請他不用擔心......<newline>系統提示：請記得向</black><dark_red><underlined>虎子</underlined></dark_red><black>換取</black><blue>小孩子的肚兜</blue><black></black>"
HuZiDeHuiBao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>虎子的回報</blue>"
  Display: "<blue>虎子的回報</blue>"
  Author: "<blue>孤伶伶的小男孩</blue>"
  Pages:
    - "謝謝你，真的謝謝你。<newline>這樣了卻了我的一樁心願。<newline>作為報答，就告訴你<dark_green><italic>祭壇</italic></dark_green><black>的位置吧。<newline>事實上，通過這座</black><dark_green><italic>迷宮</italic></dark_green><black>，你就能找到</black><dark_green><italic>聖獸白虎的祭壇</italic></dark_green><black>。<newline>神廟的力量應該還足夠給予你祝福的力量。<newline></black>"
    - "這首詩送給你，希望能夠協助你走出<dark_green><italic>迷宮</italic></dark_green><black>，我會在</black><dark_green><italic>神廟</italic></dark_green><black>等你，期待你的蒞臨。<newline><newline>迷陣迂迴把路藏，<newline>貪嗔癡者必徬徨。<newline>精怪流連乃尋常，<newline>流泉靈水潛下方。<newline>通道半途將頭仰，<newline>作壁上觀走一趟。<newline>扶搖直上二三敞，<newline>長廊盡頭虎吉祥。<newline>-虎爪山區域主線到此結束-</black>"
ChiLaiDeQianJiu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>遲來的歉疚</blue>"
  Display: "<blue>遲來的歉疚</blue>"
  Author: "<blue>雨竹</blue>"
  Pages:
    - "我從來......就沒有怪過<dark_red><underlined>盟主</underlined></dark_red><black>......<newline>我從小就不太聰明，要不是因為他的幫忙，我恐怕連飛昇成仙都有困難。<newline>他對我來說，是父親一樣的存在......<newline>所以，即便知道這個任務凶險萬分，要試用當時還沒有經過測試的陣法。<newline>即便......知道我有拒絕的權力，我還是接下了這個任務，守在這座廟中。<newline></black>"
    - "幾千年以來，<dark_red><underlined>盟主</underlined></dark_red><black>他從來沒有找過我，而我又因為陣法的緣故，無法離開這裡。<newline>我甚至擔心，</black><dark_red><underlined>盟主</underlined></dark_red><black>他是不是就這樣死了......<newline>雖然守在廟裡什麼都不能做，偶爾也會感到寂寞，我真的從來沒有怨懟過。<newline>你說我是不是很傻......<newline><newline></black>"
    - "信裡的最後寫著，願不願意隨他應天道的召喚回歸大地......<newline><newline>死亡從來就不是一件可怕得事情。<newline>怕得是當要結束的時候，我沒有跟在你的身後......"
XiongShenTaiSuiDeRuoDian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>兇神太歲的弱點</blue>"
  Display: "<blue>兇神太歲的弱點</blue>"
  Author: "<blue>研究沙漠生態的學者</blue>"
  Pages:
    - "你知道嗎？<dark_red><underlined>惡土魂</underlined></dark_red><black>這種惡靈，很難被一般的攻擊傷害到。像是用劍砍或是用弓箭射，效率都很低。不過，煉丹師的</black><blue>丹藥</blue><black>可以侵入他們的身體內，因此</black><dark_red><underlined>惡土魂</underlined></dark_red><black>非常懼怕</black><blue>丹藥</blue><black>。你知道</black><dark_red><underlined>太歲</underlined></dark_red><black>嗎？傳說中的兇神，據說所到之處村莊都被夷為平地。好在牠只會出現在沙漠少數地方，因此對</black><dark_green><italic>村莊</italic></dark_green><black>以及</black><dark_green><italic>皇城</italic></dark_green><black>的危害不高。</black>"
    - "<dark_red><underlined>兇神太歲</underlined></dark_red><black>完全不怕一般武器的攻擊，只有</black><blue>丹藥</blue><black>才能傷得了牠。不過牠身上也有許多價值連城的寶貝，所以如果有辦法的話，嘗試著用</black><blue>丹藥</blue><black>打倒牠也是不錯得選擇。當然，攜帶的</black><blue>丹藥</blue><black>可不能少。</black>"
XiuFuPoMiao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>修復破廟</blue>"
  Display: "<blue>修復破廟</blue>"
  Author: "<blue>雨竹</blue>"
  Pages:
    - "好久沒有人到這裡來了阿......<newline>你好，我是<dark_red><underlined>雨竹</underlined></dark_red><black>，負責掌管這座<newline></black><dark_green><italic>地仙廟</italic></dark_green><black>。<newline>我......有特殊的原因，不能離開這裡。原本以我的靈力可以維持這座小廟不至於年久失修。但近十幾年來，不知道從哪邊來了一群山魅，在這山中作祟，甚至在這小廟後方築起了巢。<newline>我的靈力都耗費在抵抗牠們了，於是如你所見，這</black><dark_green><italic>地仙廟</italic></dark_green><black>就變得如此殘破不堪了。<newline></black>"
    - "為了補充我消耗的靈力，可否麻煩你幫忙進入山魅所築的<dark_green><italic>迷宮</italic></dark_green><black>，幫我封印牠們呢？<newline><newline>每帶回一隻</black><blue>山魅</blue><black>，做為回報，我願意傳授一部份的經驗給你。</black>"
MiShuYuanSuLianHuaDaFa:
  Id: "WRITTEN_BOOK"
  Title: "<gold>秘術-元素煉化大法</gold>"
  Display: "<gold>秘術-元素煉化大法</gold>"
  Author: "<blue>太上老君</blue>"
  Pages:
    - "真是後生可畏啊......<newline>那麼，我就傳授你這元素煉化大法吧。<newline>首先，你需要有五階品階以上的<blue>煉丹爐</blue><black>。<newline>再來，你會需要濃縮過的</black><blue>元素<newline></blue><blue>結晶</blue><black>。結晶可以請一旁的</black><dark_red><underlined>藥<newline></underlined></dark_red><dark_red><underlined>僮</underlined></dark_red><black>幫你處理，收點手續費就行......</black>"
    - "有了這兩樣東西，才有辦法使用煉化大法。<newline>想要發動這個陣法，你需要把<newline><blue>煉丹爐</blue><black>放在道具欄的第一格。<newline>然後呢，手持</black><blue>濃縮結晶</blue><black>，稍待幾秒就可以發動該屬性的煉化陣法。陣法的施展距離你得自己練習一下，若是擁有傳說中的</black><blue><bold>神器品階煉丹爐</bold></blue><black>，陣法的範圍還可以再擴大些。</black>"
    - "因為<blue>濃縮結晶</blue><black>相當貴重，因此如果只想施展一次，施放完畢之後就要將結晶收起，以免連續施放，浪費</black><blue>元素</blue><black>。<newline>使用每一種</black><blue>元素結晶</blue><black>，陣法給予的效果都不同，接下來我便詳細的介紹一下。</black>"
    - "[<gold><bold>金</bold></gold><black>-蝕骨旋風]<newline><newline>使用一個</black><blue>金煞爪結晶</blue><black>即可施放此陣。<newline>煉化</black><blue>金煞爪</blue><black>會對周遭的所有敵人造成大面積的腐蝕傷害。<newline>但是對於由死氣所聚集而成的怪物反而會有反效果。<newline>例如：殭屍，兵馬俑，骷髏等等。因此要小心使用。</black>"
    - "[<dark_green><bold>木</bold></dark_green><black>-生機領域]<newline><newline>使用一個</black><blue>木靈心結晶</blue><black>即可施放此陣。<newline>煉化</black><blue>木靈心</blue><black>會給予周遭大範圍的隊友生命之力，使他們回復健康，並且解除各種異常狀態。<newline>範圍廣大，可以協助團隊度過危機。</black>"
    - "[<dark_blue><bold>水</bold></dark_blue><black>-毒潮洶湧]<newline><newline>使用一個</black><blue>玄水鱗結晶</blue><black>即可施放此陣。<newline>煉化</black><blue>玄水鱗</blue><black>會使周遭所有的敵人陷入劇毒狀態一段時間。<newline>不過要注意，針對死亡生物或是蜘蛛類的敵人無效。</black>"
    - "[<dark_red><bold>火</bold></dark_red><black>-祝融結界]<newline><newline>使用一個</black><blue>炎蜥砂結晶</blue><black>即可施放此陣。<newline>煉化</black><blue>炎蜥砂</blue><black>讓周遭的敵人陷入火海。<newline>並且給予隊友暫時性的守護火焰，使他們不畏懼高熱熔岩與火焰。</black>"
    - "[<dark_gray><bold>土</bold></dark_gray><black>-氣脈封鎖]<newline><newline>使用一個</black><blue>石膽珀結晶</blue><black>即可施放此陣。<newline>煉化</black><blue>石膽珀</blue><black>會封鎖周遭所有敵人的氣脈，使他們動作遲緩。<newline>但是對於沒有腿的怪物，例如惡土之魂這類用跳躍的方式前進的怪物來說沒有效果。</black>"
    - "最後，你問我有沒有辦法教你濃縮元素結晶的方法？<newline>恩咳，我只答應教你煉化之法，沒說要教你濃縮之法啊......<newline>總之，只要你給予足夠的報酬，我這邊都能幫你把<blue>元素</blue><black>濃縮起來的。</black>"
GuanWuYuanSuLianHuaDaFa:
  Id: "WRITTEN_BOOK"
  Title: "<blue>關於元素煉化大法</blue>"
  Display: "<blue>關於元素煉化大法</blue>"
  Author: "<blue>太上老君</blue>"
  Pages:
    - "自古以來，煉丹師們飽受歧視和折磨，大家都視我們為肩不能挑手不能提的弱小職業，但是，我發明了一種陣法，能夠迅速的用<blue>煉丹爐</blue><black>煉化</black><blue>元素</blue><black>，並彈射出去，對周圍的敵人造成傷害。<newline><newline>你，想學嗎？</black>"
    - "想學會這項技能並不簡單，你得要非常精於控制<blue>元素</blue><black>的煉化才行，除非通過我的考驗，否則我不會傳授你這「元素煉化大法」。<newline>如果你心意已決，就到那邊的金色地板站著吧。你的任務就是幫我看著煉丹爐的火候。記住，只有當煉丹爐冒出白煙的時候，你才能離開金色地板的位置。途中不論看到什麼或聽到什麼，你都不可以移動，或是觸碰任何東西，知道嗎？</black>"
    - "當爐頂冒出白煙的時候，就是丹藥好了。你要即時離開<dark_green><italic>試<newline></italic></dark_green><dark_green><italic>煉池</italic></dark_green><black>，提醒我該收丹藥了。早一步或晚一步，或是你被幻覺所惑而動搖了，丹藥都會煉製失敗。<newline>如果你能幫我看好這爐丹藥，我便傳授與你這元素煉化大法罷。</black>"
