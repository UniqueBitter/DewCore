  Pages:
    - "年輕人，我這裡有最好的初階裝備，有需要的話就來這裡找我吧！什麼？你有<dark_red><underlined>村長</underlined></dark_red><black>的</black><blue>兌換<newline></blue><blue>券</blue><black>阿？那你可以直接跟旁邊的</black><dark_red><underlined>兌換員</underlined></dark_red><black>換裝備跟武器喔！記得換自己的職業，別換錯了，否則武器會消失喔！之後可以到<newline></black><dark_red><underlined>丹藥舖掌櫃</underlined></dark_red><black>那裏去，他一向很幫助新手玩家的。</black>"
