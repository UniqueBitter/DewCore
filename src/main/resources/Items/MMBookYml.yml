GongPinLingQuGuiZe:
  Id: "WRITTEN_BOOK"
  Title: "<gold>供品領取規則</gold>"
  Display: "<gold>供品領取規則</gold>"
  Author: "<blue>供品管理人-霍賈</blue>"
  Pages:
    - "你好，你可以在我這裡領取我族的供品，你會獲得隨機的物資。<newline>不過，每個人一個時辰只能領取一次，領取過了之後，等時間到了，我會通知你的。<newline>此外，與我族有關的戰役發生時，戰役的結果會影響供品物資的數量，所以請盡量贏得每一場戰役吧。<newline><newline>我們的供品內容是一些<blue>基本<newline></blue><blue>元素</blue><black>和元寶，希望對你的旅程會有所幫助。</black>"
BuKenJiuFanDeShuiNiu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>不肯就範的水牛</blue>"
  Display: "<blue>不肯就範的水牛</blue>"
  Author: "<blue>水牛精</blue>"
  Pages:
    - "呃！？您是那個<dark_red><underlined>大力士女俠</underlined></dark_red><black>派來的仙人......請，請問您有什麼事情嗎？不會是要抓我去煉丹吧......<newline><newline>......欸？您的意思是，</black><dark_red><underlined>女俠</underlined></dark_red><black>她對我朝思暮想？可是，我對她一點想法也沒有啊，</black><black><underlined>仙妖</underlined></black><black>殊途，我們是不會有結果的......<newline><newline>你，你不要過來，我警告你，我會反抗的！</black>"
EMengDeJieShu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>惡夢的結束</blue>"
  Display: "<blue>惡夢的結束</blue>"
  Author: "<blue>忘塵</blue>"
  Pages:
    - "這是！！！？？？<newline>這枚\\u00269玉珮\\u00260，是我和\\u00264\\u0026n芊無\\u00260的定情信物，你看，我有另一半\\u00269玉珮\\u00260，上面刻著\\u00264\\u0026n「芊無」\\u00260......<newline><newline>我害怕答案是我所不想知道的，所以我不敢去尋找......但是我周圍的人並沒有停止搜尋過她的下落。<newline><newline>你知道那種感覺嗎？永遠都不能確定下一秒是不是就會接到她的死訊......<newline><newline>"
    - "\\u00264\\u0026n芊無\\u00260......我總算等到你了......<newline><newline>謝謝你，我得趕去\\u00262\\u0026o蓬萊\\u00260了。"
SiShouXueXingZhenYaDeZhenXiang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>四獸血腥鎮壓的真相</blue>"
  Display: "<blue>四獸血腥鎮壓的真相</blue>"
  Author: "<blue>千絲谷谷主忘塵</blue>"
  Pages:
    - "當年......我還在<dark_green><italic>崑崙</italic></dark_green><black>的時候，有一位生死相許的伴侶，她叫做<newline></black><dark_red><underlined>芊無天君</underlined></dark_red><black>。<newline></black><dark_red><underlined>長老</underlined></dark_red><black>頒布了一系列逼</black><black><underlined>各族</underlined></black><black>繳納供品的措施時，<newline></black><dark_red><underlined>芊無</underlined></dark_red><black>她不顧我的反對，參加了「戰神聯盟」。<newline>那陣子我在</black><dark_green><italic>崑崙</italic></dark_green><black>和</black><dark_green><italic>聯盟據點</italic></dark_green><black>兩地跑，每次都苦口婆心的勸她回來。<newline>但是她非常堅持。<newline></black>"
    - "而就在那時，<dark_red><underlined>長老</underlined></dark_red><black>突然決定要殲滅這些他認為有危險的因子。<newline>即便戰神聯盟並沒有要推翻</black><black><underlined>神族</underlined></black><black>地位的想法......<newline><newline></black><dark_red><underlined>長老</underlined></dark_red><black>他召開了一個看似民主的會議，邀請我和</black><dark_red><underlined>貪狼星君</underlined></dark_red><black>一起參與。<newline>但是，誰都知道</black><dark_red><underlined>貪狼星君</underlined></dark_red><black>好戰，只要和征戰有關的事情他一定會同意的。<newline></black>"
    - "而<dark_red><underlined>長老</underlined></dark_red><black>會選擇我的原因，只是因為他知道憑我和</black><dark_red><underlined>芊無</underlined></dark_red><black>的關係，一定會反對鎮壓行動。<newline>二票對一票，看起來似乎比較不那麼獨斷。<newline><newline>但是我知道，<newline>這是一場必輸的局。<newline><newline>會議一結束，我便用最快的速度前往</black><dark_green><italic>聯盟據點</italic></dark_green><black>通知</black><dark_red><underlined>芊無</underlined></dark_red><black>，並試圖說服戰神聯盟的其他人，趕快撤離</black><dark_green><italic>據點</italic></dark_green><black>。<newline></black>"
    - "但是他們並不知道<dark_red><underlined>四聖獸</underlined></dark_red><black>的力量是何等的強大，因此大部分的人並不願意和我離開。<newline>我只好先帶一部分的人走，而</black><dark_red><underlined><newline></underlined></dark_red><dark_red><underlined>芊無</underlined></dark_red><black>則繼續留在</black><dark_green><italic>據點</italic></dark_green><black>說服其他人。<newline>但是，就在我再次回到</black><dark_green><italic>據點</italic></dark_green><black>的時候，等待我的只是熊熊烈火和滿地的屍首......<newline><newline>我只好帶著一部分的人，離開</black><dark_green><italic>據點</italic></dark_green><black>，到這裡來，重新開始，將這裡命名為</black><dark_green><italic>「千絲谷」</italic></dark_green><black>。<newline></black>"
    - "而<dark_red><underlined>芊無</underlined></dark_red><black>......我沒有去尋找或確認，也沒有那個勇氣去確認......<newline>我也不知道在我離開之後，還有多少聯盟的人存活下來。<newline><newline></black><dark_gray><bold><italic>真相是沉痛的......不能忘<newline></italic></bold></dark_gray><dark_gray><bold><italic>卻，就不要試圖想起。</italic></bold></dark_gray>"
XunWenGuanWuSiShouZhenYaDeLiShi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>詢問關於四獸鎮壓的歷史</blue>"
  Display: "<blue>詢問關於四獸鎮壓的歷史</blue>"
  Author: "<blue>九幽</blue>"
  Pages:
    - "你好，請問你是？<newline>......原來如此，是<dark_red><underlined>族長</underlined></dark_red><black>派你來的。有什麼需要我幫忙的嗎？<newline>關於當年</black><dark_red><underlined>四獸</underlined></dark_red><black>鎮壓</black><black><underlined>我族</underlined></black><black></black><dark_green><italic>聯盟<newline></italic></dark_green><dark_green><italic>據點</italic></dark_green><black>的歷史嗎？我可以找找看我這幾年來蒐集的資訊，不確定有沒有......<newline>嗯......找到了，關於</black><dark_red><underlined>四聖獸</underlined></dark_red><black>事件的歷史文獻。<newline><newline>當年決定以</black><dark_red><underlined>四獸</underlined></dark_red><black>鎮壓</black><dark_green><italic>戰神聯<newline></italic></dark_green><dark_green><italic>盟</italic></dark_green><black>的，是</black><black><underlined>神族</underlined></black><black>的</black><dark_red><underlined>長老</underlined></dark_red><black>與</black><dark_red><underlined>幹部</underlined></dark_red><black>在會議中共同決定的結果。<newline></black>"
    - "以下是當初參與會議的名單：<newline><dark_red><underlined>神族長老</underlined></dark_red><black><newline></black><dark_red><underlined>貪狼星君</underlined></dark_red><black><newline></black><dark_red><underlined>塵囂天君</underlined></dark_red><black><newline><newline>主要是這三位。<newline>這是巧合嗎......名單上的神，現在還待在</black><dark_green><italic>崑崙</italic></dark_green><black>的，就只剩下</black><dark_red><underlined>長<newline></underlined></dark_red><dark_red><underlined>老</underlined></dark_red><black>一人了。<newline></black><dark_red><underlined>貪狼星君</underlined></dark_red><black>是當初帶領</black><dark_red><underlined>四獸</underlined></dark_red><black>出征</black><dark_green><italic>據點</italic></dark_green><black>的人，但是在那一場戰爭中隕落了。<newline></black>"
    - "而<dark_red><underlined>塵囂天君</underlined></dark_red><black>則是在出征前夕突然失蹤......<newline><newline>詳細的情形可能要問當初有參與會議的神才會知道了。<newline>什麼？你問我為何不去詢問<newline></black><dark_red><underlined>神族長老</underlined></dark_red><black>？<newline>這你就不知道了，</black><dark_red><underlined>長老</underlined></dark_red><black>是非常殘酷的，我可不敢惹。<newline>就連</black><black><underlined>同族的神</underlined></black><black>，只要違逆</black><dark_red><underlined>長老</underlined></dark_red><black>意思的，都能在轉眼間灰飛煙滅，更何況是異族人。<newline></black>"
    - "我在這裡做間諜幾十年，都不敢和他對上一眼，深怕被他發現我是潛入的間諜。<newline>想要去套<dark_red><underlined>長老</underlined></dark_red><black>的話？不，那一定是瘋了......<newline><newline>除了</black><dark_red><underlined>長老</underlined></dark_red><black>以外，也還有其他選擇啊，例如不知所蹤的</black><dark_red><underlined>塵囂天<newline></underlined></dark_red><dark_red><underlined>君</underlined></dark_red><black>......<newline>而且，文獻上有記載，當初投票表決的時候，<newline></black><dark_red><underlined>塵囂天君</underlined></dark_red><black>是唯一反對鎮壓的神。<newline></black>"
    - "有傳言說，曾經有人在<dark_green><italic>大陸西<newline></italic></dark_green><dark_green><italic>南方的一處隱居地</italic></dark_green><black>，看見過和他長得很像的神。<newline>似乎改名叫做</black><dark_red><underlined>「忘塵」</underlined></dark_red><black>的樣子。<newline>你可以到西南方找找看，是否有這麼一個</black><dark_green><italic>與世隔絕的地方</italic></dark_green><black>。<newline>或許可以找到這位失蹤的</black><dark_red><underlined>塵<newline></underlined></dark_red><dark_red><underlined>囂天君</underlined></dark_red><black>。</black>"
ZhuiGenJiuDi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>追根究底</blue>"
  Display: "<blue>追根究底</blue>"
  Author: "<blue>千絲谷谷主忘塵</blue>"
  Pages:
    - "你好，請問你是......？<newline><dark_red><underlined>塵囂</underlined></dark_red><black>？呵呵，沒想到過了這麼多年，還會有人提起這個名字。<newline>沒錯，我就是過去</black><black><underlined>神族</underlined></black><black>的</black><dark_red><underlined>塵囂<newline></underlined></dark_red><dark_red><underlined>天君</underlined></dark_red><black>。<newline>不過現在我只是</black><dark_red><underlined>忘塵</underlined></dark_red><black>，一位隱居避世的凡夫俗子罷了。<newline>嗯......那你真的是</black><black><underlined>戰神族</underlined></black><black>的人？<newline>好吧......如果你堅持想要知道所謂「真相」的話。<newline>這是</black><blue>我家的鑰匙</blue><black>，先進去吧，我隨後就來。</black>"
WenQuanKeZhanDeDaGongJiHua:
  Id: "WRITTEN_BOOK"
  Title: "<blue>溫泉客棧的打工計畫</blue>"
  Display: "<blue>溫泉客棧的打工計畫</blue>"
  Author: "<blue>溫泉客棧的老闆</blue>"
  Pages:
    - "哎呀現在<dark_green><italic>沙漠邊境</italic></dark_green><black>越來越難看到你們這些年輕人了。<newline>這裡是有名的</black><dark_green><italic>溫泉客棧情報<newline></italic></dark_green><dark_green><italic>屋</italic></dark_green><black>。<newline>怎麼樣？最近缺人手，想不想來做點工作？工資不錯的喔～<newline>或是我們</black><dark_green><italic>客棧</italic></dark_green><black>也專門販賣各種情報，有沒有興趣阿？<newline></black>"
    - "不管是要工資報酬還是想要情報，都請去沙漠的怪物身上拿些<blue>補給品</blue><black>來吧。<newline>最近客棧都沒什麼行商經過，<newline></black><blue>補給品</blue><black>快要不夠用了呢。<newline>麻煩20個為一組拿來這裡就可以囉。</black>"
    - "------任務情報------<newline>任務發布者：<newline><black><underlined>戰神族</underlined></black><black> - </black><dark_red><underlined>溫泉客棧的老闆</underlined></dark_red><black><newline>回報地點：<newline></black><dark_green><italic>溫泉客棧</italic></dark_green><black><newline>任務需求：20個</black><blue>溫泉客棧需要<newline></blue><blue>的補給品</blue><black><newline>任務獎勵：以下任選一<newline>1.工資若干<newline>2.</black><blue>戰神族友好的證明</blue><black>X2<newline>3.情報屋小道情報<newline>------------------</black>"
RenZuJinDiNuWaNuShenDeShiLian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>人族禁地女媧女神的試煉</blue>"
  Display: "<blue>人族禁地女媧女神的試煉</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "大家都知道，<black><underlined>人族</underlined></black><black>的守護神是<newline></black><dark_red><underlined>女媧</underlined></dark_red><black>。<newline>而</black><dark_red><underlined>女媧</underlined></dark_red><black>為</black><black><underlined>人族</underlined></black><black>的後代們設立了一個試煉。<newline>通過的人無論是哪一個種族，都可以獲得</black><dark_red><underlined>女媧</underlined></dark_red><black>的獎賞。<newline>不過前提當然是能夠進入</black><black><underlined>人<newline></underlined></black><black><underlined>族</underlined></black><black>村莊並且進入</black><dark_green><italic>試煉之地</italic></dark_green><black>當中才行。<newline>試煉雖然獎勵豐厚，但是種族守護神的能力將無法庇護進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的人。<newline></black>"
    - "也就是說，各個種族的人將會喪失他們的種族能力，也無法在死亡後使用<blue>重生石</blue><black>避開死亡懲罰。<newline>而且在試煉中死亡的人，將會在</black><dark_green><italic>試煉之地</italic></dark_green><black>直接重生，不會回到自己種族的</black><dark_green><italic>重生之地</italic></dark_green><black>。<newline>要離開</black><dark_green><italic>試煉之地</italic></dark_green><black>，只有通過試煉或是因為等級不足被踢出<newline></black><dark_green><italic>試煉之地</italic></dark_green><black>兩種選擇。<newline>雖然獎勵非常豐厚，但是難度相對的也相當高。<newline>請要進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的勇者們三思。</black>"
    - "女媧試煉的關卡總共有五關，分別對應金木水火土五種元素。<newline>金之關考驗人的耐性，意志要如同銳金一般堅硬不動搖，才能通過考驗。<newline>木之關考驗膽量，以及對於墜落速度的敏銳度。<newline>水之關考驗記憶能力，還有對抗窒息恐懼的精神力。<newline>火之關考驗在狹窄空間的戰鬥續航能力。<newline>土之關考驗手眼協調的能力，以及對距離的掌控。"
ShenZuLingDiPanGuShenDeShiLian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>神族領地盤古神的試煉</blue>"
  Display: "<blue>神族領地盤古神的試煉</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "大家都知道，<black><underlined>神族</underlined></black><black>的守護神是<newline></black><dark_red><underlined>盤古</underlined></dark_red><black>。<newline></black><dark_red><underlined>盤古</underlined></dark_red><black>為了訓練後代，在</black><black><underlined>神族</underlined></black><black>的領地設立了一個試煉。<newline>通過的人無論是哪一個種族，都可以獲得</black><dark_red><underlined>盤古</underlined></dark_red><black>的獎賞。<newline>不過前提當然是能夠進入</black><black><underlined>神<newline></underlined></black><black><underlined>族</underlined></black><black>村莊並且進入</black><dark_green><italic>試煉之地</italic></dark_green><black>當中才行。<newline>試煉雖然獎勵豐厚，但是種族守護神的能力將無法庇護進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的人。<newline></black>"
    - "也就是說，各個種族的人將會喪失他們的種族能力，也無法在死亡後使用<blue>重生石</blue><black>避開死亡懲罰。<newline>而且在試煉中死亡的人，將會在</black><dark_green><italic>試煉之地</italic></dark_green><black>直接重生，不會回到自己種族的</black><dark_green><italic>重生之地</italic></dark_green><black>。<newline>要離開</black><dark_green><italic>試煉之地</italic></dark_green><black>，只有通過試煉或是因為等級不足被踢出<newline></black><dark_green><italic>試煉之地</italic></dark_green><black>兩種選擇。<newline>雖然獎勵非常豐厚，但是難度相對的也相當高。<newline>請要進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的勇者們三思。</black>"
    - "盤古試煉的關卡總共有五關，分別為日月，山川，星辰，森與海。<newline>日月之關考驗你對盤古大陸的瞭解程度。<newline>山川之關考驗你的毅力，是否可以克服險峻的地形。<newline>星辰之關考驗你能否閃過每一個迎面而來的撞擊。<newline>森之關考驗你的記憶力以及方向感。<newline>海之關考驗你的手眼協調能力，能否跨越平靜但危險的大海。"
ZhanShenYiZuYinJuDiNeiChiYouDeShiLian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>戰神一族隱居地內蚩尤的試煉</blue>"
  Display: "<blue>戰神一族隱居地內蚩尤的試煉</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "大家都知道，<black><underlined>戰神族</underlined></black><black>的守護神是</black><dark_red><underlined>蚩尤</underlined></dark_red><black>。<newline></black><black><underlined>戰神</underlined></black><black></black><dark_red><underlined>蚩尤</underlined></dark_red><black>為了訓練後輩，在</black><black><underlined>戰<newline></underlined></black><black><underlined>神族</underlined></black><black>的領地設立了一個試煉。<newline>通過的人無論是哪一個種族，都可以獲得</black><dark_red><underlined>蚩尤</underlined></dark_red><black>的獎賞。<newline>不過前提當然是能夠進入</black><black><underlined>戰<newline></underlined></black><black><underlined>神族</underlined></black><black>村莊並且進入</black><dark_green><italic>試煉之地</italic></dark_green><black>當中才行。<newline>試煉雖然獎勵豐厚，但是種族守護神的能力將無法庇護進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的人。<newline></black>"
    - "也就是說，各個種族的人將會喪失他們的種族能力，也無法在死亡後使用<blue>重生石</blue><black>避開死亡懲罰。<newline>而且在試煉中死亡的人，將會在</black><dark_green><italic>試煉之地</italic></dark_green><black>直接重生，不會回到自己種族的</black><dark_green><italic>重生之地</italic></dark_green><black>。<newline>要離開</black><dark_green><italic>試煉之地</italic></dark_green><black>，只有通過試煉或是因為等級不足被踢出<newline></black><dark_green><italic>試煉之地</italic></dark_green><black>兩種選擇。<newline>雖然獎勵非常豐厚，但是難度相對的也相當高。<newline>請要進入</black><dark_green><italic>試煉之地</italic></dark_green><black>的勇者們三思。</black>"
    - "蚩尤試煉的關卡總共有五關，分別考驗人的毅力、心智、體能、技巧以及速度。<newline>力之關考驗你的毅力與耐心，能否專注的走向終點。<newline>心之關考驗你的記憶力與精神的堅韌度。<newline>體之關考驗你的戰鬥續航力，以及與敵人周旋的能力。<newline>技之關考驗你的技巧與手眼協調能力。<newline>速之關考驗你的速度究竟能否超越極限。"
ChuanShuoZhongDaLuBianYuanDeShiWaiTaoYuan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>傳說中大陸邊緣的世外桃源？</blue>"
  Display: "<blue>傳說中大陸邊緣的世外桃源？</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "據說有一個地方被稱為<dark_green><italic>世外<newline></italic></dark_green><dark_green><italic>桃源</italic></dark_green><black>，那個地方遠離世俗的紛紛擾擾，<newline>各種族相處融洽，沒有任何的爭端。<newline>那裡也有各種奇花異草和珍貴稀有的貨物。<newline>其實阿，</black><dark_green><italic>溫泉客棧情報屋</italic></dark_green><black>的</black><dark_red><underlined>老<newline></underlined></dark_red><dark_red><underlined>闆</underlined></dark_red><black>就是</black><dark_green><italic>世外桃源</italic></dark_green><black>的人喔。<newline>正確的來說，這個地方叫做</black><dark_green><italic>「<newline></italic></dark_green><dark_green><italic>千絲谷」</italic></dark_green><black>。<newline>而且離這座</black><dark_green><italic>客棧</italic></dark_green><black>很近呢。<newline></black>"
    - "只要從<dark_green><italic>客棧</italic></dark_green><black>後方的溫泉往樹林深處走去，穿過一道由神木組成的高牆，就可以進入</black><dark_green><italic>千絲<newline></italic></dark_green><dark_green><italic>谷</italic></dark_green><black>了喔。<newline>至於</black><dark_green><italic>千絲谷</italic></dark_green><black>名稱的由來，我也不太清楚，或許谷內有人知道吧。<newline>有空的話就去看看吧，我們谷裡真的很漂亮呢！</black>"
DaTingChenXiaoTianJunDeXiaLuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>打聽塵囂天君的下落</blue>"
  Display: "<blue>打聽塵囂天君的下落</blue>"
  Author: "<blue>包打聽</blue>"
  Pages:
    - "喔？想找我問事情？行啊，先來點元寶意思意思......<newline>痛快，那我就洗耳恭聽吧，你想打聽什麼事情啊？<newline>......\\u00264\\u0026n塵囂\\u00260？噓......小聲點，你沒事打聽那傢伙的事情做什麼啊？你不知道他的名字在族裡很敏感嗎？<newline>受人所托啊......好吧，看在元寶的份上，我就透漏一些消息好了。"
    - "\\u00264\\u0026n塵囂天君\\u00260在「那件事情」以後就沒再回來\\u00262\\u0026o崑崙\\u00260過了。不過，有人似乎在\\u00262\\u0026o大陸的西南方<newline>\\u00262\\u0026o一帶\\u00260看過他。<newline>據說在\\u00262\\u0026o下界的沙漠\\u00260有一處\\u00262\\u0026o客<newline>\\u00262\\u0026o棧\\u00260，蒐集大陸上的各種情報，你可以去問問看，也許會找到一些線索。<newline>......是啊我是\\u00264\\u0026n包打聽\\u00260沒錯，不過我只是\\u00262\\u0026o崑崙\\u00260的\\u00264\\u0026n包打聽\\u00260，超出\\u00262\\u0026o崑<newline>\\u00262\\u0026o崙\\u00260範圍我也沒辦法了。<newline>總之，去那間\\u00262\\u0026o客棧\\u00260打聽打聽吧，祝你順利。"
YinXingMaiMingDeChenXiao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>隱姓埋名的塵囂</blue>"
  Display: "<blue>隱姓埋名的塵囂</blue>"
  Author: "<blue>默默喝酒的男子</blue>"
  Pages:
    - "請問你找我有什麼事情嗎？<newline>......\\u00264\\u0026n塵囂天君\\u00260？你是\\u00260\\u0026n神族\\u00260派來找他下落的嗎......哼，討打就早說......<newline>欸？\\u00264\\u0026n芊無\\u00260姊的\\u00269玉珮\\u00260......怎麼可能！你在哪裡找到的？<newline>北方的\\u00262\\u0026o蓬萊島\\u00260！？<newline>你快拿著這個\\u00269玉珮\\u00260到\\u00262\\u0026o千思谷\\u00260去找谷主\\u00264\\u0026n忘塵\\u00260，也就是你在找的\\u00264\\u0026n塵囂天君\\u00260，告訴他這個好消息。<newline>\\u00262\\u0026o千絲谷\\u00260從\\u00262\\u0026o客棧\\u00260後面的溫泉往後走，沿著石板就可以到達了，快去吧。"
TeShuYaoYinYuTeShuDanYaoDeChuanYan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>特殊藥引與特殊丹藥的傳言</blue>"
  Display: "<blue>特殊藥引與特殊丹藥的傳言</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "傳說中的<blue>特殊藥引</blue><black>和</black><blue>特殊丹<newline></blue><blue>藥</blue><black>真的存在嗎？<newline>相信這是許多鍊丹師共同的疑問。<newline>而事實上，我們接到的情報顯示，</black><blue>特殊的藥引</blue><black>和</black><blue>丹藥</blue><black>是真的存在的。<newline>掌握這項秘密的人，就是</black><black><underlined>神族</underlined></black><black>一位非常厲害的鍊丹師-</black><dark_red><underlined>太上<newline></underlined></dark_red><dark_red><underlined>老君</underlined></dark_red><black>。<newline>雖然這位</black><dark_red><underlined>丹神</underlined></dark_red><black>已經不住在神界，而隱居在人間，但是各界依舊非常的敬重他。<newline></black>"
    - "原因無他，就因為只有他能夠煉製出傳說中的幾味丹藥。<newline>而情報指出，這位<dark_red><underlined>丹神</underlined></dark_red><black>就住在北方一座名為</black><dark_green><italic>「蓬萊」</italic></dark_green><black>的小島中。<newline>只要帶著他最喜歡的</black><blue>「鮭魚<newline></blue><blue>」</blue><black>前往拜訪，就可以進入他的草廬中。<newline>在</black><dark_red><underlined>太上老君</underlined></dark_red><black>的住處，就可以使用</black><blue>特殊藥引</blue><black>煉製出傳說中的丹藥來囉。</black>"
TouTaiZhongShengZhiFaZhenDeCunZaiMa:
  Id: "WRITTEN_BOOK"
  Title: "<blue>投胎重生之法真的存在嗎？</blue>"
  Display: "<blue>投胎重生之法真的存在嗎？</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "覺得人生已經無趣了嗎？<newline>厭惡自己所在的<black><underlined>種族</underlined></black><black>了嗎？<newline>沒關係！<newline>據說有種方法，可以讓靈魂投胎轉世！<newline>只要在</black><black><underlined>自己種族</underlined></black><black>的</black><dark_green><italic>重生點</italic></dark_green><black>附近找到一個</black><dark_green><italic>「祭壇」</italic></dark_green><black><newline>然後將</black><blue>「重生石」</blue><black>投入祭壇當中，就可以重新投胎。<newline>不過要注意，重生之後，身上的物品會消失，等級也會歸零，聖獸的祝福也將不復存在。<newline>只有關於歷史的記憶會留下......<newline></black>"
    - "因此要選擇重生之前請考慮好再做決定，是否要拋開一切開始新的人生吧。"
DongFangSenLinZhongDeHuangZuLingMu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>東方森林中的皇族陵墓</blue>"
  Display: "<blue>東方森林中的皇族陵墓</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "據說在<dark_green><italic>皇城東方森林</italic></dark_green><black>的某一個地洞中，有著</black><dark_red><underlined>初代人皇</underlined></dark_red><black>為自己修建的</black><dark_green><italic>陵墓</italic></dark_green><black>。<newline>這位</black><dark_red><underlined>人皇</underlined></dark_red><black>把搜刮來的寶藏都藏在</black><dark_green><italic>陵墓</italic></dark_green><black>當中，<newline>因此，有許多人想要前往挖寶，但是都因為陵墓中的機關和怪物而退縮。<newline>去吧冒險者，去將陵墓中的寶藏都找出來！</black>"
NanFangShaMoZhongDeWeiXianDongKu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>南方沙漠中的危險洞窟</blue>"
  Display: "<blue>南方沙漠中的危險洞窟</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "<dark_green><italic>南方沙漠</italic></dark_green><black>除了馬賊以外，還有各式各樣的怪物遊蕩著。<newline>據說某些怪物就來自於</black><dark_green><italic>沙漠中的某一個地洞</italic></dark_green><black>中。<newline>這個地洞終日流淌著炙熱的岩漿，而這些怪物就從岩漿中誕生出來。<newline>而且這些怪物似乎有一個王，他們都遵從著王的命令而行動。<newline></black>"
    - "想必這些怪物搶奪的財寶都貢獻給了他們的王吧？<newline>去吧冒險者們！地洞中的寶藏在等著你們呢！<newline>P.S.貼心提醒，冒險團中請至少要有一位能夠協助大家抵抗炙熱火焰的鍊丹師。"
XiBeiFangBingXueGuNeiDeShanShenMiao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>西北方冰雪谷內的山神廟</blue>"
  Display: "<blue>西北方冰雪谷內的山神廟</blue>"
  Author: "<blue>情報屋小道情報</blue>"
  Pages:
    - "就在<dark_green><italic>皇城</italic></dark_green><black>西北方向，有一座終日</black><dark_green><italic>被冰雪覆蓋的峽谷</italic></dark_green><black>，幾乎不會有人到裡面去。<newline>據一位從山谷中生還回來的<newline></black><black><underlined>仙族</underlined></black><black>商人所述，山谷的盡頭有一座</black><dark_green><italic>山神廟</italic></dark_green><black>。廟裡的山神會給予通過試煉的人們獎賞。<newline>不過山谷中到處都充斥著各種飛在空中的怪物，那些怪物口吐火球，還會發出淒厲的哭聲，非常可怕。<newline>總之，若是有想要獲取寶藏的勇者，不妨去挑戰</black><dark_green><italic>冰雪谷</italic></dark_green><black>中的怪物們吧。</black>"
HuaYaoDeXieZhu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>華夭的協助</blue>"
  Display: "<blue>華夭的協助</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "你沒受傷吧？……看起來挺好的，不錯不錯。我兩個時辰前就接到<dark_red><underlined>谷主</underlined></dark_red><black>的消息說有隻小妖會來找我，你這麼晚才到我以為你出了什麼事情。<newline>剛出谷感覺一定很新鮮，但是要小心，<underlined>人類</underlined></black><black>狡猾奸詐，<underlined>仙族</underlined></black><black>陰險詭譎，千萬不能被他們抓到，否則就會被關進這座</black><dark_green><italic>鎮妖塔</italic></dark_green><black>內喔！<newline>所以，你們來是要尋找</black><dark_red><underlined>大長老</underlined></dark_red><black>吧？其實，我也不知道</black><dark_red><underlined>大長老</underlined></dark_red><black>究竟有沒有被抓到塔內，我現在只是個守門的小卒而已，</black>"
    - "連查詢登記在案的<underlined>妖族<black>名單都做不到，而且因為只有一個人，也沒辦法趁當職的時候偷偷進去看。所以雖然在塔裡送出來的東西上發現了求救的暗號，我也沒辦法確定</black><underlined><dark_red></dark_red></underlined>大長<newline><dark_red></dark_red></underlined>老<black>是否真的在塔內。<newline>事實上，塔的正後方有一個直通</black><dark_green><italic>塔頂</italic></dark_green><black>的入口，</black><dark_green><italic>鎮妖塔</italic></dark_green><black>會把越強的同伴關在越高的地方，如果</black><dark_red><underlined>長老</underlined></dark_red><black>也被抓進來了，他肯定是被關在</black><dark_green><italic>塔頂</italic></dark_green><black>的。</black>"
    - "等等我值班的時候，你們就從後面溜進去，看看<dark_red><underlined>大長老</underlined></dark_red><black>到底有沒有被關在上面。確定之後再回來跟我說。</black>"
BeiQiuJinDeDaChangLao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>被囚禁的大長老</blue>"
  Display: "<blue>被囚禁的大長老</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "小朋友你好阿。<newline>什麼？救我出去阿？別想了別想了，這裡的結界和守衛不是你解決的了的。別擔心，我只是被關在這裡出不去，一時半刻沒有生命危險。何況我在塔裡也可以盡量護住一些比較弱小的族人。<newline>唉......在我記憶當中，<underlined>我族<black>和</black></underlined>人<newline><underlined>仙二族<black>雖稱不上是和睦，但也不應該勢同水火。</black></underlined>"
    - "想當年我帶領<dark_green><italic>戰神聯盟</italic></dark_green><black>的成員逃到了</black><dark_green><italic>南方極惡之地</italic></dark_green><black>，許久沒有你們中土的消息，沒想到一回來卻成了這樣。<newline>我一急之下直接來了</black><dark_green><italic>鎮妖塔</italic></dark_green><black>，卻沒想到這塔古怪的緊，幾乎壓制了我所有的力量......<newline>雖然不能救我出去，不過你倒是可以幫我別的忙。</black>"
    - "這幾天，我發現<underlined>神族<black></black><underlined><dark_red></dark_red></underlined>四獸<black>的結界減弱了許多，雖然不知道原因，但是這股束縛我們的力量似乎快要消失了。<newline>你就到</black><underlined><dark_red></dark_red></underlined>四獸<black>的</black><underlined><dark_green><italic>祭壇</italic></dark_green><underlined><underlined><black>去看看吧，確認一下結界到底是為什麼減弱了。<newline>把這件事情告訴</black><underlined><underlined><underlined><underlined><dark_red></dark_red></underlined>華夭<black>那丫頭，跟他說我沒事。在這裡雖然稱不上舒服，不過要把我弄死還是有難度的。<newline>快回去吧，萬事小心啊。</black></underlined></underlined></underlined></underlined></underlined></underlined></underlined>"
JieJieZhuJianXiaoShi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>結界逐漸消失？</blue>"
  Display: "<blue>結界逐漸消失？</blue>"
  Author: "<blue>[必讀]妖族主線</blue>"
  Pages:
    - "原來如此……所以你得到了青龍祝福之後，確實感覺到龍之力的消退嗎……<newline>如果鎮守四方的結界陣眼都消失的話，長久以來束縛<black><underlined>妖族</underlined></black><black>的力量就會解除了，見到</black><black><underlined>人仙二族</underlined></black><black>便要東躲西藏的日子就有可能會中止了！<newline>不過還不能高興得太早，因為我們的資訊還不夠充足。<newline>你就到其他各個</black><dark_green><italic>祭壇</italic></dark_green><black>和</black><dark_green><italic>神廟</italic></dark_green><black>去看看狀況吧，把祝福都蒐集齊全了，看看結界到底是否真的不如以往強大。<newline></black>"
    - "其他的三個<dark_red><underlined>神獸</underlined></dark_red><black>分別是南邊的</black><dark_red><underlined>朱雀</underlined></dark_red><black>，西邊的</black><dark_red><underlined>白虎</underlined></dark_red><black>和北邊的<newline></black><dark_red><underlined>玄武</underlined></dark_red><black>。到那邊問問看</black><dark_green><italic>祭壇</italic></dark_green><black>的位置也許會有收穫。等你蒐集到了全部的祝福之後，就去找</black><dark_red><underlined>大長老</underlined></dark_red><black>吧，他會做最後的決定。<newline>喔對了，如果試煉太難以至於必須要從花中重生的話，你可以偷偷去用</black><dark_green><italic>皇宮</italic></dark_green><black>裡</black><dark_red><underlined>護國法師</underlined></dark_red><black>的法寶-</black><dark_green><italic>重華鏡</italic></dark_green><black>，那面鏡子可以送你到曾經去過的聖地，</black><dark_green><italic>祭壇</italic></dark_green><black>就是其中一種。</black><dark_red><underlined>護國法師</underlined></dark_red><black>就住在</black><dark_green><italic>皇宮的東側</italic></dark_green><black>。<newline></black>"
    - "祝你好運，早日集齊祝福，洞悉結界的情況。<newline>我想，<dark_red><underlined>大長老</underlined></dark_red><black>也沒辦法堅持太久，速戰速決吧。<newline><newline>注：將</black><dark_red><underlined>四獸</underlined></dark_red><black>的祝福都取得之後，就去找</black><dark_red><underlined>大長老</underlined></dark_red><black>吧。</black>"
ZhenXingYaoZu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>振興妖族</blue>"
  Display: "<blue>振興妖族</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "蒐集了<dark_red><underlined>四獸</underlined></dark_red><black>的祝福嗎？看來你應該可以直接感受到結界的減弱了吧？<newline>的確，結界就快要消失了，但是我們並不能輕舉妄動，</black><dark_red><underlined>四獸</underlined></dark_red><black>並沒有消失，只是離開了</black><dark_green><italic>神廟</italic></dark_green><black>而已，如果他們又重新開啟結界，<newline><underlined>我族</underlined></black><black>依然會繼續被迫害和剝奪生存的空間……<newline>最好的辦法，還是去確定一下<newline></black><dark_red><underlined>四獸</underlined></dark_red><black>的現況。<newline>〔</black><dark_red><underlined>長老</underlined></dark_red><black>將手往你身上一指，你感覺到一股溫柔的力量湧入，然後這股力量發散出去，匯集在空中，</black>"
    - "指向北方〕<newline>恩…...。原來<dark_red><underlined>四獸</underlined></dark_red><black>現在在北方嗎……如果我沒記錯的話，那裏有座叫做</black><dark_green><italic>蓬萊</italic></dark_green><black>的島。<newline>當初我帶領戰神聯盟與<underlined>神族</underlined></black><black>和</black><dark_red><underlined>四獸</underlined></dark_red><black>交戰的時候，有一部分的族人撤退到了北方，估計應該就是在</black><dark_green><italic>蓬萊</italic></dark_green><black>吧，如果你去<newline></black><dark_green><italic>蓬萊</italic></dark_green><black>的話，找找看有沒有族人的蹤跡，或許他們能給你一些幫助。<newline><newline>注：前往</black><dark_green><italic>蓬萊島</italic></dark_green><black>搜尋族人蹤跡</black>"
DaChangLaoDeQiuJiuXunXi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>大長老的求救訊息</blue>"
  Display: "<blue>大長老的求救訊息</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "有件事情想托你幫我調查一下。<newline>在大約三天之前，我們族內潛入<dark_green><italic>鎮妖塔</italic></dark_green><black>當間諜的族人傳回了一則消息，說是收到了</black><dark_red><underlined>大長<newline></underlined></dark_red><dark_red><underlined>老蚩尤</underlined></dark_red><black>的求救訊號。<newline></black><dark_red><underlined>蚩尤長老</underlined></dark_red><black>是我族老一輩中能力最傑出的人。我最後一次見到他的時候，是在</black><dark_green><italic>戰神聯盟</italic></dark_green><black>被殲滅之前......那時我才剛出生沒有多久，就像你們一樣。<newline></black>"
    - "不過那都已經過去很久很久了，我們一直以為<dark_red><underlined>大長老</underlined></dark_red><black>已經在那場戰役中隕落，沒想到他還活著。<newline>雖然只有</black><dark_red><underlined>蚩尤長老</underlined></dark_red><black>才知道這個求援的暗語，不過我還是想請你們跑一趟</black><dark_green><italic>鎮妖塔</italic></dark_green><black>，幫我確認一下</black><dark_red><underlined>大長老</underlined></dark_red><black>現在的狀況。<newline>你願意幫這個忙嗎？ 謝謝你啊！<newline>放心吧，剛出生的小妖妖氣還很薄弱，只要注意一點，混進<underlined>人<newline></underlined>族</black><black>的</black><dark_green><italic>皇城</italic></dark_green><black>也不是什麼難事。</black>"
    - "<dark_green><italic>鎮妖塔</italic></dark_green><black>就在</black><dark_green><italic>皇城</italic></dark_green><black>的西方，裡面有我們臥底的探子，化名叫做<newline></black><dark_red><underlined>華夭</underlined></dark_red><black>，是一位混血的花妖，想辦法跟她接頭，她就是收到求救訊息的人，到了那裡再詳細的瞭解一下情況吧。另外，這是<newline><underlined>人族</underlined></black><black>的</black><blue>皇城和盤古大陸的地<newline></blue><blue>圖</blue><black>，拿著這個才不會迷路。路上千萬小心，若是暴露身分被<underlined>人仙</underlined></black><black>追捕，保命重要。<newline><newline>注：請用</black><blue>妖族證明</blue><black>向</black><dark_red><underlined>葉靈谷<newline></underlined></dark_red><dark_red><underlined>谷主</underlined></dark_red><black>換取</black><blue>地圖</blue><black></black>"
SenLinZhongDeJiTan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>森林中的祭壇</blue>"
  Display: "<blue>森林中的祭壇</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "<dark_red><underlined>大長老</underlined></dark_red><black>真的被關在</black><dark_green><italic>塔頂</italic></dark_green><black>！？可惡，那群該死的</black><black><underlined>人類</underlined></black><black>……<newline>雖然說一時半刻的確沒什麼危險，但是只要待在塔中一天，陣法的效力就會減弱</black><dark_red><underlined>長老</underlined></dark_red><black>的妖力，什麼時候</black><dark_red><underlined>長老</underlined></dark_red><black>會不支倒地也很難說……<newline>看來只有趕快確定結界狀況，然後搬救兵來營救</black><dark_red><underlined>大長老</underlined></dark_red><black>了。<newline></black>"
    - "你就前往<black><underlined>人族</underlined></black><black></black><dark_green><italic>皇城東邊的龍<newline></italic></dark_green><dark_green><italic>鱗森林</italic></dark_green><black>吧，</black><dark_green><italic>青龍的祭壇</italic></dark_green><black>就在</black><dark_green><italic>森<newline></italic></dark_green><dark_green><italic>林深處</italic></dark_green><black>。<newline>一般來說大型的陣法都會有個管理的人，你找找看，看能不能套出一些情報來。</black>"
ShiTanJieJie:
  Id: "WRITTEN_BOOK"
  Title: "<blue>試探結界</blue>"
  Display: "<blue>試探結界</blue>"
  Author: "<blue>妖族主線</blue>"
  Pages:
    - "你好，這裡是<dark_green><italic>青龍神廟</italic></dark_green><black>，我是</black><dark_red><underlined>青<newline></underlined></dark_red><dark_red><underlined>龍大人的分魂</underlined></dark_red><black>。<newline>結界減弱？真的嗎？是有覺得</black><dark_green><italic>神廟</italic></dark_green><black>的龍氣不如以往濃厚……<newline>這樣吧，你幫我到</black><dark_green><italic>神廟的二樓</italic></dark_green><black>，那裏有一個</black><dark_red><underlined>青龍大人</underlined></dark_red><black>的雕像，可以進行青龍的試煉。<newline>通過了之後就可以感應到</black><dark_red><underlined>青<newline></underlined></dark_red><dark_red><underlined>龍</underlined></dark_red><black>的力量了。<newline>注：通過青龍試煉之後請回到</black><dark_green><italic>鎮妖塔</italic></dark_green><black>找</black><dark_red><underlined>華夭</underlined></dark_red><black>回報任務。</black>"
ZhanYiJieFangZhenYaoTaFangShouFangZhiNan:
  Id: "WRITTEN_BOOK"
  Title: "<gold>戰役-解放鎮妖塔-防守方指南</gold>"
  Display: "<gold>戰役-解放鎮妖塔-防守方指南</gold>"
  Author: "<blue>鎮妖塔管理員-應蓮</blue>"
  Pages:
    - "<bold>戰役介紹：<black><newline><newline>探子來報，說</black><bold><black><underlined>妖怪</underlined></black><bold><bold><black>們正準備大舉進攻</black><bold><bold><bold><bold><dark_green><italic>鎮妖塔</italic></dark_green><bold><bold><bold><bold><bold><bold><bold><bold><black>，協助同伴越獄。<newline><newline>請各路好漢前往</black><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><dark_green><italic>鎮妖塔</italic></dark_green><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><black>協防，<newline></black><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><dark_green><italic>鎮妖塔</italic></dark_green><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><black>管理員-</black><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold