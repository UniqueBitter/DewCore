ZhanYiZhanYaoChuMoJinGongFangZhiNan:
  Id: "WRITTEN_BOOK"
  Title: "<gold>戰役-斬妖除魔-進攻方指南</gold>"
  Display: "<gold>戰役-斬妖除魔-進攻方指南</gold>"
  Author: "<blue>傭兵團長-柳伯</blue>"
  Pages:
    - "<bold>戰役介紹：<black><newline><newline>山裡的<underlined>妖物</underlined></black><bold><black>最近很猖狂啊，我們村裡派去開墾森林的村人都被打的鼻青臉腫回來，請各位好漢幫幫忙，替我們驅逐山裡的妖怪吧。</black></bold></bold>"
    - "<bold>戰役說明：<black><newline><newline>要驅逐<underlined>妖族</underlined></black><bold><black>的妖物非常簡單，只要</black><bold><bold><dark_red>砍斷他們寄生的妖樹</dark_red><bold><bold><bold><bold><black>就行了。不過，因為這些妖樹都會再生，因此我們必須在短時間內砍倒全部的妖樹，使其無法再生，才能逼迫那些怪物離開森林。</black></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "妖樹再生的時間大約是<dark_red>十五<newline></dark_red><dark_red>分鐘</dark_red><black>左右，只要在這段時間以內</black><dark_red>砍倒所有的樹屋</dark_red><black>，<underlined>妖族</underlined></black><black>就會知難而退。砍一棵樹木大約需要</black><dark_red>二十秒</dark_red><black>的時間，期間</black><dark_red>不能<newline></dark_red><dark_red>離開樹旁</dark_red><black>，否則妖樹就會迅速再生，一定要一次砍到斷才行。<newline>此外要小心注意周遭，那些傢伙的弓箭相當厲害，上面還抹了毒藥，被射中的話會瞬間癱瘓的。</black>"
    - "<dark_red><bold>注意事項：<newline><newline></bold></dark_red><dark_red>1.發起戰役時，所有在發起房間<newline></dark_red><dark_red>內的成員都會參加戰役。發<newline></dark_red><dark_red>起後的準備時間，可以再追加<newline></dark_red><dark_red>報名進攻方。<newline></dark_red><dark_red>2.戰役時會統一給予裝備武器<newline></dark_red><dark_red>和道具，請進入戰場之前不要<newline></dark_red><dark_red>攜帶任何東西以免遺失。</dark_red>"
    - "<bold>功勳值與友好度：<black><newline><newline>參加戰役後，對各族的友好度都會有一些改變，也會獲得功勳值。而戰役的成敗均會影響到獲取的功勳值和友好度。<newline>功勳值可以在</black><bold><dark_green><italic>皇城南方的忠<newline></italic></dark_green><bold><bold><dark_green><italic>烈祠</italic></dark_green><bold><bold><bold><bold><black>換取頭部的</black><bold><bold><bold><bold><bold><bold><bold><bold><gold></gold></bold>造型時裝<black>，時裝還可以附有特殊能力，對於戰鬥力的提昇很有幫助。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "而友好度的部份，在斬妖除魔的戰役，參與<underlined>人族<black>進攻的話，將會提昇</black></underlined>人族<black>和少許<underlined>仙族</underlined></black><black>的友好度，但是<underlined>妖族</underlined></black><black>友好度將會下降。<newline>請注意，某一族的友好度下降到一定程度，就會無法進入該族的村落中。<newline><newline>注：</black><dark_green><italic>皇城</italic></dark_green><black>不在此限，任何人均可進入。</black>"
