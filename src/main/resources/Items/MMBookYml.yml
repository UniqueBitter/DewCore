ld><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><black>謝過各位。</black>"
    - "<bold>戰役說明：<black><newline><newline></black><bold><dark_green><italic>鎮妖塔</italic></dark_green><bold><bold><black>是由一個巨大的八卦太極陣所鎮守，為了維持陣法的運轉，需要</black><bold><bold><bold><bold><dark_red>兩位擔任陣眼的<newline></dark_red><bold><bold><bold><bold><bold><bold><bold><bold><dark_red>人</dark_red><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><black>，以自身生氣鎮住太極中的少陰和少陽兩個點。若是在平時，因為有守門陣法，因此不用擔心有人闖塔。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "但是妖物應該會趁每日<dark_green><italic>鎮妖<newline></italic></dark_green><dark_green><italic>塔</italic></dark_green><black>守門陣法最薄弱時來襲，不過請不要擔心，這個時間只會持續</black><dark_red>十五分鐘</dark_red><black>，他們想必也不敢在大門關閉後繼續留在塔內，因此只要請各位壯士協助我們守住十五分鐘即可。請務必</black><dark_red>維持兩個陣眼都各有一<newline></dark_red><dark_red>人</dark_red><black>的狀態，以免八卦太極陣封印力下降，讓妖物們藉機逃出。</black>"
    - "若妖物逃出太多，八卦太極陣的封印便會被破壞，妖物會大量竄出，縱虎歸山，危害人間。即便可以修復，短時間內為了安全，只怕是不能開放<dark_green><italic>鎮妖塔</italic></dark_green><black>給想煉丹的人了。<newline>因此請一定要</black><dark_red>將逃出的妖怪<newline></dark_red><dark_red>維持在兩名以下</dark_red><black>，超過三名陣法就會被破壞，切記切記。</black>"
    - "<dark_red><bold>注意事項：<newline><newline></bold></dark_red><dark_red>1.進攻方發起戰役後，在戰役正<newline></dark_red><dark_red>式開始之前的這段準備時間，<newline></dark_red><dark_red>才可以在此處報名參加防守<newline></dark_red><dark_red>方。<newline></dark_red><dark_red>2.戰役時會統一給予裝備武器<newline></dark_red><dark_red>和道具，請進入戰場之前不要<newline></dark_red><dark_red>攜帶任何東西以免遺失。</dark_red>"
    - "<bold>功勳值與友好度：<black><newline><newline>參加戰役後，對各族的友好度都會有一些改變，也會獲得功勳值。而戰役的成敗均會影響到獲取的功勳值和友好度。<newline>功勳值可以在</black><bold><dark_green><italic>皇城南方的忠<newline></italic></dark_green><bold><bold><dark_green><italic>烈祠</italic></dark_green><bold><bold><bold><bold><black>換取頭部的</black><bold><bold><bold><bold><bold><bold><bold><bold><gold></gold></bold>造型時裝<black>，時裝還可以附有特殊能力，對於戰鬥力的提昇很有幫助。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "而友好度的部份，在解放鎮妖塔的戰役，參與<black><underlined>仙族</underlined></black><black>防守的話，將會提昇</black><black><underlined>仙族</underlined></black><black>和<underlined>人族</underlined></black><black>友好度，但是<underlined>妖族</underlined></black><black>友好度將會下降。<newline>請注意，某一族的友好度下降到一定程度，就會無法進入該族的村落中。<newline><newline>注：</black><dark_green><italic>皇城</italic></dark_green><black>不在此限，任何人均可進入。</black>"
LianDanLuDeLingYiZhongGongNeng:
  Id: "WRITTEN_BOOK"
  Title: "<blue>煉丹爐的另一種功能</blue>"
  Display: "<blue>煉丹爐的另一種功能</blue>"
  Author: "<blue>陳大夫</blue>"
  Pages:
    - "這位小友，既然有緣，我便告知你一些我近年來的心得吧。<newline>你是否覺得<blue>煉丹爐</blue><black>沒什麼作用呢？<newline>其實，</black><blue>煉丹爐</blue><black>除了煉製丹藥以外，還有其他的用途。<newline><newline>丹藥的藥性始於元素的力量，只要能將元素直接使用於人體，便可以發揮出類似服用丹藥的效果。<newline>我近幾年來的嘗試，發明了一種利用</black><blue>煉丹爐</blue><black>，將元素直接打入人體的方法。</black>"
    - "不過，需要使用稍微精練過的元素，一般元素的效果太不明顯了。<newline>使用方法很簡單，首先，將煉丹爐放在物品欄的最後一格。<newline>再來，手持你想要施放的<blue>精練<newline></blue><blue>元素</blue><black>，每種元素的效果不太一樣，我來說明一下：</black>"
    - "[<gold><bold>金</bold></gold><black>-蝕骨穿心箭]<newline><newline>使用一個</black><blue>精練金元素</blue><black>施放。<newline><newline></black><blue>精練金元素</blue><black>會對離你最近的敵人造成腐蝕傷害。<newline>但是對於由死氣所聚集而成的怪物反而會有反效果。<newline>例如：殭屍，兵馬俑，骷髏等等。因此要小心使用。</black>"
    - "[<dark_green><bold>木</bold></dark_green><black>-補氣還元帖]<newline><newline>使用一個</black><blue>精練木元素</blue><black>施放。<newline><newline></black><blue>精練木元素</blue><black>會治癒離你最近的同伴，使他們回復生命值。</black>"
    - "[<dark_blue><bold>水</bold></dark_blue><black>-活水驅毒泉]<newline><newline>使用一個</black><blue>精練水元素</blue><black>施放。<newline><newline></black><blue>精練水元素</blue><black>會活絡離你最近的同伴經脈，使他們身上的毒或是瘴氣效果消失。</black>"
    - "[<dark_red><bold>火</bold></dark_red><black>-炎帝清涼燄]<newline><newline>使用一個</black><blue>精練火元素</blue><black>施放。<newline><newline></black><blue>精練火元素</blue><black>會讓離你最近的一個同伴暫時獲得清涼燄效果。<newline>使他們不畏懼火焰和熔岩的高熱。</black>"
    - "[<dark_gray><bold>土</bold></dark_gray><black>-沙塵迷眼界]<newline><newline>使用一個</black><blue>精練土元素</blue><black>施放。<newline><newline></black><blue>精練土元素</blue><black>會製造沙塵，使周圍最多三位敵人暫時受到盲目效果。</black>"
    - "以上這些，就是利用<blue>煉丹爐</blue><black>，將<newline></black><blue>精練元素</blue><black>直接打出的效果了。<newline>不過，要注意的是，這種方法只能利用於三階和四階煉丹爐。雖然使用四階的效果會比三階好，但是由於精練元素的限制，五階的煉丹爐無法將元素打出，會直接溶解掉元素本身。</black>"
    - "應該有更好的使用元素的方式，不過我還沒有研究出來......也許有別的方法可以解決這個問題。<newline>總之，好好的利用精練元素，就可以協助隊友或是阻礙敵人的行動了。<newline>相信我，煉丹師能夠發揮的實力遠遠不只這些的，加油吧。"
ChenDaFuDeFanNao:
  Id: "WRITTEN_BOOK"
  Title: "<blue>陳大夫的煩惱</blue>"
  Display: "<blue>陳大夫的煩惱</blue>"
  Author: "<blue>陳大夫</blue>"
  Pages:
    - "阿......歡迎歡迎，是來看病的嗎？<newline>不是也沒關係，喝杯茶吧。<newline>咦？我是<black><underlined>神族</underlined></black><black>的人？是阿，沒錯。<newline>你該不會以為所有的</black><black><underlined>神</underlined></black><black>都是冷冰冰的吧。<newline>我是</black><dark_red><underlined>神農氏</underlined></dark_red><black>，掌管全天下的藥草。<newline>不過因為我看見人間的疾苦實在放不下心，所以就待在這裡救助病人了。<newline>請稱呼我為</black><dark_red><underlined>陳大夫</underlined></dark_red><black>就可以了。<newline><newline></black>"
    - "你有空的話，可以幫我一個忙嗎？<newline>幫我到周圍去採集一些<blue>藥草</blue><black>。<newline>我雖然身為</black><black><underlined>神族</underlined></black><black>，但是住在凡間的</black><black><underlined>神</underlined></black><black>是不能隨意使用自己的能力的。<newline>況且我也不想太大動作讓天上那些傢伙感應到我的所在。<newline></black><blue>藥草</blue><black>應該可以在周圍的野獸身上找到，麻煩你了。<newline>一次就幫我找個20把</black><blue>藥草</blue><black>吧，我會給你一些報酬的。</black>"
    - "------任務情報------<newline>任務發布者：<newline><black><underlined>神族</underlined></black><black> - </black><dark_red><underlined>陳大夫</underlined></dark_red><black><newline>回報地點：<newline></black><dark_green><italic>陳大夫的藥草寮</italic></dark_green><black><newline>任務需求：20個</black><blue>陳大夫需要的<newline></blue><blue>藥草束</blue><black><newline>任務獎勵：以下任選一<newline>1.</black><blue>高級療癒丹</blue><black>X5<newline>2.</black><blue>靈芝</blue><black>X20<newline>3.</black><blue>人參</blue><black>X1<newline>4.</black><blue>神族友好的證明</blue><black>X1<newline>------------------</black>"
GuanWuNuWaDeWenXian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>關於女媧的文獻</blue>"
  Display: "<blue>關於女媧的文獻</blue>"
  Author: "<blue>仙族盟主</blue>"
  Pages:
    - "關於最長壽的仙人？你問這個做什麼呢？<newline>你說<dark_red><underlined>女媧</underlined></dark_red><black>啊.....這太久遠了，即使是目前最長壽的仙人大概也無法回答你的問題吧。<newline></black><dark_red><underlined>女媧</underlined></dark_red><black>從很久以前就不再出現了。<newline>不過如果你真的那麼有興趣的話，我幫你找找看，我記得有這方面的文獻......<newline>有了，這是</black><dark_red><underlined>第一任仙族盟主</underlined></dark_red><black>留下來的玉簡......裡面記載了一些關於</black><dark_red><underlined>女媧</underlined></dark_red><black>的事情。<newline></black><black><underlined>神族</underlined></black><black></black><dark_red><underlined>女媧</underlined></dark_red><black>，是</black><black><underlined>人族</underlined></black><black>的創造者。<newline></black>"
    - "<dark_red><underlined>女媧</underlined></dark_red><black>利用自己的脊椎骨，沾了泥水甩動，掉落的泥塊化為人族的祖先。<newline>嗯......歷史的部份好像只到</black><dark_red><underlined>女<newline></underlined></dark_red><dark_red><underlined>媧</underlined></dark_red><black>創造人類，之後就沒有關於祂的任何訊息了。<newline>前面也只有提到她與</black><black><underlined>神族</underlined></black><black>的<newline></black><dark_red><underlined>藥草之神-神農氏</underlined></dark_red><black>非常要好，除此之外沒有其他的記載。<newline></black><dark_red><underlined>神農氏</underlined></dark_red><black>似乎隱居在凡間，不過我也不知道他在哪。<newline>若你有幸遇到這位傳說中的<newline></black><dark_red><underlined>藥神</underlined></dark_red><black>，問問他或許會知道的更清楚些。</black>"
XunWenGuanWuNuWaDeXiaoXi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>詢問關於女媧的消息</blue>"
  Display: "<blue>詢問關於女媧的消息</blue>"
  Author: "<blue>陳大夫</blue>"
  Pages:
    - "你......想知道<dark_red><underlined>女媧</underlined></dark_red><black>的去向......？<newline>那是個我不願意去回憶的事情。<newline>如果你堅持的話，那好吧。<newline>這件事情只能私下告訴你。<newline>你拿這把</black><blue>鑰匙</blue><black>，就可以到</black><dark_green><italic>後面<newline></italic></dark_green><dark_green><italic>的密室</italic></dark_green><black>。<newline>你先進去，我隨後就來。<newline>記住，別讓任何人知道。</black>"
ReQingDeLaoBan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>熱情的老闆</blue>"
  Display: "<blue>熱情的老闆</blue>"
  Author: "<blue>小客棧老闆</blue>"
  Pages:
    - "哎呀！歡迎歡迎，是需要休息一晚嗎？<newline>來我們這裡就對啦！皇城裡的客棧阿，都太坑人啦，那都是在坑那些沒經驗的旅行者的。<newline>來住我們這邊又方便又便宜，絕對是老道的冒險者最好的選擇啦！<newline>需要休息的話就請往<dark_green><italic>地下室</italic></dark_green><black>去吧！慢走阿~</black>"
BuYuanHuiYiDeZhenXiang:
  Id: "WRITTEN_BOOK"
  Title: "<blue>不願回憶的真相</blue>"
  Display: "<blue>不願回憶的真相</blue>"
  Author: "<blue>陳大夫</blue>"
  Pages:
    - "唉......你是<black><underlined>人族</underlined></black><black>的人，想知道</black><dark_red><underlined>女<newline></underlined></dark_red><dark_red><underlined>媧</underlined></dark_red><black>的去向也是很正常的。<newline>你一定很奇怪，雖然身為守護神，但是</black><dark_red><underlined>女媧</underlined></dark_red><black>自從造了人之後，卻一次也沒有去看過你們吧？<newline>不是因為不想去，而是因為去不了。<newline>因為</black><dark_red><underlined>女媧</underlined></dark_red><black>......她已經死了。<newline>是的，你沒有聽錯，她已經死了。<newline>神照理說是不會死的，因為我們與天地同壽。<newline></black>"
    - "只有一個例外，那就是被另一個能力更強大的神所殺。<newline>殺死<dark_red><underlined>女媧</underlined></dark_red><black>的......正是</black><black><underlined>神族</underlined></black><black>的</black><dark_red><underlined>長<newline></underlined></dark_red><dark_red><underlined>老</underlined></dark_red><black>。<newline>我不知道他到底為什麼要殺<newline></black><dark_red><underlined>女媧</underlined></dark_red><black>......<newline>明明，就是</black><dark_red><underlined>長老</underlined></dark_red><black>吩咐</black><dark_red><underlined>女媧</underlined></dark_red><black>去造人的......他說用個新的種族可以抵制</black><black><underlined>妖族</underlined></black><black>的擴大。<newline>但是，就在</black><dark_red><underlined>女媧</underlined></dark_red><black>完成任務，回來回報的時候，</black><dark_red><underlined>長老</underlined></dark_red><black>就將她給殺了。<newline></black>"
    - "只有我......只有我看到了......<newline>我不敢告訴任何人，深怕一樣會被<dark_red><underlined>長老</underlined></dark_red><black>殺了滅口。<newline>所以我離開</black><black><underlined>神族</underlined></black><black>的領地，盡可能隱瞞我身為</black><black><underlined>神族</underlined></black><black>的身份，不與任何同族人往來，就是怕</black><dark_red><underlined>長<newline></underlined></dark_red><dark_red><underlined>老</underlined></dark_red><black>找上門來......<newline></black><dark_red><underlined>女媧</underlined></dark_red><black>死前其實大概也知道這件事情，她告訴我：「如果我出了什麼事情，</black><black><underlined>人族</underlined></black><black>的孩子就拜託你了。」<newline>我還不能死，因為我答應了</black><dark_red><underlined>女<newline></underlined></dark_red><dark_red><underlined>媧</underlined></dark_red><black>。<newline></black>"
    - "所以我代替她，不斷庇佑你們。<newline>但對於那些祈禱<dark_red><underlined>女媧</underlined></dark_red><black>降臨的人們，我實在沒辦法現身告訴他們真相：他們所敬愛的神，早就已經不在了......<newline>今天這些話，你就放在心裡，絕對不要說出去。<newline>如果說出去的話，只會引來殺機。<newline><newline></black><dark_gray><bold><italic>真相是危險的......不能自<newline></italic></bold></dark_gray><dark_gray><bold><italic>保，就不要洩漏它。</italic></bold></dark_gray>"
LiJiaChuZouDeXiaoShaoYe:
  Id: "WRITTEN_BOOK"
  Title: "<blue>離家出走的小少爺</blue>"
  Display: "<blue>離家出走的小少爺</blue>"
  Author: "<blue>公孫小少爺</blue>"
  Pages:
    - "你......你是誰！你認錯人了！我不是公孫......不是！我沒有離家出<newline>......阿！不......不是我！<newline>......啊？你不是來抓我的？好吧......不知道為甚麼，我總覺得你有種熟悉感，我猜我可以相信你......<newline>我是<dark_red><underlined>公孫紹椰</underlined></dark_red><black>，公孫世家這一代的三少爺。我的</black><dark_red><underlined>母親</underlined></dark_red><black>在我小時候就過世了，從那時開始，兄弟姊妹們甚至是大娘二娘他們，不斷排擠我，嘲笑我沒有媽媽！就......就連</black><dark_red><underlined>我爸</underlined></dark_red><black>都不管我！<newline></black>"
    - "我受夠了！所以我逃了出來，可是我不知道我該去哪裡......<newline>我小時候聽我媽說，我有個<dark_red><underlined>舅<newline></underlined></dark_red><dark_red><underlined>舅</underlined></dark_red><black>在</black><dark_green><italic>皇宮</italic></dark_green><black>裡工作，可不可以拜託你，幫我找到我</black><dark_red><underlined>舅舅</underlined></dark_red><black>，我不想再待在</black><dark_green><italic>公孫家</italic></dark_green><black>了！我想要去別的地方......我不知道我</black><dark_red><underlined>舅舅</underlined></dark_red><black>的名字，我......只有</black><dark_red><underlined>媽媽</underlined></dark_red><black>留下的</black><blue>髮<newline></blue><blue>釵</blue><black>，應該可以當作信物吧。<newline>拜託你了......我不想再回那個家了......<newline>系統備註：請記得用</black><blue>戰神族<newline></blue><blue>證明</blue><black>與</black><dark_red><underlined>公孫小少爺</underlined></dark_red><black>兌換</black><blue>娘親<newline></blue><blue>的髮釵</blue><black></black>"
FengHuaLouFuWuJieShao:
  Id: "WRITTEN_BOOK"
  Title: "<gold>鳳花樓服務介紹</gold>"
  Display: "<gold>鳳花樓服務介紹</gold>"
  Author: "<blue>鳳娘</blue>"
  Pages:
    - "這位客官您來的正好～小女子跟您介紹一下，樓裡進了幾位新的姑娘和小倌，要不要叫她們陪您喝個酒呢？<newline>啊？不是來找樂子的，那樓裡也進了幾壇陳年紹興，有沒有興趣呢？<newline>哎呀都沒有興趣啊......<newline>那慢走不送啊～<newline><newline>欸......想請我這位人稱八面玲瓏的<dark_red><underlined>鳳花姊姊</underlined></dark_red><black>幫忙打聽一下你的風評？</black>"
    - "這也是可以啦......不過收費可不便宜喔。<newline>一次要一枚金元寶。給我一枚元寶，我就可以幫你打聽一下你在各個<black><underlined>種族</underlined></black><black>間的風評如何喔，很划算吧？<newline>在某個</black><black><underlined>種族</underlined></black><black>中風評太差的話，可是會被列為拒絕往來戶的呢。<newline>所以想知道風評的話，就把元寶投進後面的箱子裡吧，由小女子親自為您服務呦～<newline><newline></black>"
    - "除此之外，如果你有<blue>幫助種族<newline></blue><blue>的證明</blue><black>，也可以交給我，我會幫你和各個領地的管理者接洽，改善你的風評喔。<newline>你問我為什麼這麼厲害？那當然是因為，老娘我是八面玲瓏的</black><dark_red><underlined>鳳花姊姊</underlined></dark_red><black>啊喔呵呵呵呵呵呵呵咳咳......咳......沒事......我喘一下......<newline>咳，嗯哼，總之，有任何關於評價的事情，找我就對囉～</black>"
XinFuZhaiJiBianNinTieXinDeHaoHuoBan:
  Id: "WRITTEN_BOOK"
  Title: "<gold>信蝠宅急便-您貼心的好夥伴</gold>"
  Display: "<gold>信蝠宅急便-您貼心的好夥伴</gold>"
  Author: "<blue>信蝠宅急便掌櫃</blue>"
  Pages:
    - "客官您好，請問需要我為您說明一下本店的服務項目嗎？<newline><newline>好的。<newline><newline>本店名為「信蝠宅急便」，顧名思義，就是讓客戶的包裹能夠送達給指定的人。<newline>我們和蝠妖合作，提供了空運的送貨管道。<newline>不過，由於蝙蝠的視力不太好，因此<dark_red><underlined>收件人</underlined></dark_red><black>必須要用力揮舞我們這裡販賣的</black><blue>專屬旗幟</blue><black>，才能夠準確的收到包裹喔。</black>"
    - "使用方法非常簡單，只要先請<newline><dark_red><underlined>收件人</underlined></dark_red><black>站在原地，然後手上拿著</black><blue>本店的旗幟</blue><black>。<newline><newline>然後請您將想要運送的物品放到店裡的台子上，再投入一枚金元寶到一旁桶子裡就可以了。<newline><newline>我們的蝙蝠朋友會協助將您的物品送到</black><dark_red><underlined>收件人</underlined></dark_red><black>手上的。</black>"
    - "不過呢，由於不能辨別拿著旗幟的人，或許會有其他手持旗幟的朋友被認作是收件人，因此使用時請低調些以免貨物被劫走。<newline><newline>此外，若是找不到<dark_red><underlined>收件人</underlined></dark_red><black>，蝙蝠是不會運送貨物的，也會退回您的付款，請放心使用吧。</black>"
TieJiangPuDuanZaoSheBeiShiYongShuoMing:
  Id: "WRITTEN_BOOK"
  Title: "<gold>鐵匠舖鍛造設備使用說明</gold>"
  Display: "<gold>鐵匠舖鍛造設備使用說明</gold>"
  Author: "<blue>鐵匠舖掌櫃</blue>"
  Pages:
    - "想鍛造各種<blue>武器</blue><black>和</black><blue>裝備</blue><black>嗎？來</black><dark_green><italic>鐵匠舖</italic></dark_green><black>就對了！<newline>除了1、2階的</black><blue>武器</blue><black>和</black><blue>裝備</blue><black>可以在這裡買到以外，3階以上到5階的</black><blue>武器裝備</blue><black>都可以在這裡製作喔。<newline><newline>想必客官常常在野外獲得奇怪的</black><blue>金屬</blue><black>或是</black><blue>裝備核心</blue><black>吧？<newline></black><blue>赤銅錠</blue><black>、</black><blue>玄鐵錠</blue><black>和</black><blue>靈玉簡</blue><black>是用來製作3、4或5階</black><blue>武器</blue><black>的</black><blue>武<newline></blue><blue>器核心</blue><black>，而</black><blue>裝備核心</blue><black>則可以用來製作</black><blue>防具</blue><black>。</black>"
    - "打到了製造<blue>武器</blue><black>用的</black><blue>金屬</blue><black>或是</black><blue>裝備核心</blue><black>，就可以向</black><dark_green><italic>鐵匠舖</italic></dark_green><black>裡的</black><dark_red><underlined>武器鍛造師</underlined></dark_red><black>以及</black><dark_red><underlined>裝備鍛<newline></underlined></dark_red><dark_red><underlined>造師</underlined></dark_red><black>換取想要打造的</black><blue>裝備雛<newline></blue><blue>型</blue><black>。<newline><newline>拿到</black><blue>雛型</blue><black>之後，就可以用相對應的材料打造出裝備來，需要<newline></black><blue>精練元素</blue><black>的話可以請</black><dark_green><italic>鐵匠舖</italic></dark_green><black>中的</black><dark_red><underlined>元素精煉師</underlined></dark_red><black>協助。此外，身體裝備還會需要</black><blue>「部位材<newline></blue><blue>料」</blue><black>來打造，想要打造哪一個部位的</black><blue>裝備</blue><black>就必須使用該部位的材料。<newline><newline></black>"
    - "材料準備齊了之後，就可以進入<dark_green><italic>鍛造室</italic></dark_green><black>開始鍛造</black><blue>武器</blue><black>囉！<newline>進入</black><dark_green><italic>鍛造室</italic></dark_green><black>，開啟鍛造台後，左方的三格分別放上需要的</black><blue>「<newline></blue><blue>元素」</blue><black>、武器或裝備的</black><blue>「雛<newline></blue><blue>型」</blue><black>以及如果打造裝備所需求的</black><blue>「部位材料」</blue><black>。確定材料都放好之後，按下鍛造台前方的按鈕開始鍛造。只要材料擺放的位置和數量都正確，就可以打造出成品囉！另外，如果材料擺放錯誤的話，鍛造不會進行，也不會有材料上的損失，請放心使用鍛造台吧！</black>"
FuLingJiTaiShiYongShuoMing:
  Id: "WRITTEN_BOOK"
  Title: "<gold>附靈祭台使用說明</gold>"
  Display: "<gold>附靈祭台使用說明</gold>"
  Author: "<blue>鐵匠舖掌櫃</blue>"
  Pages:
    - "想為你的<blue>防具裝備</blue><black>提供更為強大的防禦能力嗎？</black><dark_green><italic>附靈祭<newline></italic></dark_green><dark_green><italic>台</italic></dark_green><black>可以達成你的願望。<newline>附靈是汲取使用者的力量，融入</black><blue>裝備</blue><black>當中的秘法。不過，這會消耗使用者的能量等級，為了避免傷害使用者，這個祭台只有等級超過20的人才可以使用，使用後會消耗20等作為附靈所需的能源。<newline>想要在</black><blue>裝備</blue><black>上附靈，請手持</black><blue>裝<newline></blue><blue>備</blue><black>，按下</black><dark_green><italic>附靈祭台</italic></dark_green><black>上的按鈕，就可以附上特別的能力了。</black>"
    - "<dark_green><italic>附靈祭台</italic></dark_green><black>目前可以將能量轉換為兩種能力，一種是讓防禦力增加，另一種則是讓敵人攻擊你時自己會受到反彈傷害，使用祭台後會隨機得到其中一種能力。同一件裝備可以附靈二種能力，但是如果剛好獲得同一種能力，附靈就會無效，消耗的等級能量也無法取回，請謹慎使用。</black>"
ChengJiu:
  Id: "WRITTEN_BOOK"
  Title: "成就"
  Display: "成就"
  Author: "Yuki_Hiragi"
  Pages:
    - "獲得成就<newline>(無聊的破壞地圖者)"
HaiZiBieShaLe:
  Id: "WRITTEN_BOOK"
  Title: "孩子別傻了"
  Display: "孩子別傻了"
  Author: "Le_Ka"
  Pages:
    - "孩子 當你發現這本書的同時<newline><newline>代表 你已經破壞地圖了<newline><newline>請認真地遊玩地圖<newline><newline>別再破壞地圖了喔!!!<newline><newline>破壞地圖只是找到更多<newline><newline>類似這種的惡搞<newline><newline>by MTW全體人員"
ZhanYiNiTianJiHuaFangShouFangZhiNan:
  Id: "WRITTEN_BOOK"
  Title: "<gold>戰役-逆天計畫-防守方指南</gold>"
  Display: "<gold>戰役-逆天計畫-防守方指南</gold>"
  Author: "<blue>奉神官-陳太極</blue>"
  Pages:
    - "<bold>戰役介紹：<black><newline><newline>探子來報，說有一群惡人打算偷襲這個月的供品運送隊伍......怎麼辦，如果供品沒有準時送達，會被<underlined>神族</underlined></black><bold><black>降罪的。<newline>看來光靠西門鏢局是絕對不夠的啊，沒辦法了，只好請武力高強的人來協助運鑣。</black></bold></bold>"
    - "<bold>戰役說明：<black><newline><newline>這位見義勇為的俠士，請一定要協助我們運送供品啊。聽說有人想要打劫運送隊伍，麻煩你跟著鏢局走一趟吧。<newline>運送的流程很簡單，就是</black><bold><dark_red>將供<newline></dark_red><bold><bold><dark_red>品運到位於城外的</dark_red><bold><bold><bold><bold><dark_green><italic>崑崙傳送<newline></italic></dark_green><bold><bold><bold><bold><bold><bold><bold><bold><dark_green><italic>陣</italic></dark_green><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><dark_red>處</dark_red><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><black>。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "皇城內不用擔心都有重兵把守，但唯獨城外到傳送陣的一段是沒有士兵看守的。以往都是讓西門鏢局協助運送，但是如果有人襲擊，光是一個鏢局的人手是絕對不夠的。<newline>傳送陣開啟的時間是<dark_red>十五分<newline></dark_red><dark_red>鐘</dark_red><black>，必須</black><dark_red>在時間內送上兩份供<newline></dark_red><dark_red>品</dark_red><black>，這個月的份量才算是足夠。不過想必路上的鐵軌已經被賊人設下埋伏，運送時請多加留意。</black>"
    - "此外，由於供品還<dark_red>有備份</dark_red><black>的，因此當供品遺失或是打算重新運送時，只要</black><dark_red>回到起點告知</dark_red><black>即可。不過，</black><dark_red>一次只能運送一份</dark_red><black>，否則人手不足，反而會被趁機搶去。<newline>據探子的消息，這些盜賊身手敏捷，而且善於</black><dark_red>隱藏身形</dark_red><black>，請一定不能放過任何風吹草動，保護好供品並且達成任務。<newline>記住，供品被搶事小，沒達成<underlined>神族</underlined></black><black>需求的</black><dark_red>份額</dark_red><black>事大，切記切記。</black>"
    - "<dark_red><bold>注意事項：<newline><newline></bold></dark_red><dark_red>1.進攻方發起戰役後，在戰役正<newline></dark_red><dark_red>式開始之前的這段準備時間，<newline></dark_red><dark_red>才可以在此處報名參加防守<newline></dark_red><dark_red>方。<newline></dark_red><dark_red>2.戰役時會統一給予裝備武器<newline></dark_red><dark_red>和道具，請進入戰場之前不要<newline></dark_red><dark_red>攜帶任何東西以免遺失。</dark_red>"
    - "<bold>功勳值與友好度：<black><newline><newline>參加戰役後，對各族的友好度都會有一些改變，也會獲得功勳值。而戰役的成敗均會影響到獲取的功勳值和友好度。<newline>功勳值可以在</black><bold><dark_green><italic>皇城南方的忠<newline></italic></dark_green><bold><bold><dark_green><italic>烈祠</italic></dark_green><bold><bold><bold><bold><black>換取頭部的</black><bold><bold><bold><bold><bold><bold><bold><bold><gold></gold></bold>造型時裝<black>，時裝還可以附有特殊能力，對於戰鬥力的提昇很有幫助。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "而友好度的部份，在逆天計畫的戰役，參與<underlined>神族<black>防守的話，將會提昇</black></underlined>人族<black>和<underlined>神族</underlined></black><black>友好度，但是<underlined>戰神族</underlined></black><black>友好度將會下降。<newline>請注意，某一族的友好度下降到一定程度，就會無法進入該族的村落中。<newline><newline>注：</black><dark_green><italic>皇城</italic></dark_green><black>不在此限，任何人均可進入。</black>"
CunChangDanYouDeShiQing:
  Id: "WRITTEN_BOOK"
  Title: "<blue>村長擔憂的事情</blue>"
  Display: "<blue>村長擔憂的事情</blue>"
  Author: "<blue>人族主線</blue>"
  Pages:
    - "最近<dark_green><italic>皇城</italic></dark_green><black>一直傳來不好的消息，似乎是</black><dark_green><italic>皇城</italic></dark_green><black>周遭的動物變得兇暴了。<newline>新生的冒險者，可以麻煩你到<newline></black><dark_green><italic>皇城</italic></dark_green><black>的皇宮找</black><dark_red><underlined>大內總管-李公<newline></underlined></dark_red><dark_red><underlined>公</underlined></dark_red><black>嗎？他會告訴你接下來可以做什麼。<newline>要前往</black><dark_green><italic>皇城</italic></dark_green><black>的話，可以從</black><dark_green><italic>村莊<newline></italic></dark_green><dark_green><italic>大門</italic></dark_green><black>離開，就可以直接到達</black><dark_green><italic>皇<newline></italic></dark_green><dark_green><italic>城</italic></dark_green><black>了。</black>"
LiGongGongDeWeiTuo:
  Id: "WRITTEN_BOOK"
  Title: "<blue>李公公的委託</blue>"
  Display: "<blue>李公公的委託</blue>"
  Author: "<blue>人族主線</blue>"
  Pages:
    - "啊，新面孔，見到你真好。有沒有意願到宮裡來當差阿？長那麼俊俏去當探險者真是可惜了……<newline>好啦，不玩了，事情是這樣的，最近阿，<dark_green><italic>皇城</italic></dark_green><black>頻頻接到周圍村莊被野獸入侵破壞的消息，</black><dark_red><underlined>皇上</underlined></dark_red><black>為此深感擔憂，所以便決定派遣冒險者到</black><dark_green><italic>皇城</italic></dark_green><black>四周去看看。<newline>你們就先到東邊</black><dark_green><italic>龍鱗森林</italic></dark_green><black>中的</black><dark_green><italic>龍鬚鎮</italic></dark_green><black>去看看吧，</black><dark_red><underlined>鎮長王卯</underlined></dark_red><black>應該能告訴你們更詳細的情況。<newline></black>"
    - "啊對了，你第一次來<dark_green><italic>皇城</italic></dark_green><black>吧？這裡有一張簡單的</black><blue>皇城地圖</blue><black>，就拿去用吧。<newline></black><dark_green><italic>皇宮</italic></dark_green><black>在城的北邊，</black><dark_green><italic>皇宮</italic></dark_green><black>內的西邊是</black><dark_green><italic>藏經閣</italic></dark_green><black>，東邊是</black><dark_red><underlined>護國法師</underlined></dark_red><black>的</black><dark_green><italic>護國殿</italic></dark_green><black>。<newline></black><dark_green><italic>煉丹房</italic></dark_green><black>在城的東方，西南方則是</black><dark_green><italic>鐵匠舖</italic></dark_green><black>，</black><dark_green><italic>錢莊</italic></dark_green><black>和</black><dark_green><italic>市場</italic></dark_green><black>。<newline>整備一下就前往東邊的</black><dark_green><italic>森林</italic></dark_green><black>吧，從</black><dark_green><italic>東門</italic></dark_green><black>出去就會看到了。<newline><newline>注：請用</black><blue>人族證明</blue><black>向</black><dark_red><underlined>李公公</underlined></dark_red><black>換取</black><blue>地圖</blue><black></black>"
QingLongFenHun:
  Id: "WRITTEN_BOOK"
  Title: "<blue>青龍分魂</blue>"
  Display: "<blue>青龍分魂</blue>"
  Author: "<blue>人族主線</blue>"
  Pages:
    - "你好，這裡是<dark_green><italic>青龍神廟</italic></dark_green><black>，我是</black><dark_red><underlined>青<newline></underlined></dark_red><dark_red><underlined>龍大人</underlined></dark_red><black>的分魂。<newline>我知道你的來意，我得很遺憾地告訴你，結界的力量確實在減弱中。</black><dark_red><underlined>青龍大人</underlined></dark_red><black>不知道什麼時候才會回來，再這樣下去，結界最終將會完全消失，世界的秩序會崩潰的……<newline>雖然很急，但是我也沒辦法做什麼，因為我只是</black><dark_red><underlined>青龍大人</underlined></dark_red><black>的一縷意識罷了，再者我也沒辦法離開</black><dark_green><italic>神廟</italic></dark_green><black>的範圍。<newline></black>"
    - "不過所幸<dark_green><italic>祭壇</italic></dark_green><black>目前還剩下一些能量，足夠給通過試煉者青龍的祝福，我希望你能夠通過試煉，或許等得到了祝福，你能感應到</black><dark_red><underlined>青龍大人</underlined></dark_red><black>現在的位置，告訴他結界減弱的危機……<newline>如果還是不行的話，可能就需要其他三</black><dark_green><italic>聖獸祭壇</italic></dark_green><black>的幫助了。<newline>青龍試煉可以從</black><dark_green><italic>神廟的二樓</italic></dark_green><black>雕像進行。<newline><newline>注：通過青龍試煉之後請回到</black><dark_green><italic>皇城</italic></dark_green><black>找</black><dark_red><underlined>李公公</underlined></dark_red><black>答覆現況。</black>"
SouJiZhuFuZhiLi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>蒐集祝福之力</blue>"
  Display: "<blue>蒐集祝福之力</blue>"
  Author: "<blue>[必讀]人族主線</blue>"
  Pages:
    - "原來如此……所以你得到了青龍祝福之後，還是無法感知<dark_red><underlined>聖獸</underlined></dark_red><black>的位置嗎……<newline>看來就跟</black><dark_red><underlined>分魂</underlined></dark_red><black>說的一樣，可能得到</black><dark_red><underlined>四聖獸</underlined></dark_red><black>的完整祝福之後，就能夠感覺到</black><dark_red><underlined>聖獸</underlined></dark_red><black>們的位置吧。<newline>這樣吧，你先到南邊的</black><dark_green><italic>朱雀祭<newline></italic></dark_green><dark_green><italic>壇</italic></dark_green><black>，西邊的</black><dark_green><italic>白虎祭壇</italic></dark_green><black>和北邊的<newline></black><dark_green><italic>玄武祭壇</italic></dark_green><black>看看情況，如果蒐集到了全部的祝福，就到</black><dark_green><italic>皇宮東<newline></italic></dark_green><dark_green><italic>側</italic></dark_green><black>找</black><dark_red><underlined>護國法師</underlined></dark_red><black>，我想有了祝福的力量，他應該有辦法找到</black><dark_red><underlined>聖<newline></underlined></dark_red><dark_red><underlined>獸</underlined></dark_red><black>的位置。<newline></black>"
    - "另外，<dark_red><underlined>法師</underlined></dark_red><black>那邊也有一面</black><dark_green><italic>重華<newline></italic></dark_green><dark_green><italic>鏡</italic></dark_green><black>，只要是曾經去過的</black><dark_green><italic>祭壇</italic></dark_green><black>，用鏡子就可以直接到達了，若是試煉的途中失敗了，可以從那裏直接回到</black><dark_green><italic>祭壇</italic></dark_green><black>，重新進行試煉。<newline><newline></black><dark_red>注：請務必將四聖獸的祝福<newline></dark_red><dark_red>之力蒐集完全之後再進行下<newline></dark_red><dark_red>一階段的任務，否則你將無法<newline></dark_red><dark_red>前往下一個任務的指定地點<newline></dark_red><dark_red>。</dark_red><black></black>"
LianDanFaDeLaiYuan:
  Id: "WRITTEN_BOOK"
  Title: "<blue>煉丹法的來源</blue>"
  Display: "<blue>煉丹法的來源</blue>"
  Author: "<blue>藥童</blue>"
  Pages:
    - "欸？你問我為什麼煉丹要這麼煉？<newline>這有什麼好問的阿？該不會你連<blue>基礎煉丹法</blue><black>都沒讀熟嗎？<newline>諾，就是這本。不過這本不能給你，這是我親自到</black><dark_green><italic>皇宮</italic></dark_green><black>領來的。<newline>你想要的話，自己去找</black><dark_red><underlined>大內總<newline></underlined></dark_red><dark_red><underlined>管李公公</underlined></dark_red><black>要一份吧。<newline>裡面基礎的煉丹方法都寫得非常清楚呢。<newline></black>"
    - "甚至還講解如何捕捉<black><underlined>妖怪</underlined></black><black>取<newline></black><blue>內丹</blue><black>，是非常實用的一本書喔。</black>"
GuanWuJiChuLianDanFa:
  Id: "WRITTEN_BOOK"
  Title: "<blue>關於基礎煉丹法</blue>"
  Display: "<blue>關於基礎煉丹法</blue>"
  Author: "<blue>大內總管-李公公</blue>"
  Pages:
    - "咦？你要領取<blue>基礎煉丹法</blue><black>？<newline>可是今年度的早就算好了啊，怎麼會少？<newline>太糟糕了，枉費我號稱「精打細算」，我這就去找一本給你囉。<newline>啥？不用了？那你這小傢伙到底是來找我做啥的？<newline>喔......想問這</black><blue>基礎煉丹法</blue><black>是誰寫的？<newline>這還用問啊，這當然是</black><black><underlined>神族</underlined></black><black>煉丹的第一把交椅-</black><dark_red><underlined>太上老君神<newline></underlined></dark_red><dark_red><underlined>上</underlined></dark_red><black>，親自撰寫的囉。<newline></black>"
    - "他可是唯一一位研究出<blue>特殊<newline></blue><blue>藥引</blue><black>和</black><blue>特殊丹藥</blue><black>的丹神呢。<newline>有了這本</black><blue>基礎煉丹法</blue><black>，我們可以更容易煉製出</black><blue>上品仙丹</blue><black>。<newline>又可以順便剷除那些對環境有害的</black><black><underlined>妖族妖怪</underlined></black><black>，真是一舉數得呢。<newline>如果對</black><blue>基礎煉丹法</blue><black>有不懂的地方，也只能親自請教</black><dark_red><underlined>太上老<newline></underlined></dark_red><dark_red><underlined>君</underlined></dark_red><black>了。<newline>你問我他在哪裡？這我也不太清楚。<newline></black>"
    - "不過或許你可以到<dark_green><italic>南方沙漠<newline></italic></dark_green><dark_green><italic>邊境的溫泉客棧</italic></dark_green><black>問問看，<newline>那間客棧兼做</black><dark_green><italic>情報屋</italic></dark_green><black>，或許會知道</black><dark_red><underlined>太上老君</underlined></dark_red><black>在哪裡。<newline></black><dark_green><italic>客棧</italic></dark_green><black>就在</black><dark_green><italic>皇城西南方</italic></dark_green><black>，在</black><dark_green><italic>沙漠</italic></dark_green><black>和</black><dark_green><italic>虎爪山森林</italic></dark_green><black>的交界處，應該挺好找的。</black>"
JiChangLuLuDeMaiKeFeng:
  Id: "WRITTEN_BOOK"
  Title: "<blue>飢腸轆轆的麥剋蜂</blue>"
  Display: "<blue>飢腸轆轆的麥剋蜂</blue>"
  Author: "<blue>辛齊天</blue>"
  Pages:
    - "啊，真是太感謝你了，你真的找到了牠！不過，牠看起來非常飢餓啊......想請問你知道這裡哪裡有<blue>高等級的蜂蜜</blue><black>嗎？<newline>......你說在</black><dark_green><italic>皇宮</italic></dark_green><black>裡？可是我身手很差，絕對不可能偷到蜂蜜的啊......<newline>什麼，大俠你可以幫我？真是太感謝你了！<newline>那麼就請你到</black><dark_green><italic>皇宮</italic></dark_green><black>幫我「借」一點蜂蜜回來吧。印象中，</black><dark_green><italic>皇宮</italic></dark_green><black>中吃得東西都是由御膳房打理的吧？我想蜂蜜一定就放在那裡，麻煩你了！</black>"
XinYaoFangDeCeShi:
  Id: "WRITTEN_BOOK"
  Title: "<blue>新藥方的測試</blue>"
  Display: "<blue>新藥方的測試</blue>"
  Author: "<blue>辛齊天</blue>"
  Pages:
    - "大俠你是我的恩人！這樣一來小麥就能好好的生產毒液了！<newline>對了，我最近正在研發新的藥方，我發現如果在丹藥中加入<blue>人蔘</blue><black>，就能增加丹藥抵抗各種毒性的功效。<newline>只是，我稍早去藥舖抓藥的時候，掌櫃跟我說，最近的</black><blue>人蔘</blue><black>都被</black><dark_green><italic>鳳花樓</italic></dark_green><black>的一位公子收購走了，所以缺貨的很嚴重。<newline>如果大俠你能帶給我三條</black><blue>人<newline></blue><blue>蔘</blue><black>，我相信我就能做出對抗各類毒性的丹藥來了。</black>"
ShiZongDeChongWu:
  Id: "WRITTEN_BOOK"
  Title: "<blue>失蹤的寵物</blue>"
  Display: "<blue>失蹤的寵物</blue>"
  Author: "<blue>辛齊天</blue>"
  Pages:
    - "喔不，跟著我許多年的寵物麥剋蜂失蹤了，我得趕快找到牠......<newline>咦，這位好心的大俠你可以幫助我？真的嗎？<newline>太好了，多一個人手總是有幫助的......<newline>我家的寵物小麥是一種很稀有的蜜蜂，因為他們的毒性霸道，毒液可以用來製作丹藥，利用以毒攻毒的原理，讓服用的人百毒不侵。"
    - "他們對聲音非常的敏感，一生只會認一個主人。大概是我的聲音比較特別吧，受到了小麥的青睞，所以他便跟著我了。但是小麥有個缺點，他很愛吃，尤其嗜吃蜂蜜......<newline>我們剛到<dark_green><italic>皇城</italic></dark_green><black>，他就一股腦兒的飛了出去，大概又是聞到了哪一家傳出來的香味吧。<newline>可否請你幫我找找？我家就在</black><dark_green><italic>南門</italic></dark_green><black>旁邊，找到的話麻煩把牠帶到我家門口的箱子吧，謝謝你了！</black>"
