ZhanYiJieFangZhenYaoTaJinGongFangZhiNan:
  Id: "WRITTEN_BOOK"
  Title: "<gold>戰役-解放鎮妖塔-進攻方指南</gold>"
  Display: "<gold>戰役-解放鎮妖塔-進攻方指南</gold>"
  Author: "<blue>葉靈谷游擊隊長-唐狼</blue>"
