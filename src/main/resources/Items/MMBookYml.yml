ZhanBeiBuGeiLingQuShuoMing:
  Id: "WRITTEN_BOOK"
  Title: "<gold>戰備補給領取說明</gold>"
  Display: "<gold>戰備補給領取說明</gold>"
  Author: "<blue>補給品管理人-何聲量</blue>"
  Pages:
    - "你好，你可以在我這裡領取我族的補給品，你會獲得隨機的物資。<newline>不過，每個人一個時辰只能領取一次，領取過了之後，等時間到了，我會通知你的。<newline>此外，與我族有關的戰役發生時，戰役的結果會影響補給品物資的數量，所以請盡量贏得每一場戰役吧。<newline><newline>我們的補給品內容是一些<blue>基<newline></blue><blue>本元素</blue><black>和</black><blue>鑰匙</blue><black>等，希望對你的旅程會有所幫助。</black>"
GuanWuZhanShenZuDeChuanQiChiYou:
  Id: "WRITTEN_BOOK"
  Title: "<blue>關於戰神族的傳奇-蚩尤</blue>"
  Display: "<blue>關於戰神族的傳奇-蚩尤</blue>"
  Author: "<blue>瞻仰戰神聯盟盟主雕像的男子</blue>"
  Pages:
    - "你想知道這位<dark_red><underlined>傳奇人物</underlined></dark_red><black>過去？既然你有興趣，我也就多說兩句吧。<newline></black><dark_red><underlined>前族長蚩尤</underlined></dark_red><black>，是一位<underlined>妖族</underlined></black><black>的勇者。他原本是早先</black><dark_green><italic>戰神聯盟</italic></dark_green><black>的</black><dark_red><underlined>盟主</underlined></dark_red><black>，在<underlined>神族</underlined></black><black>襲擊</black><dark_green><italic>聯盟根據<newline></italic></dark_green><dark_green><italic>地</italic></dark_green><black>的那場戰役中，他帶領著我們的祖先來到了這塊</black><dark_green><italic>蠻荒之<newline></italic></dark_green><dark_green><italic>地</italic></dark_green><black>，並且將這裡整治成了可以生活的家園。<newline>此外，為了訓練我們，他在這裡建立了一個</black><dark_green><italic>試煉之地</italic></dark_green><black>，並且將他手上有的寶物存放在此處，做為族人通過試煉的獎品。</black>"
    - "一直到百年以前，<dark_red><underlined>前族長</underlined></dark_red><black>覺得族裡的實力已經足夠，才派遣了族人回到</black><dark_green><italic>盤古大陸</italic></dark_green><black>探探消息，也才有了伏擊</black><dark_green><italic>四獸廟宇</italic></dark_green><black>的計畫。<newline>不過消息傳回來了以後大家非常驚訝，原來大陸內地的<underlined>妖<newline></underlined>族</black><black>和<underlined>人仙二族</underlined></black><black>已經起內鬨到了互相殺害彼此的地步。</black>"
    - "雖然還不理解原因，但是<dark_red><underlined>前族長</underlined></dark_red><black>非常的擔憂，於是在交待了族內的事情之後，卸下族長的職務，便孤身一人返回了</black><dark_green><italic>盤古<newline></italic></dark_green><dark_green><italic>大陸</italic></dark_green><black>，想必是回到了<underlined>妖族</underlined></black><black></black><dark_green><italic>領地</italic></dark_green><black>吧。<newline>不知道</black><dark_red><underlined>蚩尤前族長</underlined></dark_red><black>現在過得好不好，也希望<underlined>三族</underlined></black><black>的鬥爭能早日平息，畢竟我們的敵人從來都不是彼此，而是那囂張跋扈，眼高於頂的<underlined>神族</underlined></black><black>。</black>"
LingXiaoGeBuGeiGuiZe:
  Id: "WRITTEN_BOOK"
  Title: "<gold>凌霄閣補給規則</gold>"
  Display: "<gold>凌霄閣補給規則</gold>"
  Author: "<blue>凌霄閣閣主-羅元上仙</blue>"
