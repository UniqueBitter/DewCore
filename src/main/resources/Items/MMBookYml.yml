    - "你好，你可以在我這裡領取我族的補給品，你會獲得隨機的物資。<newline>不過，每個人一個時辰只能領取一次，領取過了之後，等時間到了，我會通知你的。<newline>此外，與我族有關的戰役發生時，戰役的結果會影響補給品物資的數量，所以請盡量贏得每一場戰役吧。<newline><newline>我們的補給品內容是一些<blue>基<newline></blue><blue>本元素</blue><black>和</black><blue>江湖心得</blue><black>，希望對你的旅程會有所幫助。</black>"
ZhuQueDeShiLian:
  Id: "WRITTEN_BOOK"
  Title: "<blue>朱雀的試煉</blue>"
  Display: "<blue>朱雀的試煉</blue>"
  Author: "<blue>朱雀分魂</blue>"
  Pages:
    - "啊......好睏啊......<dark_red><underlined>朱雀大人</underlined></dark_red><black>怎麼還不回來......<newline>恩？你是誰？為了祝福而來...原來如此。<newline>那麼，你們就得通過</black><dark_red><underlined>朱雀大人</underlined></dark_red><black>設下的考驗，才能獲得大人的祝福喔。<newline>想參加考驗的話，就從神廟供桌上的傳送陣前往吧。<newline>只要能證明你旺盛的生命力，就能獲得朱雀的祝福。</black>"
