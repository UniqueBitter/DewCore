XianQiPuZhangGuiDeZhaoDai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>仙器舖掌櫃的招待</blue>"
  Display: "<blue>仙器舖掌櫃的招待</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "喔喔新面孔，你好你好啊，這位道友，小店賣的法寶都是最經濟實惠的，你看看這紮實的<blue>飛<newline></blue><blue>劍</blue><black>，這華麗的</black><blue>長弓</blue><black>，放心，只收你一萬兩黃金就好...…欸欸你別走阿，好吧那打五折…...不然三折？......什麼嘛原來你有</black><blue>兌換<newline></blue><blue>券</blue><black>阿，早說嘛我就不用跟你廢話………啊不是，是介紹那麼多了。你跟旁邊的那位換點合用的裝備和屬於你職業的</black><blue>仙器</blue><black>吧。領完就可以走了，去</black><dark_green><italic>靈丹<newline></italic></dark_green><dark_green><italic>舖</italic></dark_green><black>找那邊的</black><dark_red><underlined>掌櫃</underlined></dark_red><black>吧，</black>"
    - "他也會給你一些好東西的。領完就快走吧，別妨礙我做生意嘿。"
LingDanPuZhangGuiDeZhaoDai:
  Id: "WRITTEN_BOOK"
  Title: "<blue>靈丹舖掌櫃的招待</blue>"
  Display: "<blue>靈丹舖掌櫃的招待</blue>"
  Author: "<blue>仙族主線</blue>"
  Pages:
    - "喔……原來是剛飛升的朋友，這邊<blue>基礎的回復丹藥</blue><black>你可以盡量領沒關係。我可不像</black><dark_green><italic>仙器<newline></italic></dark_green><dark_green><italic>舖</italic></dark_green><black>那位吝嗇又卑鄙下流見錢眼開無節操無廉恥不知道飛升上來做什麼的整天只會想著如何偷人油水的沒肩膀沒擔當沒人性不是男……抱歉，情緒激動了點，道友你別在意阿，什麼……？你說我跟</black><dark_red><underlined>那傢伙</underlined></dark_red><black>有過節？才沒有呢，不過就是一開始飛升的時候被那傢伙給騙了用五張</black><blue>兌換券</blue><black>只換了一把</black>"
    - "<blue>爛匕首</blue><black>然後天天被怪殺於是一氣之下決定重新投胎改走煉丹師然後勤練獵妖手段和煉丹術變成仙界如今大名鼎鼎無人不知無人不曉前無古人後無來者的</black><dark_green><italic>第一靈丹舖</italic></dark_green><black></black><dark_red><underlined>大<newline></underlined></dark_red><dark_red><underlined>掌櫃</underlined></dark_red><black>，我絕對不會說只要</black><dark_red><underlined>那傢<newline></underlined></dark_red><dark_red><underlined>伙</underlined></dark_red><black>店裡的人來買</black><blue>丹藥</blue><black>我全部加上百分之一千的手續費用以洩我心頭之恨什麼的……絕對沒有！<newline>啊……總之呢，我想你買些簡單的東西就可以回去找</black><dark_red><underlined>盟主</underlined></dark_red><black>了，</black>"
    - "他應該會分派給你一些工作做的。祝你日益精進囉。"
