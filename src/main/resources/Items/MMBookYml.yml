    - "<bold>戰役說明：<black><newline><newline></black><bold><dark_green><italic>鎮妖塔</italic></dark_green><bold><bold><black>是由一個巨大的八卦太極陣所鎮守，但是太極陣需要</black><bold><bold><bold><bold><dark_red>兩個陣眼</dark_red><bold><bold><bold><bold><bold><bold><bold><bold><black>，分別站在少陰、少陽兩個位置，整個陣法才能起鎮壓作用。所以我們必須想辦法讓鎮守的人盡可能的<newline></black><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><dark_red>離開陣眼的位置</dark_red><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><bold><black>，這樣塔內的同伴才能利用機會逃出來。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "而<dark_green><italic>鎮妖塔</italic></dark_green><black>用來守門的法陣，每天只有短短</black><dark_red>十五分鐘</dark_red><black>的脆弱時間，我們必須抓緊這段時間來癱瘓八卦太極陣。<newline><newline>只要在這段時間有</black><dark_red>三名以上<newline></dark_red><dark_red>的族人成功脫逃出來</dark_red><black>，八卦太極陣就會不攻自破。但是，相反地，如果</black><dark_red>逃出的同伴不夠多</dark_red><black>，這次的偷襲行動便會</black><dark_red>宣告失<newline></dark_red><dark_red>敗</dark_red><black>，切記切記。</black>"
    - "<dark_red><bold>注意事項：<newline><newline></bold></dark_red><dark_red>1.發起戰役時，所有在發起房間<newline></dark_red><dark_red>內的成員都會參加戰役。發<newline></dark_red><dark_red>起後的準備時間，可以再追加<newline></dark_red><dark_red>報名進攻方。<newline></dark_red><dark_red>2.戰役時會統一給予裝備武器<newline></dark_red><dark_red>和道具，請進入戰場之前不要<newline></dark_red><dark_red>攜帶任何東西以免遺失。</dark_red>"
    - "<bold>功勳值與友好度：<black><newline><newline>參加戰役後，對各族的友好度都會有一些改變，也會獲得功勳值。而戰役的成敗均會影響到獲取的功勳值和友好度。<newline>功勳值可以在</black><bold><dark_green><italic>皇城南方的忠<newline></italic></dark_green><bold><bold><dark_green><italic>烈祠</italic></dark_green><bold><bold><bold><bold><black>換取頭部的</black><bold><bold><bold><bold><bold><bold><bold><bold><gold></gold></bold>造型時裝<black>，時裝還可以附有特殊能力，對於戰鬥力的提昇很有幫助。</black></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold></bold>"
    - "而友好度的部份，在解放鎮妖塔的戰役，參與<black><underlined>妖族</underlined></black><black>進攻的話，將會提昇</black><black><underlined>妖族</underlined></black><black>友好度，但是</black><black><underlined>人<newline></underlined></black><black><underlined>仙二族</underlined></black><black>友好度將會下降。<newline>請注意，某一族的友好度下降到一定程度，就會無法進入該族的村落中。<newline><newline>注：</black><dark_green><italic>皇城</italic></dark_green><black>不在此限，任何人均可進入。</black>"
